// On-device text recognition
// ================================================================

// On-device text recognition with Tesseract.js (loaded from a CDN on first use).
// The language data (~4 MB) downloads once and is then cached by the browser.


const TESSERACT_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
const MAX_SIDE = 2400; // text reads most accurately around this size; also keeps memory low on phones

let scriptPromise = null;
let workerPromise = null;
let progressHandler = null;
let quiet = false; // true while reading fraction digits, so progress doesn't jump around

function loadScript() {
  if (window.Tesseract) return Promise.resolve();
  if (scriptPromise) return scriptPromise;
  scriptPromise = new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = TESSERACT_URL;
    el.async = true;
    el.onload = resolve;
    el.onerror = () => {
      scriptPromise = null;
      el.remove();
      reject(new Error('The text reader could not load. Connect to the internet and try again (it works offline after the first scan).'));
    };
    document.head.appendChild(el);
  });
  return scriptPromise;
}

async function getWorker() {
  await loadScript();
  if (!workerPromise) {
    workerPromise = (async () => {
      const worker = await window.Tesseract.createWorker('eng', 1, {
        logger: m => !quiet && progressHandler && progressHandler(m),
      });
      await worker.setParameters({ tessedit_pageseg_mode: '3' }); // automatic layout: keeps paragraphs apart
      return worker;
    })().catch(err => { workerPromise = null; throw err; });
  }
  return workerPromise;
}

// The reader works in the background. A phone can stop it when memory runs short, and then
// it never answers, so every read gets a time limit and a stalled reader is replaced.
const READ_LIMIT_MS = 150000, DIGIT_LIMIT_MS = 20000;
class ReaderStalled extends Error {}
async function within(promise, ms) {
  let timer;
  try {
    return await Promise.race([promise, new Promise((_, reject) => { timer = setTimeout(() => reject(new ReaderStalled()), ms); })]);
  } finally { clearTimeout(timer); }
}
async function resetWorker() {
  const pending = workerPromise;
  workerPromise = null;
  try { const w = await within(pending, 3000); await within(w.terminate(), 3000); } catch {}
}
// Let the screen respond to taps between the heavy steps of a scan.
const breathe = () => new Promise(resolve => setTimeout(resolve, 0));

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(`${file.name || 'That file'} isn't an image this browser can open. Try a JPEG or PNG.`)); };
    img.src = url;
  });
}

// Grayscale + contrast stretch. Returns the canvas plus its gray pixels for fraction repair.
async function prepareForOCR(file) {
  const img = await loadImage(file);
  const longSide = Math.max(img.naturalWidth, img.naturalHeight);
  let scale = 1;
  if (longSide > MAX_SIDE) scale = MAX_SIDE / longSide;
  else if (longSide < 1400) scale = Math.min(2, 1400 / longSide);
  const w = Math.round(img.naturalWidth * scale);
  const h = Math.round(img.naturalHeight * scale);

  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, w, h);

  const data = ctx.getImageData(0, 0, w, h);
  const px = data.data;
  const gray = new Uint8Array(w * h);
  const hist = new Uint32Array(256);
  for (let i = 0, j = 0; i < px.length; i += 4, j++) {
    const g = (px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114) | 0;
    gray[j] = g; hist[g]++;
  }
  const total = w * h;

  // Mostly-dark page. The reader wants dark text on a light page, so flip it.
  let acc0 = 0, median = 0;
  for (; median < 255; median++) { acc0 += hist[median]; if (acc0 >= total / 2) break; }
  let flat = 0;
  for (let v = Math.max(0, median - 10); v <= Math.min(255, median + 10); v++) flat += hist[v];
  if (median < 100 && flat >= total * 0.45) {
    // An app in dark mode (flat background): invert, keeping the soft letter edges,
    // which read far better than hard black-and-white ("Ragt", "chets" otherwise).
    for (let j = 0; j < gray.length; j++) gray[j] = 255 - gray[j];
    hist.reverse();
  } else if (median < 100) {
    // White caption text over a busy video frame: keep only the bright text.
    for (let j = 0, i = 0; j < gray.length; j++, i += 4) {
      const v = gray[j] > 185 ? 0 : 255;
      gray[j] = v;
      px[i] = px[i + 1] = px[i + 2] = v;
    }
    ctx.putImageData(data, 0, 0);
    return { canvas, gray, width: w, height: h };
  }

  // Ignore the darkest/lightest 1% so stray shadows don't flatten the stretch.
  let lo = 0, hi = 255, acc = 0;
  for (; lo < 255; lo++) { acc += hist[lo]; if (acc > total * 0.01) break; }
  acc = 0;
  for (; hi > 0; hi--) { acc += hist[hi]; if (acc > total * 0.01) break; }
  const range = Math.max(1, hi - lo);
  for (let j = 0, i = 0; j < gray.length; j++, i += 4) {
    const v = Math.max(0, Math.min(255, ((gray[j] - lo) * 255) / range)) | 0;
    gray[j] = v;
    px[i] = px[i + 1] = px[i + 2] = v;
  }
  ctx.putImageData(data, 0, 0);
  return { canvas, gray, width: w, height: h };
}

// Draw one fraction digit (only its own pixels) at a fixed height with generous margins,
// the layout single-character recognition handles best.
function digitCanvas(part, gray, W, digitHeight) {
  const w = part.x1 - part.x0, h = part.y1 - part.y0;
  const small = document.createElement('canvas');
  small.width = w; small.height = h;
  const sctx = small.getContext('2d');
  const img = sctx.createImageData(w, h);
  img.data.fill(255);
  for (let i = 0; i < part.pts.length; i += 2) {
    const x = part.pts[i], y = part.pts[i + 1], v = gray[y * W + x], o = ((y - part.y0) * w + (x - part.x0)) * 4;
    img.data[o] = img.data[o + 1] = img.data[o + 2] = v;
  }
  sctx.putImageData(img, 0, 0);
  const s = digitHeight / h, pad = Math.round(digitHeight * 0.35);
  const c = document.createElement('canvas');
  c.width = Math.round(w * s) + 2 * pad; c.height = digitHeight + 2 * pad;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(small, pad, pad, Math.round(w * s), digitHeight);
  return c;
}

/**
 * Read one or more photos or screenshots of a recipe, in any order.
 * onProgress receives { label, fraction } with fraction from 0 to 1.
 * Returns { text, lines, titleHint } ready for parseRecipeText.
 */
async function readRecipePhotos(files, onProgress = () => {}) {
  const count = files.length;
  let page = 0;
  const label = () => (count > 1 ? `Reading photo ${page + 1} of ${count}` : 'Reading the recipe');
  progressHandler = m => {
    if (m.status === 'recognizing text') onProgress({ label: label(), fraction: (page + (m.progress || 0) * 0.9) / count });
    else if (/load|initializ/.test(m.status)) onProgress({ label: 'Getting the text reader ready', fraction: 0 });
  };

  onProgress({ label: 'Getting the text reader ready', fraction: 0 });
  const worker = await within(getWorker(), READ_LIMIT_MS).catch(async err => {
    if (err instanceof ReaderStalled) { await resetWorker(); throw new Error('The text reader didn’t start. Check your connection and try again.'); }
    throw err;
  });

  const pages = [];
  try {
    for (page = 0; page < count; page++) {
      onProgress({ label: label(), fraction: page / count });
      await breathe();
      const prepared = await prepareForOCR(files[page]);
      await breathe();
      let { data } = await within(worker.recognize(prepared.canvas, {}, { text: true, blocks: true }), READ_LIMIT_MS);

      // A fragmented read means the automatic layout split a text column: reread the
      // page as one block of text and keep whichever read is cleaner.
      const first = fragmentation(pageFromOCR(data, prepared.width, prepared.height));
      if (first > 0.15) {
        onProgress({ label: `${label()} (second pass)`, fraction: (page + 0.5) / count });
        await worker.setParameters({ tessedit_pageseg_mode: '6' });
        const retry = (await within(worker.recognize(prepared.canvas, {}, { text: true, blocks: true }), READ_LIMIT_MS)).data;
        await worker.setParameters({ tessedit_pageseg_mode: '3' });
        if (fragmentation(pageFromOCR(retry, prepared.width, prepared.height)) < first) data = retry;
      }

      // Repair misread fractions (½, ¼, ¾…) by reading their digits one at a time.
      const words = (data.blocks || []).flatMap(b => b.paragraphs.flatMap(p => p.lines.flatMap(l => l.words)));
      let digitMode = false;
      quiet = true;
      await repairFractions(words, prepared.gray, prepared.width, prepared.height, async part => {
        if (!digitMode) {
          await worker.setParameters({ tessedit_pageseg_mode: '10', tessedit_char_whitelist: '0123456789' });
          digitMode = true;
        }
        for (const size of [48, 72]) {
          const r = await within(worker.recognize(digitCanvas(part, prepared.gray, prepared.width, size)), DIGIT_LIMIT_MS);
          const digit = (r.data.text || '').trim().slice(0, 1);
          if (/^[1-9]$/.test(digit)) return digit;
        }
        return '';
      });
      if (digitMode) await worker.setParameters({ tessedit_pageseg_mode: '3', tessedit_char_whitelist: '' });

      // Screenshots: reread the header bar (the recipe's name) on its own, at double size.
      if (isScreenshot(prepared.width, prepared.height)) {
        const { top, bottom } = headerBand(prepared.height);
        const strip = document.createElement('canvas');
        strip.width = prepared.width * 2; strip.height = (bottom - top) * 2;
        const sctx = strip.getContext('2d');
        sctx.imageSmoothingQuality = 'high';
        sctx.drawImage(prepared.canvas, 0, top, prepared.width, bottom - top, 0, 0, strip.width, strip.height);
        await worker.setParameters({ tessedit_pageseg_mode: '6' });
        const hdr = (await within(worker.recognize(strip, {}, { text: true, blocks: true }), READ_LIMIT_MS)).data;
        await worker.setParameters({ tessedit_pageseg_mode: '3' });
        data = mergeHeader(data, hdr, top, bottom, 2);
      }
      quiet = false;

      const pageResult = pageFromOCR(data, prepared.width, prepared.height);
      pageResult.secondPass = first > 0.15;
      pages.push(pageResult);
    }
  } catch (err) {
    if (err instanceof ReaderStalled) {
      await resetWorker();
      throw new Error('The text reader stopped responding. Try again; if it keeps happening, scan fewer photos at a time.');
    }
    // A failed read can leave the reader in single-digit mode; start fresh next time.
    await resetWorker();
    throw err;
  } finally {
    progressHandler = null;
    quiet = false;
  }

  onProgress({ label: 'Putting the pages together', fraction: 1 });
  const { lines, titleHint, sourceHint, gaps } = assemblePages(pages);
  return {
    text: linesToText(lines),
    assembled: lines,
    lines: pages.flatMap(p => p.lines.map(l => ({ text: l.text, height: l.height }))),
    titleHint, sourceHint, gaps,
    // For troubleshooting: what was read on each photo, line by line.
    report: pages.map((p, i) => `--- Photo ${i + 1} (${p.width}×${p.height}${p.secondPass ? ', reread as one block' : ''}) ---\n`
      + p.lines.map(l => `${Math.round(l.y0 / p.height * 100)}%  ${l.text}`).join('\n')).join('\n\n'),
  };
}

// Shrink a photo for storage alongside the recipe.
async function compressPhoto(file, maxSide = 1400, quality = 0.8) {
  const img = await loadImage(file);
  const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(img.naturalWidth * scale);
  canvas.height = Math.round(img.naturalHeight * scale);
  canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', quality);
}

function metaSentence(r) {
  const parts = [];

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }
}

async function shareText(text) {
  if (navigator.share) {
    try { await navigator.share({ text }); return 'shared'; }
    catch (err) { if (err && err.name === 'AbortError') return 'cancelled'; }
  }
  return (await copyText(text)) ? 'copied' : 'failed';
}

// ---------- iOS keyboard ----------
// In iOS 26, closing the keyboard can leave the page shifted: the tab bar and buttons look
// right but taps land in the wrong place. Nudging the scroll position makes WebKit
// re-sync the viewport. Runs once the keyboard has finished closing.
const TYPING = 'input:not([type=checkbox]):not([type=radio]):not([type=file]), textarea, select, [contenteditable]';
function settleViewport() {
  const vv = window.visualViewport;
  if (!vv || (vv.offsetTop < 1 && window.innerHeight - vv.height < 1)) return;
  if (vv.scale > 1.01) return; // pinch-zoomed on purpose
  const x = window.scrollX, y = window.scrollY;
  window.scrollTo(x, y + 1);
  window.scrollTo(x, y);
}
let settleTimer;
function settleSoon() {
  clearTimeout(settleTimer);
  settleTimer = setTimeout(() => {
    const a = document.activeElement;
    if (a && a.matches && a.matches(TYPING)) return; // moved on to another field
    settleViewport();
  }, 400);
}
document.addEventListener('focusout', e => { if (e.target.matches && e.target.matches(TYPING)) settleSoon(); });
window.visualViewport?.addEventListener('resize', settleSoon);

// ---------- the header ----------
// A bar pinned at the top (back button, actions, a small title) over a large title that
// scrolls up under it, with the theme's trim locking just below the bar. The layout itself
// is plain scrolling and sticky positioning; this only measures the header once per screen
// (and whenever it changes size) and flips a couple of classes as you scroll.
const rootEl = document.documentElement;
const hdr = { band: null, nav: null, title: null, threshold: Infinity, end: Infinity, collapsed: null, scrolled: null, past: null, stretch: 1 };
const hdrResize = typeof ResizeObserver === 'function' ? new ResizeObserver(() => measureHeader()) : null;
function measureHeader() {
  const band = view.querySelector('.band');
  if (band !== hdr.band) {
    hdrResize?.disconnect();
    if (band) hdrResize?.observe(band);
    hdr.band = band; hdr.collapsed = hdr.scrolled = hdr.past = null; hdr.stretch = 1;
  }
  hdr.nav = view.querySelector('.navbar');
  const home = !band || band.classList.contains('band-home');
  if (rootEl.dataset.view !== (home ? 'home' : 'page')) {
    rootEl.dataset.view = home ? 'home' : 'page';
    window.rbPaintBars();
  }
  if (!band) { rootEl.style.setProperty('--hdr-h', '0px'); hdr.threshold = hdr.end = Infinity; return updateHeader(); }
  // offsets, not boxes, so the pull-down stretch on the title doesn't skew them
  const top = band.offsetTop, navH = hdr.nav ? hdr.nav.querySelector('.nav-row').offsetHeight : 0;
  const bottom = top + band.offsetHeight;
  rootEl.style.setProperty('--hdr-h', bottom + 'px');
  hdr.title = band.querySelector('.sign-plate, .sign');
  hdr.threshold = hdr.title ? top + hdr.title.offsetTop + hdr.title.offsetHeight * .8 - navH : 0;
  hdr.end = bottom - navH;
  updateHeader();
}
function updateHeader() {
  const y = window.scrollY;
  const collapsed = y > hdr.threshold;
  if (collapsed !== hdr.collapsed) { hdr.collapsed = collapsed; hdr.nav?.classList.toggle('is-collapsed', collapsed); }
  const scrolled = y > 2;
  if (scrolled !== hdr.scrolled) { hdr.scrolled = scrolled; hdr.nav?.classList.toggle('is-scrolled', scrolled); }
  // well past the header the pinned pattern can rest (a bounce at the bottom then shows the page color)
  const past = y > hdr.end + 240;
  if (past !== hdr.past) { hdr.past = past; rootEl.classList.toggle('hdr-past', past); }
  // pulling down past the top swells the large title a touch, as iOS does
  const s = y < 0 && !reducedMotion() ? 1 + Math.min(.07, -y / 1400) : 1;
  if (s !== hdr.stretch && hdr.title) { hdr.stretch = s; hdr.title.style.scale = s === 1 ? '' : s.toFixed(4); }
}
new MutationObserver(measureHeader).observe(view, { childList: true });
window.addEventListener('scroll', updateHeader, { passive: true });
window.addEventListener('resize', measureHeader);
document.fonts?.ready.then(measureHeader);
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => window.rbPaintBars());

// ---------- routing ----------

function route() {
  const [name, id] = location.hash.replace(/^#\/?/, '').split('/');
  return { name: name || 'home', id: id ? decodeURIComponent(id) : null };
}

function render() {
  try { renderScreen(); } catch (err) {
    // Never leave a half-drawn screen behind: show a way out instead.
    console.error(err);
    view.innerHTML = `
      ${band(`<h1 class="sign">Something went wrong</h1>`, '', { left: backTo('#/', 'Recipes'), title: 'Something went wrong' })}
      <section class="card sec">
        <p>This screen couldn't open. Your saved recipes are safe.</p>
        <a class="btn btn-primary" href="#/">Back to recipes</a>
      </section>`;
  }
}

function renderScreen() {
  if (wantWake && route().name !== 'cook') setWakeLock(false); // cook mode keeps the screen on itself
  // Leaving a screen closes anything layered over it.
  closeGlobe(true);
  for (const id of ['sheet', 'photoViewer']) { const d = document.getElementById(id); if (d && d.open) d.close(); }
  const r = route();
  const tab = { home: 'home', recipe: 'home', cook: 'home', settings: 'home', world: 'home', edit: 'new', new: 'new', list: 'list' }[r.name] || 'home';
  document.querySelectorAll('.tab').forEach(t => {
    if (t.dataset.tab === tab) t.setAttribute('aria-current', 'page');
    else t.removeAttribute('aria-current');
  });
  document.body.dataset.view = r.name;

  switch (r.name) {
    case 'home': renderHome(); break;
    case 'recipe': state.recipeTab = { id: r.id, tab: 'recipe' }; renderRecipe(r.id); break; // opening a recipe starts on the recipe itself
    case 'new': renderForm(null); break;
    case 'edit': renderForm(r.id); break;
    case 'list': renderList(); break;
    case 'settings': renderSettings(); break;
    case 'world': renderWorld(); break;
    case 'cook': renderCook(r.id); break;
    default: location.replace('#/'); return;
  }
  window.scrollTo(0, 0);
  view.focus({ preventScroll: true });
}

function notFound() {
  view.innerHTML = `
    ${band(`<h1 class="sign">Not on the menu</h1>`, '', { left: backTo('#/', 'Recipes'), title: 'Not on the menu' })}
    <section class="card sec">
      <p>That recipe may have been deleted.</p>
      <a class="btn btn-primary" href="#/">Back to recipes</a>
    </section>`;
}

// The bar (back, small title, actions), then the full-width header with the large title,
// then the theme's trim.
function band(inner, cls = '', nav = {}) {
  const { left = '', title = '', right = '' } = nav;
  return `
    <div class="navbar">
      <div class="nav-bg" aria-hidden="true"><i></i></div>
      <div class="nav-edge" aria-hidden="true"><i></i></div>
      <div class="nav-row">
        <div class="nav-side nav-left">${left}</div>
        <div class="nav-title" aria-hidden="true"><span>${esc(title)}</span></div>
        <div class="nav-side nav-right">${right}</div>
      </div>
    </div>
    <header class="band ${cls}">${inner}</header><div class="checker" aria-hidden="true"></div>`;
}
const backTo = (href, label) => `<a class="back" href="${href}">${label}</a>`;

// ---------- home: the contents page ----------

function renderHome() {

  const dietChips = DIETS.filter(([k]) => state.recipes.some(r => (r.diet || {})[k])).map(([k, full]) => [`diet:${k}`, full]);
  const filters = [['all', 'All'], ['fav', 'Favorites'], ...dietChips, ...used.map(c => [c, c])];
  if (!filters.some(([k]) => k === state.filter.cat)) state.filter.cat = 'all';

  const isiOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  const showInstall = isiOS && !standalone && !state.settings.installTipDismissed;

  view.innerHTML = `
    ${band(`
      <div class="sign-plate"><h1 class="sign">Recipe Box</h1></div>
      <p class="band-sub" id="bookCount"></p>`, 'band-home',
      { title: 'Recipe Box', right: `<a class="icon-btn band-settings band-world" href="#/world" aria-label="Tastes of the World: themes and the places they come from">${ICONS.globe}</a><a class="icon-btn band-settings" href="#/settings" aria-label="Settings">${ICONS.settings}</a>` })}
    ${showInstall ? `
      <aside class="card notice">
        <p>Keep Recipe Box on your Home Screen: tap Share in Safari, then Add to Home Screen.</p>
        <button class="text-btn" data-action="dismiss-install">Dismiss</button>
      </aside>` : ''}
    <div class="quick-row">
      <button class="btn btn-chip" data-action="paste-recipe">${ICONS.paste}Paste a web recipe</button>
    </div>
    ${state.recipes.length ? `
      <div class="finder">
        <label class="search">
          ${ICONS.search}
          <span class="sr-only">Search recipes</span>
          <input id="search" type="search" placeholder="What are you hungry for?" value="${esc(state.filter.q)}" autocomplete="off" enterkeyhint="search">
        </label>
        <div class="finder-row">
          <div class="chapters" role="group" aria-label="Show">
            ${filters.map(([k, label]) => `<button class="pill-btn" aria-pressed="${state.filter.cat === k}" data-action="filter" data-cat="${esc(k)}">${esc(label)}</button>`).join('')}
          </div>
        </div>
        <label class="sort">Sort
          <select id="sort">
            ${[['az', 'A to Z'], ['newest', 'Newest'], ['rating', 'Top rated'], ['made', 'Most made']]
              .map(([v, l]) => `<option value="${v}" ${state.filter.sort === v ? 'selected' : ''}>${l}</option>`).join('')}
          </select>
        </label>
      </div>` : ''}
    <div class="contents" id="contents"></div>`;
  renderContents();
}

function filteredRecipes() {
  const q = state.filter.q.trim().toLowerCase();
  const list = state.recipes.filter(r => {
    const cat = state.filter.cat;
    if (cat === 'fav' && !r.favorite) return false;
    if (cat.startsWith('diet:') && !(r.diet || {})[cat.slice(5)]) return false;
    if (!['all', 'fav'].includes(cat) && !cat.startsWith('diet:') && r.category !== cat) return false;
    if (!q) return true;
    const hay = [r.title, r.category, r.source, r.sourceSite, r.notes, ...(r.ingredients || [])].join(' ').toLowerCase();
    return q.split(/\s+/).every(word => hay.includes(word));
  });
  const by = {
    newest: (a, b) => b.createdAt - a.createdAt,
    az: (a, b) => a.title.localeCompare(b.title),
    rating: (a, b) => (b.rating || 0) - (a.rating || 0) || a.title.localeCompare(b.title),
    made: (a, b) => (b.timesMade || 0) - (a.timesMade || 0) || a.title.localeCompare(b.title),
  }[state.filter.sort];
  return list.sort(by);
}

function tocRow(r) {
  const sub = [metaSentence(r).replace(/\.$/, ''), r.timesMade ? `made ${plural(r.timesMade, 'time')}` : ''].filter(Boolean).join(', ');
  return `
    <li>
      <a class="toc-row" href="#/recipe/${encodeURIComponent(r.id)}">
        <span class="toc-line">
          <span class="toc-title">${esc(r.title)}${r.favorite ? ' <span class="fav-mark" aria-label="Favorite">♥</span>' : ''}</span>
          <span class="toc-leader" aria-hidden="true"></span>
          <span class="toc-meta">${r.rating ? starsText(r.rating) : '<span class="new-tag">new</span>'}</span>
        </span>
        ${sub || dietBadges(r).length ? `<span class="toc-sub">${esc(sub)}${dietBadges(r).map(b => ' ' + dietBadge(b, 'diet-tag')).join('')}</span>` : ''}
      </a>
      ${!CATEGORIES.includes(r.category) ? `
        <label class="quick-cat">
          <span class="sr-only">Section for ${esc(r.title)}</span>
          <select data-category-for="${esc(r.id)}">
            <option value="">Choose a section</option>
            ${CATEGORIES.map(c => `<option>${esc(c)}</option>`).join('')}
          </select>
        </label>` : ''}
    </li>`;
}

function renderContents() {
  const box = document.getElementById('contents');
  const count = document.getElementById('bookCount');
  if (!box) return;
  count.textContent = state.recipes.length ? `${plural(state.recipes.length, 'recipe')} on the menu` : 'Your menu is empty';

  if (!state.recipes.length) {
    box.innerHTML = `
      <section class="card sec empty">
        <h2 class="sec-title">Nothing on the menu yet</h2>
        <p>Photograph a recipe card or cookbook page, or take screenshots of a recipe app, and Recipe Box will copy out the ingredients and steps.</p>
        <a class="btn btn-primary" href="#/new">Add your first recipe</a>
      </section>`;
    return;
  }
  const list = filteredRecipes();
  if (!list.length) {
    box.innerHTML = `
      <section class="card sec empty">
        <p>No recipes match${state.filter.q ? ` “${esc(state.filter.q)}”` : ' this filter'}.</p>
        <button class="btn btn-secondary" data-action="clear-filters">Show all recipes</button>
      </section>`;
    return;
  }
  // Searching shows one flat list; otherwise the menu is grouped into sections.
  if (state.filter.q.trim()) {
    box.innerHTML = `<section class="card menu"><h2 class="menu-title">${plural(list.length, 'match', 'matches')}</h2><ol class="toc">${list.map(tocRow).join('')}</ol></section>`;
    return;
  }
  const groups = new Map();
  for (const r of list) {
    const key = CATEGORIES.includes(r.category) ? r.category : 'Uncategorized';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  }
  const order = [...CATEGORIES, 'Uncategorized'].filter(c => groups.has(c));
  box.innerHTML = `<div class="card menu">${order.map(c => `
    <section>
      <div class="menu-head">
        <h2 class="menu-title">${esc(c)}</h2>
        ${c === 'Uncategorized' && groups.get(c).some(r => guessCategory(r)) ? '<button class="btn btn-chip" data-action="auto-sort">Sort these for me</button>' : ''}
      </div>
      <ol class="toc">${groups.get(c).map(tocRow).join('')}</ol>
    </section>`).join('')}</div>`;
}

function scalerHtml(factor, labelledBy) {
  return `<div class="scaler" role="group" ${labelledBy ? `aria-labelledby="${labelledBy}"` : 'aria-label="Scale recipe"'}>
    ${SCALES.map(([f, l]) => `<button data-action="scale" data-factor="${f}" aria-pressed="${f === factor}">${l}</button>`).join('')}
  </div>`;
}

function ingredientRow(ing, i, factor, view = 0) {
  const { qty, alt, item, header, convertible } = displayIngredient(ing, factor, view);
  if (header) return `<li class="ing-head" role="presentation"><h3>${esc(item)}</h3></li>`;
  const amount = `<span class="ing-qty-main">${esc(qty)}</span>${alt ? `<span class="ing-alt">${esc(alt)}</span>` : ''}`;
  return `<li class="ing-row" data-index="${i}">
    ${convertible
      ? `<button class="ing-qty convertible" data-action="convert" data-index="${i}" aria-label="${esc(qty)}${alt ? `, or ${esc(alt)}` : ''}. Switch units">${amount}</button>`
      : `<span class="ing-qty">${amount}</span>`}
    <button class="ing" data-action="tick" data-index="${i}" aria-pressed="false"><span class="ing-item">${esc(item)}</span></button>
  </li>`;
}

function recipeToText(r, factor = 1) {
  const out = [r.title];
  const meta = metaSentence(r);
  if (meta) out.push(meta);
  if (r.source) out.push(`From ${r.source}`);
  if (r.ingredients.length) out.push('', 'Ingredients', ...r.ingredients.map(i => (isHeader(i) ? `${i.slice(HEADER_MARK.length)}:` : `- ${scaleIngredient(i, factor)}`)));
  if (r.steps.length) out.push('', 'Method', ...r.steps.map((s, i) => `${i + 1}. ${s}`));
  if (r.notes) out.push('', 'Notes', r.notes);
  return out.join('\n');
}

// ---------- add / edit form ----------

function rowLabel(kind, index, header) {
  return header ? 'Section heading' : kind === 'step' ? `Step ${index + 1}` : `Ingredient ${index + 1}`;
}

let doubtSeq = 0;
// "Not sure about “1hr”" — the note behind the mustard dot.
function doubtNote(words, cls) {
  const id = `doubt-${++doubtSeq}`;
  const list = words.map(w => `<b>${esc(w)}</b>`);
  const joined = list.length > 1 ? `${list.slice(0, -1).join(', ')} and ${list[list.length - 1]}` : list[0];
  return { id, html: `<p class="doubt ${cls}" id="${id}">The scan wasn't sure about ${joined}.</p>` };
}

function editRow(kind, value, index, flag = '', doubt = null) {
  const header = kind === 'ingredient' && isHeader(value);
  const text = header ? value.slice(HEADER_MARK.length) : value;
  const label = rowLabel(kind, index, header);
  const placeholder = header ? 'Section name, e.g. For the sauce' : kind === 'step' ? 'Describe this step' : 'e.g. 1 cup flour';
  const note = doubt && doubt.length ? doubtNote(doubt, 'row-doubt') : null;
  return `
    <li class="edit-row${header ? ' is-header' : ''}${flag ? ' needs-check' : ''}${note ? ' unsure' : ''}" data-kind="${kind}"${header ? ' data-header' : ''}>
      <button type="button" class="grip" data-grip aria-label="Move ${label}. Drag, or use the arrow keys.">${ICONS.grip}</button>
      ${kind === 'step' ? `<span class="row-num" aria-hidden="true">${index + 1}</span>` : ''}
      <textarea class="row-input" rows="${kind === 'step' ? 3 : 1}" aria-label="${label}"${note ? ` aria-describedby="${note.id}"` : ''} enterkeyhint="next" placeholder="${placeholder}">${esc(text)}</textarea>
      <button type="button" class="row-remove" data-action="row-remove" aria-label="Remove ${label}">${ICONS.remove}</button>
      ${flag ? `<p class="row-flag">${esc(flag)}</p>` : ''}
      ${note ? note.html : ''}
    </li>`;
}

function editList(kind, values, flags = {}, doubts = {}) {
  const items = values.length ? values : [''];
  return items.map((v, i) => editRow(kind, v, i, flags[i] || '', doubts[i])).join('');
}

// After a screen renders, grow every notes box to show its whole text.
function fitNotes() { view.querySelectorAll('.notes-input').forEach(autosize); }

function autosize(el) {
  el.style.height = 'auto';
  el.style.height = `${el.scrollHeight + 2}px`;
}

function renumber(list) {
  const kind = list.dataset.kind;
  let n = 0;
  [...list.children].forEach(row => {
    const header = row.hasAttribute('data-header');
    const label = rowLabel(kind, n, header);
    if (!header) n++;
    const num = row.querySelector('.row-num');
    if (num) num.textContent = n;
    row.querySelector('.grip').setAttribute('aria-label', `Move ${label}. Drag, or use the arrow keys.`);
    row.querySelector('.row-input').setAttribute('aria-label', label);
    row.querySelector('.row-remove').setAttribute('aria-label', `Remove ${label}`);
  });
}

function addRow(list, value = '', after = null, focus = true, header = false) {
  const tmp = document.createElement('ol');
  tmp.innerHTML = editRow(list.dataset.kind, header ? HEADER_MARK + value : value, 0);
  const row = tmp.firstElementChild;
  list.insertBefore(row, after ? after.nextElementSibling : null);
  renumber(list);
  const input = row.querySelector('.row-input');
  autosize(input);
  if (focus) input.focus();
  return row;
}

function setListValues(list, values, flags = {}, doubts = {}) {
  list.innerHTML = editList(list.dataset.kind, values, flags, doubts);
  list.querySelectorAll('.row-input').forEach(autosize);
}

function listValues(id) {
  return [...document.querySelectorAll(`#${id} .edit-row`)].map(row => {
    const v = row.querySelector('.row-input').value.replace(/\s+/g, ' ').trim();
    return v && row.hasAttribute('data-header') ? HEADER_MARK + v.replace(/:$/, '') : v;
  }).filter(Boolean);
}

// Drag to reorder (edit screen only). Pointer events work for touch and mouse.
function startDrag(e, grip) {
  const row = grip.closest('.edit-row');
  const list = row.parentElement;
  e.preventDefault();
  try { grip.setPointerCapture(e.pointerId); } catch { return; } // the touch already ended
  const grabOffset = e.clientY - row.getBoundingClientRect().top;
  let lastY = e.clientY;
  row.classList.add('dragging');
  list.classList.add('is-dragging');

  const place = () => {
    const y = lastY;
    let before = null;
    for (const sib of list.children) {
      if (sib === row) continue;
      const box = sib.getBoundingClientRect();
      if (y < box.top + box.height / 2) { before = sib; break; }
    }
    if (before !== row.nextElementSibling && before !== row) list.insertBefore(row, before);
    row.style.transform = '';
    const natural = row.getBoundingClientRect().top;
    row.style.transform = `translateY(${y - grabOffset - natural}px)`;
  };

  let raf = 0;
  const topBarBottom = (view.querySelector('.nav-row')?.offsetHeight || 0) + (view.querySelector('.checker')?.offsetHeight || 0);
  const edgeScroll = () => {
    if (!row.isConnected) return end(); // the list was redrawn mid-drag
    const edge = 90;
    const bottomLimit = window.innerHeight - 80; // keep clear of the tab bar
    const topLimit = topBarBottom; // and of the bar and trim at the top
    let dy = 0;
    if (lastY < topLimit + edge) dy = -Math.ceil((topLimit + edge - lastY) / 6);
    else if (lastY > bottomLimit - edge) dy = Math.ceil((lastY - (bottomLimit - edge)) / 6);
    if (dy) { window.scrollBy(0, dy); place(); }
    raf = requestAnimationFrame(edgeScroll);
  };
  raf = requestAnimationFrame(edgeScroll);

  const move = ev => { lastY = ev.clientY; place(); };
  let ended = false;
  function end() {
    if (ended) return;
    ended = true;
    cancelAnimationFrame(raf);
    grip.removeEventListener('pointermove', move);
    grip.removeEventListener('pointerup', end);
    grip.removeEventListener('pointercancel', end);
    grip.removeEventListener('lostpointercapture', end);
    window.removeEventListener('blur', end);
    row.classList.remove('dragging');
    list.classList.remove('is-dragging');
    row.style.transform = '';
    renumber(list);
  }
  grip.addEventListener('pointermove', move);
  grip.addEventListener('pointerup', end);
  grip.addEventListener('pointercancel', end);
  // iOS can take the touch away (a call, a swipe home) without a pointerup.
  grip.addEventListener('lostpointercapture', end);
  window.addEventListener('blur', end);
}

function moveWithKeys(e, grip) {
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  e.preventDefault();
  const row = grip.closest('.edit-row');
  const list = row.parentElement;
  if (e.key === 'ArrowUp' && row.previousElementSibling) list.insertBefore(row, row.previousElementSibling);
  else if (e.key === 'ArrowDown' && row.nextElementSibling) list.insertBefore(row.nextElementSibling, row);
  else return;
  renumber(list);
  grip.focus();
  const pos = [...list.children].indexOf(row) + 1;
  document.getElementById('moveStatus').textContent = `Moved to position ${pos} of ${list.children.length}`;
}

function renderPhotoTray() {
  const tray = document.getElementById('photoTray');
  if (!tray) return;
  const photos = state.draft.photos;
  tray.innerHTML = photos.map((p, i) => `
    <figure class="tray-photo">
      <img src="${p.src}" alt="Photo ${i + 1}">
      <button type="button" class="tray-remove" data-action="remove-photo" data-index="${i}" aria-label="Remove photo ${i + 1}">${ICONS.remove}</button>
    </figure>`).join('');
  tray.hidden = !photos.length;
  document.getElementById('scanBtn').disabled = !photos.length;
  document.getElementById('keepPhotosRow').hidden = !photos.length;
}

async function photoToBlob(p) {
  if (p.file) return p.file;
  const res = await fetch(p.src);
  return res.blob();
}

async function runScan() {
  const form = document.getElementById('recipeForm');
  const photos = state.draft.photos;
  if (!photos.length) return;
  const hasContent = listValues('ingList').length || listValues('stepList').length;
  if (hasContent && !confirm('Replace the ingredients and steps in the form with the scanned recipe?')) return;

  const btn = document.getElementById('scanBtn');
  const box = document.getElementById('scanProgress');
  const fill = box.querySelector('.progress-fill');
  const label = box.querySelector('.progress-label');
  btn.disabled = true;
  box.hidden = false;

  try {
    const blobs = await Promise.all(photos.map(photoToBlob));
    const result = await readRecipePhotos(blobs, ({ label: l, fraction }) => {
      label.textContent = l;
      fill.style.width = `${Math.round(fraction * 100)}%`;
    });
    // Left this screen while the photos were being read: don't write into whatever is open now.
    if (!form.isConnected) return;
    const parsed = parseRecipeText(result.text, result.lines, result.titleHint, { sourceHint: result.sourceHint, gaps: result.gaps });
    state.lastScanReport = [
      `Recipe Box ${typeof APP_VERSION !== 'undefined' ? APP_VERSION : ''} scan report, ${new Date().toLocaleString()}`,
      `Photos (in the order added): ${photos.map((p, i) => (p.file && p.file.name) || `photo ${i + 1}`).join(', ')}`,
      '', result.report, '', '--- Parsed ---', JSON.stringify({ ...parsed, issues: parsed.issues.map(x => x.message) }, null, 2),
    ].join('\n');

    const raw = document.getElementById('rawText');
    raw.hidden = false;
    raw.querySelector('pre').textContent = result.text.trim() || '(No text found)';

    if (!parsed.ingredients.length && !parsed.steps.length) {
      raw.open = true;
      label.textContent = 'No ingredients or steps found. Try a sharper, well-lit photo, or copy what you need from the text below.';
      return;
    }
    // A scan fills in the name, ingredients and steps only. Notes, times, servings and the
    // source are left for you: on a photo they're too often a description or a stray label.
    if (parsed.title) form.title.value = parsed.title;
    const diet = suggestDiet(parsed);
    for (const [k] of DIETS) { const el = form.querySelector(`input[name="diet-${k}"][value="${diet[k]}"]`); if (el) el.checked = true; }
    document.getElementById('dietHint').hidden = !(diet.gf || diet.df);
    if (!form.category.value) form.category.value = guessCategory(parsed) || '';
    const flags = kind => Object.fromEntries(parsed.issues.filter(x => x.field === kind && x.index != null).map(x => [x.index, x.message]));
    const doubts = scanDoubts(parsed, result.assembled);
    setListValues(document.getElementById('ingList'), parsed.ingredients, flags('ingredients'), doubts.ingredients);
    setListValues(document.getElementById('stepList'), parsed.steps, flags('steps'), doubts.steps);
    markFieldDoubts(form, doubts.fields.title ? { title: doubts.fields.title } : {});
    const count = parsed.ingredients.filter(i => !isHeader(i)).length;
    const unsure = (doubts.fields.title ? 1 : 0) + Object.keys(doubts.ingredients).length + Object.keys(doubts.steps).length;
    label.textContent = `Found ${plural(count, 'ingredient')} and ${plural(parsed.steps.length, 'step')}.`
      + (unsure ? ` A dot marks ${unsure === 1 ? 'one line' : `${unsure} lines`} worth a second look.` : '');
    showIssues(parsed.issues);
    (parsed.issues.length ? document.getElementById('issues') : document.getElementById('fields'))
      .scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'start' });
  } catch (err) {
    console.error(err);
    label.textContent = err.message || 'Reading the photos failed. Try again.';
    fill.style.width = '0%';
  } finally {
    btn.disabled = !state.draft.photos.length;
  }
}

// Put the mustard dot on scanned fields (name, times, servings, source) the reader wasn't sure of.
function markFieldDoubts(form, fields) {
  form.querySelectorAll('.field.unsure').forEach(clearFieldDoubt);
  for (const [name, words] of Object.entries(fields)) {
    const input = form[name];
    const field = input && input.closest('.field');
    if (!field) continue;
    const note = doubtNote(words, 'field-doubt');
    field.classList.add('unsure');
    input.insertAdjacentHTML('afterend', note.html);
    input.setAttribute('aria-describedby', [input.getAttribute('aria-describedby'), note.id].filter(Boolean).join(' '));
  }
}

function clearFieldDoubt(field) {
  const note = field.querySelector('.field-doubt');
  const input = field.querySelector('input, select');
  if (note && input) {
    const rest = (input.getAttribute('aria-describedby') || '').split(' ').filter(id => id && id !== note.id).join(' ');
    rest ? input.setAttribute('aria-describedby', rest) : input.removeAttribute('aria-describedby');
  }
  note?.remove();
  field.classList.remove('unsure');
}

function showIssues(issues) {
  const box = document.getElementById('issues');
  if (!issues.length) { box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false;
  box.innerHTML = `
    <h2 id="issuesHead" class="sec-title cherry">Needs your attention</h2>
    <p class="hint">The scan couldn't fill in everything. Complete these before saving.</p>
    <ul class="issue-list">
      ${issues.map((x, i) => `<li><span>${esc(x.message)}</span><button type="button" class="btn btn-chip" data-action="fix-issue" data-issue="${i}">Fix</button></li>`).join('')}
    </ul>`;
  box._issues = issues;
}

function focusIssue(x) {
  let target;
  if (x.field === 'title') target = document.getElementById('f-title');
  else {
    const list = document.getElementById(x.field === 'steps' ? 'stepList' : 'ingList');
    const rows = list.querySelectorAll('.edit-row');
    if (x.index != null && rows[x.index]) target = rows[x.index].querySelector('.row-input');
    else if (/missing/i.test(x.message) || !list.querySelector('.row-input')?.value) {
      const empty = [...list.querySelectorAll('.row-input')].find(t => !t.value.trim());
      target = empty || addRow(list, '', null, false).querySelector('.row-input');
    } else target = list.querySelector('.row-input');
  }
  if (!target) return;
  target.scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'center' });
  target.focus({ preventScroll: true });
  if (target.setSelectionRange) target.setSelectionRange(target.value.length, target.value.length);
}

async function submitForm(form) {
  const title = form.title.value.trim();
  const err = document.getElementById('titleError');
  if (!title) { err.hidden = false; form.title.focus(); return; }
  err.hidden = true;

  const ingredients = listValues('ingList'), steps = listValues('stepList');
  const missing = [!ingredients.filter(i => !isHeader(i)).length && 'ingredients', !steps.length && 'steps'].filter(Boolean);
  if (missing.length && !confirm(`This recipe has no ${missing.join(' or ')} yet. Save it anyway?`)) return;

  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const existing = state.draft.id ? state.recipes.find(r => r.id === state.draft.id) : null;
    const keep = document.getElementById('f-keepPhotos').checked;
    const images = keep ? await Promise.all(state.draft.photos.map(p => p.file ? compressPhoto(p.file) : p.src)) : [];
    const recipe = {
      ...(existing || { id: uid(), createdAt: Date.now(), rating: 0, favorite: false, timesMade: 0 }),
      title,
      category: form.category.value || guessCategory({ title, ingredients, steps }) || '',
      servings: form.servings.value.trim(),
      prepTime: form.prepTime.value.trim(),
      cookTime: form.cookTime.value.trim(),
      totalTime: form.totalTime.value.trim(),
      diet: Object.fromEntries(DIETS.map(([k]) => [k, (form.querySelector(`input[name="diet-${k}"]:checked`) || {}).value || ''])),
      source: form.source.value.trim(),
      ingredients,
      steps,
      notes: form.notes.value.trim(),
      images,
    };
    await saveRecipe(recipe);
    state.draft.photos.forEach(p => p.file && URL.revokeObjectURL(p.src));
    state.draft = null;
    toast(existing ? 'Recipe saved' : 'Recipe added');
    location.hash = `#/recipe/${encodeURIComponent(recipe.id)}`;
  } catch (e) {
    console.error(e);
    toast(/quota/i.test(e && e.name) ? 'This device is out of storage. Remove some photos and try again.' : 'Saving failed. Try again.');
    btn.disabled = false; btn.textContent = 'Save recipe';
  }
}

// ---------- grocery list ----------

function groupItems(items) {
  const groups = new Map();
  if (state.settings.groupBy === 'recipe') {
    for (const it of items) {
      const key = it.recipeTitle || 'Added by hand';
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(it);
    }
    return [...groups.entries()].map(([name, list]) => ({ name, list }));
  }
  for (const it of items) {
    const key = aisleFor(it.text);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(it);
  }
  return AISLES.filter(a => groups.has(a)).map(name => ({
    name,
    list: groups.get(name).sort((a, b) => ingredientName(a.text).localeCompare(ingredientName(b.text))),
  }));
}

function groceryText() {
  const open = state.grocery.filter(i => !i.checked);
  const out = ['Grocery list'];
  for (const g of groupItems(open)) out.push('', g.name, ...g.list.map(i => i.text));
  return out.join('\n');
}

        <button class="btn btn-secondary">Add</button>
      </form>
      ${items.length ? `
        <div class="segmented" role="group" aria-label="Group items">
          <button data-action="group" data-by="aisle" aria-pressed="${state.settings.groupBy === 'aisle'}">By aisle</button>
          <button data-action="group" data-by="recipe" aria-pressed="${state.settings.groupBy === 'recipe'}">By recipe</button>
        </div>
        <div class="card g-card">${groupItems(items).map(g => `
          <section class="g-group">

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

let landDots = null; // Float32Array of x, y, z per dot
function getLand() {
  if (landDots) return landDots;
  const out = [];
  const rows = LAND.split(';');
  rows.forEach((row, r) => {
    const v = row.split(',').map(h => parseInt(h, 16));
    const lat = 90 - (r + .5) * 180 / rows.length, n = v[0];
    for (let k = 1; k + 1 < v.length; k += 2) {
      for (let i = v[k]; i < v[k] + v[k + 1]; i++) out.push(...llVec(lat, -180 + (i + .5) * 360 / n));
    }
  });
  return (landDots = new Float32Array(out));
}

  return Array.from({ length: count }, () => ({

  draw(v, B, R, cx, cy, stars, now) {

    const W = Math.round(v.w * dpr), H = Math.round(v.h * dpr);

    gl.uniform1f(u.size, Math.max(.7, R * .0088));
    gl.uniform2f(u.near, Math.cos(9.5 * RAD), Math.cos(1.2 * RAD));

    gl.uniform3fv(u.col, ink);
    if (!v.mini) { gl.uniform1f(u.pass, 1); gl.drawArrays(gl.POINTS, 0, this.landCount); }
    gl.uniform1f(u.pass, 0); gl.drawArrays(gl.POINTS, 0, this.landCount);
    gl.uniform3fv(u.col, mixRgb(v.glow, [255, 255, 255], .18).map(x => x / 255));
    gl.uniform1f(u.pass, 2);
    for (const id in v.glowFor) {
      const k = v.glowFor[id];
      if (k <= .01) continue;
      const pv = placeVec(id);
      gl.uniform4f(u.lit, pv[0], pv[1], pv[2], k);
      gl.drawArrays(gl.POINTS, 0, this.landCount);
    }
    return true;
  }

  dispose() {
    this.ok = false;
    try { this.gl?.getExtension('WEBGL_lose_context')?.loseContext(); } catch { /* fine */ }
    this.canvas.remove();
  }
}

class GlobeView {
  constructor(canvas, { mini = false } = {}) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.mini = mini;
    this.w = 0; this.h = 0; this.dpr = 1;
    this.cam = { lat: 20, lon: 0, zoom: 1, vlat: 0, vlon: 0 };
    this.layout = { cx: 0, cy: 0, R: 100 };
    this.bounds = { top: 0, bottom: 0 }; // where labels may go
    this.night = [10, 14, 30]; this.glow = [140, 210, 204];
    this.focusId = null; this.homeId = null;
    this.glowFor = {};   // id -> how lit its region is, 0..1
    this.labels = {};    // id -> { a, dir, ox, oy }
    this.arc = null;     // { a, b, t, alpha }
    this.ripples = [];
    this.stars = makeStars(mini ? 60 : 170, mini ? 7 : 11);
    this.hits = [];
    this.lastDraw = 0;
    this.bins = Array.from({ length: DOT_BINS }, () => []);
    this.starPts = [];
    // the heavy drawing goes to the GPU when it can
    try { this.gpu = new GlobeGPU(canvas); if (!this.gpu.ok) { this.gpu.dispose(); this.gpu = null; } } catch { this.gpu = null; }

    this.sizeDirty = true;
    if (typeof ResizeObserver === 'function') {
      this.ro = new ResizeObserver(() => { this.sizeDirty = true; });
      this.ro.observe(canvas);
    }
    this.resize();
  }

  resize() {
    if (!this.sizeDirty && this.w && this.ro) return true;
    const r = this.canvas.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    if (!r.width || !r.height) return false;
    this.sizeDirty = false;
    if (r.width !== this.w || r.height !== this.h || dpr !== this.dpr) {
      this.w = r.width; this.h = r.height; this.dpr = dpr; this.curFont = null;
      this.canvas.width = Math.round(r.width * dpr);
      this.canvas.height = Math.round(r.height * dpr);
    }
    return true;
  }

  dispose() {
    this.ro?.disconnect();
    this.gpu?.dispose();
    this.gpu = null;
  }

  measure(text, font) {
    const key = font + '|' + text;
    let w = LABEL_W.get(key);
    if (w === undefined) {
      this.ctx.font = this.curFont = font;
      w = this.ctx.measureText(text).width;
      LABEL_W.set(key, w);
    }
    return w;
  }

  setPalette(id, instant) {
    const p = place(id);
    this.nightTo = hexRgb(p.night); this.glowTo = hexRgb(p.glow);
    if (instant) { this.night = this.nightTo.slice(); this.glow = this.glowTo.slice(); }
  }

  // Camera basis: east, north and toward-the-viewer, for the current center.
  basis() {
    const p = this.cam.lat * RAD, l = this.cam.lon * RAD;
    const sp = Math.sin(p), cp = Math.cos(p), sl = Math.sin(l), cl = Math.cos(l);
    return [[-sl, cl, 0], [-sp * cl, -sp * sl, cp], [cp * cl, cp * sl, sp]];

  project(v, B, lift = 1) {
    const { cx, cy } = this.layout, R = this.layout.R * this.cam.zoom * lift;
    const x = vdot(v, B[0]), y = vdot(v, B[1]), z = vdot(v, B[2]);
    return { x: cx + R * x, y: cy - R * y, z, rx: x, ry: y };
  }

  draw(now, dt) {
    const { ctx, w, h, dpr } = this;
    if (!w) return;
    // colors drift toward the place you're looking at
    if (this.nightTo) {
      const k = 1 - Math.exp(-dt * 3.2);
      this.night = mixRgb(this.night, this.nightTo, k);
      this.glow = mixRgb(this.glow, this.glowTo, k);

    const night = this.night, glow = this.glow;
    const { cx, cy } = this.layout, R = this.layout.R * this.cam.zoom;

    if (this.gpu && !this.gpu.ok) { this.gpu.dispose(); this.gpu = null; }

    // sky
    const sky = ctx.createRadialGradient(cx, cy, R * .3, cx, cy, Math.max(w, h) * (this.mini ? 1.1 : .95));
    sky.addColorStop(0, rgba(mixRgb(night, glow, .16)));

    for (let k = 0; k < stars.length; k += 4) {

    const at = ctx.createRadialGradient(cx, cy, R * .94, cx, cy, R * 1.3);
    at.addColorStop(0, rgba(mixRgb(glow, [255, 255, 255], .4), .34));
    at.addColorStop(.18, rgba(glow, .16));
    at.addColorStop(.55, rgba(glow, .04));
    at.addColorStop(1, rgba(glow, 0));

    // the sphere itself, lit from the upper left

    body.addColorStop(0, rgba(mixRgb(mixRgb(night, glow, .22), [255, 255, 255], .06)));
    body.addColorStop(.55, rgba(mixRgb(night, glow, .07)));
    body.addColorStop(1, rgba(mixRgb(night, [0, 0, 0], .45)));
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.fill();

    this.drawLand(B, R, cx, cy);
    this.drawOver(B, R, cx, cy, now);
  }

  // What sits on top of the sphere: rim, flight path, ripples, pins and labels.
  drawOver(B, R, cx, cy, now) {
    const { ctx } = this, glow = this.glow;
    // a thin bright rim on the lit side
    const rim = ctx.createLinearGradient(cx - R, cy - R, cx + R * .6, cy + R * .8);
    rim.addColorStop(0, rgba(mixRgb(glow, [255, 255, 255], .55), .75));
    rim.addColorStop(.5, rgba(glow, .18));
    rim.addColorStop(1, rgba(glow, 0));

    this.drawRipples(B, now);
    this.drawPins(B, now);
    this.lastDraw = now;
  }

  drawLand(B, R, cx, cy) {
    const { ctx } = this;
    const pts = getLand();
    const [E, N, F] = B;
    const bins = this.bins; for (const b of bins) b.length = 0;
    const back = [];
    // lit regions around the chosen city (and the one you just left, as it fades)
    const lit = [];
    for (const id in this.glowFor) if (this.glowFor[id] > .01) lit.push(...placeVec(id), this.glowFor[id]);
    const litDots = [];
    const lx = LIGHT[0], ly = LIGHT[1], lz = LIGHT[2];
    const COS_NEAR = Math.cos(9.5 * RAD), COS_CORE = Math.cos(1.2 * RAD);
    for (let i = 0; i < pts.length; i += 3) {
      const px = pts[i], py = pts[i + 1], pz = pts[i + 2];
      const z = px * F[0] + py * F[1] + pz * F[2];
      if (z <= 0) { if (!this.mini && (i % 9 === 0) && z < -.12) back.push(i); continue; }
      const x = px * E[0] + py * E[1] + pz * E[2];
      const y = px * N[0] + py * N[1] + pz * N[2];
      const lam = Math.max(0, x * lx + y * ly + z * lz);
      const b = (.26 + .74 * lam) * smoothstep(0, .22, z);
      bins[Math.min(DOT_BINS - 1, (b * DOT_BINS) | 0)].push(cx + R * x, cy - R * y, z);
      for (let j = 0; j < lit.length; j += 4) {

      ctx.fillStyle = rgba(ink, .05);
      ctx.beginPath();
      for (const i of back) {

    for (let b = 0; b < DOT_BINS; b++) {
      const list = bins[b];
      if (!list.length) continue;
      ctx.fillStyle = rgba(ink, .1 + .86 * (b + .5) / DOT_BINS);
      ctx.beginPath();
      for (let k = 0; k < list.length; k += 3) {
        const r = size * (.55 + .45 * list[k + 2]);
        ctx.moveTo(list[k] + r, list[k + 1]);
        ctx.arc(list[k], list[k + 1], r, 0, 6.2832);

      ctx.fill();
    }

    if (litDots.length) {
      const hot = mixRgb(this.glow, [255, 255, 255], .18);
      for (let b = 1; b <= 4; b++) {
        ctx.fillStyle = rgba(hot, b / 4);

          ctx.moveTo(litDots[k] + r, litDots[k + 1]);
          ctx.arc(litDots[k], litDots[k + 1], r, 0, 6.2832);
        }
        ctx.fill();
      }
    }
  }

  // A flight path between two places, lifted off the surface, with a bright head while moving.
  drawArc(B) {

    if (!arc || arc.alpha < .01 || arc.t <= .001) return;

  }

  ripple(id, kind = 'land') { this.ripples.push({ id, kind, t0: performance.now(), glow: this.glowTo || this.glow }); }

  drawRipples(B, now) {
    const { ctx } = this;
    this.ripples = this.ripples.filter(r => now - r.t0 < (r.kind === 'screen' ? 1100 : 1600));
    for (const r of this.ripples) {

          const p = this.project(pv, B);

        }

      }

  }

  drawPins(B, now) {
    const { ctx } = this;
    const still = reducedMotion();
    const hits = this.hits = [];
    const seen = [];
    for (const id of PLACE_ORDER) {
      const p = this.project(placeVec(id), B);
      const fade = smoothstep(.02, .2, p.z);
      if (fade < .01) { const L = this.labels[id]; if (L) L.a = 0; continue; }
      const glow = hexRgb(place(id).glow);

      ctx.globalAlpha = 1;

          ctx.strokeStyle = rgba(glow, .7 * (1 - t) * fade); ctx.lineWidth = 1.4;
          ctx.beginPath(); ctx.arc(p.x, p.y, 4 + 18 * easeOut(t), 0, 7); ctx.stroke();
        }
      }
      ctx.fillStyle = rgba(glow, fade);
      ctx.beginPath(); ctx.arc(p.x, p.y, on ? 4.2 : 3, 0, 7); ctx.fill();
      ctx.fillStyle = `rgba(255,255,255,${.95 * fade})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, on ? 1.8 : 1.2, 0, 7); ctx.fill();

      }
      hits.push({ id, x: p.x, y: p.y, r: 22 });
      seen.push({ id, p, fade, on, home, glow });

  }

  drawLabels(seen, now) {
    const { ctx } = this;
    const dt = Math.min(.05, (now - (this.lastDraw || now)) / 1000);
    if (this.mini) return; // the window names the city itself
    const showAll = true;
    // the chosen city first, then your own, then the rest front to back
    seen.sort((a, b) => (b.on - a.on) || (b.home - a.home) || (b.p.z - a.p.z));
    const placed = [];
    const DIRS = [[0, -1], [.62, -.78], [-.62, -.78], [1, 0], [-1, 0], [0, 1], [.62, .78], [-.62, .78]];
    const top = this.bounds.top, bottom = this.bounds.bottom || this.h;
    // pins are obstacles too, so a label never covers another city
    const pinBoxes = seen.map(s => ({ x: s.p.x - 7, y: s.p.y - 7, w: 14, h: 14, id: s.id }));
    const hitsAdd = [];
    for (const s of seen) {
      const L = this.labels[s.id] || (this.labels[s.id] = { a: 0, dir: 0, ox: 0, oy: -20, set: false });
      const big = s.on;
      const pl = place(s.id), th = THEMES[s.id];
      const name = big ? pl.city : pl.city.toUpperCase();
      const nameW = this.measure(name, big ? FONT_BIG : FONT_SMALL);
      let sub = '', subW = 0;
      if (big) {
        sub = th.name + (s.home ? ' · your kitchen' : '');
        subW = this.measure(sub, FONT_SUB);
      }
      const bw = Math.ceil(Math.max(nameW, subW) + (big ? 22 : 14) + (!big && s.home ? 10 : 0));
      const bh = big ? 40 : 20;
      const lead = (big ? 30 : 15) * (.4 + .6 * s.fade);
      const want = (showAll || big || s.home) && s.fade > .35 && (big ? state.settings.cityTag !== false : state.settings.cityNames !== false);
      let choice = -1, box = null;
      if (want) {
        const order = [L.dir, ...DIRS.keys()];
        for (const d of order) {
          const [dx, dy] = DIRS[d];
          const ax = s.p.x + dx * lead, ay = s.p.y + dy * lead;
          const bx = ax + (dx > .1 ? 0 : dx < -.1 ? -bw : -bw / 2);
          const by = ay + (dy > .1 ? 0 : dy < -.1 ? -bh : -bh / 2);
          const b = { x: bx, y: by, w: bw, h: bh };
          if (b.x < 6 || b.x + b.w > this.w - 6 || b.y < top || b.y + b.h > bottom) continue;
          const pad = 4;
          const clash = placed.some(o => b.x < o.x + o.w + pad && b.x + b.w + pad > o.x && b.y < o.y + o.h + pad && b.y + b.h + pad > o.y)
            || pinBoxes.some(o => o.id !== s.id && b.x < o.x + o.w && b.x + b.w > o.x && b.y < o.y + o.h && b.y + b.h > o.y);
          if (!clash) { choice = d; box = b; break; }
        }
      }
      const k = 1 - Math.exp(-dt * 12);
      if (box) {
        placed.push(box);
        const tox = box.x - s.p.x, toy = box.y - s.p.y;
        if (!L.set || L.a < .05) { L.ox = tox; L.oy = toy; }
        L.ox += (tox - L.ox) * Math.min(1, k * 1.4); L.oy += (toy - L.oy) * Math.min(1, k * 1.4);
        L.dir = choice; L.set = true;
        L.a += (1 - L.a) * k;
      } else {
        L.a += (0 - L.a) * k * 1.5;
      }
      if (L.a < .02) continue;
      const a = L.a * s.fade * (this.labelFade ?? 1);
      const bx = s.p.x + L.ox, by = s.p.y + L.oy;
      // leader line from the pin to the label
      const ex = clamp(s.p.x, bx + 6, bx + bw - 6), ey = clamp(s.p.y, by, by + bh);
      ctx.strokeStyle = `rgba(255,255,255,${.5 * a})`; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(s.p.x, s.p.y); ctx.lineTo(ex, ey); ctx.stroke();
      // chip
      ctx.fillStyle = rgba(mixRgb(this.night, [0, 0, 0], .35), .78 * a);
      ctx.strokeStyle = rgba(s.glow, (big ? .8 : .45) * a); ctx.lineWidth = 1;
      ctx.beginPath(); roundRect(ctx, bx, by, bw, bh, big ? 11 : 10); ctx.fill(); ctx.stroke();
      ctx.textBaseline = 'middle';
      if (big) {
        ctx.font = FONT_BIG;
        ctx.fillStyle = `rgba(255,255,255,${a})`;
        ctx.fillText(name, bx + 11, by + 14);
        ctx.font = this.curFont = FONT_SUB;
        ctx.fillStyle = rgba(mixRgb(s.glow, [255, 255, 255], .2), a);
        ctx.fillText(sub, bx + 11, by + 29);
      } else {
        let tx = bx + 7;
        if (s.home) {
          ctx.fillStyle = `rgba(255,255,255,${a})`;
          ctx.beginPath(); ctx.arc(bx + 9, by + bh / 2, 2.6, 0, 7); ctx.fill();
          tx += 9;
        }
        if (this.curFont !== FONT_SMALL) ctx.font = this.curFont = FONT_SMALL;
        ctx.fillStyle = `rgba(255,255,255,${.92 * a})`;
        ctx.fillText(name, tx, by + bh / 2 + .5);
      }
      if (L.a > .5) hitsAdd.push({ id: s.id, box: { x: bx - 4, y: by - 4, w: bw + 8, h: bh + 8 } });
    }
    this.hits.push(...hitsAdd);
  }

  hitTest(x, y) {
    let best = null, bestD = Infinity;
    for (const h of this.hits) {
      if (h.box) {
        if (x >= h.box.x && x <= h.box.x + h.box.w && y >= h.box.y && y <= h.box.y + h.box.h) return h.id;
        continue;
      }
      const d = Math.hypot(x - h.x, y - h.y);
      if (d < h.r && d < bestD) { best = h.id; bestD = d; }
    }
    return best;
  }
}

// A soft glow for a pin, drawn once per color and reused every frame.
const HALOS = new Map();
function haloSprite(hex) {
  let c = HALOS.get(hex);
  if (c) return c;
  c = document.createElement('canvas');
  c.width = c.height = 72;
  const x = c.getContext('2d'), g = x.createRadialGradient(36, 36, 0, 36, 36, 36), col = hexRgb(hex);
  g.addColorStop(0, rgba(col, .75)); g.addColorStop(1, rgba(col, 0));
  x.fillStyle = g; x.fillRect(0, 0, 72, 72);
  HALOS.set(hex, c);
  return c;
}

function roundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, h / 2, w / 2);
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// One animation loop for every globe on screen.
const globeLoop = {
  views: new Set(), raf: 0, last: 0,
  add(v) { this.views.add(v); this.start(); },
  start() { if (!this.raf) { this.last = performance.now(); this.raf = requestAnimationFrame(t => this.tick(t)); } },
  tick(now) {
    this.raf = 0;
    const dt = Math.min(.05, Math.max(0, (now - this.last) / 1000));
    this.last = now;
    for (const v of this.views) {
      if (!v.canvas.isConnected) { v.dispose(); this.views.delete(v); continue; }
      try { v.frame(now, dt); } catch (err) { console.error(err); v.dispose(); this.views.delete(v); }
    }
    if (this.views.size) this.raf = requestAnimationFrame(t => this.tick(t));
  },
};

// ---------- the small window in Settings ----------

let themeWindow = null;

function mountThemeWindow() {
  const canvas = document.getElementById('globeMini');
  if (!canvas) return;
  const v = themeWindow = new GlobeView(canvas, { mini: true });
  const id = state.settings.theme;
  v.homeId = v.focusId = id;
  v.glowFor = { [id]: 1 };
  v.setPalette(id, true);
  const p = place(id);
  v.cam.lat = p.lat - LIFT; v.cam.lon = p.lon - 4;
  v.onScreen = true;
  if (typeof IntersectionObserver === 'function') {
    const io = new IntersectionObserver(([e]) => { v.onScreen = e.isIntersecting; if (e.isIntersecting) v.dirty = true; });
    io.observe(canvas);
    const dispose = v.dispose.bind(v);
    v.dispose = () => { io.disconnect(); dispose(); };
  }
  v.frame = function (now, dt) {
    if (globeUI.open && !globeUI.closing) return; // the full globe is showing this one
    if (!this.onScreen) return;
    if (!this.resize()) return;
    if (now - this.lastDraw < 30 && !this.dirty) return; // half rate is plenty for a window
    this.dirty = false;
    const home = place(this.homeId);
    const { w, h } = this;
    this.layout.R = Math.min(h * .66, w * .42);
    this.layout.cx = w - this.layout.R * .82;
    this.layout.cy = h * .55;
    this.bounds = { top: 6, bottom: h - 6 };
    const sway = reducedMotion() ? 0 : Math.sin(now / 5200) * 9;
    const k = 1 - Math.exp(-dt * 2.4);
    const tl = wrapLon(home.lon - 4 + sway, this.cam.lon);
    this.cam.lat += (home.lat - LIFT - this.cam.lat) * k;
    this.cam.lon += (tl - this.cam.lon) * k;
    for (const id of Object.keys(this.glowFor)) this.glowFor[id] += ((id === this.homeId ? 1 : 0) - this.glowFor[id]) * k;
    this.draw(now, dt);
  };
  globeLoop.add(v);
}

function updateThemeWindow() {
  const id = state.settings.theme, p = place(id), t = THEMES[id];
  const btn = document.getElementById('globeWindow');
  if (!btn) return;
  btn.querySelector('.gw-city').textContent = p.city;
  btn.querySelector('.gw-theme').textContent = t.name;
  btn.style.setProperty('--gw-glow', p.glow);
  btn.setAttribute('aria-label', `Theme: ${t.name}, from ${p.city}. Open the globe to choose another.`);
  if (themeWindow) {
    themeWindow.homeId = themeWindow.focusId = id;
    themeWindow.setPalette(id);
    themeWindow.dirty = true;
    if (!themeWindow.glowFor[id]) themeWindow.glowFor[id] = 0;
  }
}

// ---------- the full globe ----------

const globeUI = { open: false, closing: false };

function globeCard(id, clone = false) {
  const p = place(id), t = THEMES[id], on = id === state.settings.theme;
  return `
    <article class="gx-card" data-theme="${id}" data-place="${id}" ${clone ? 'data-clone aria-hidden="true"' : `aria-label="${esc(p.city)}, ${esc(p.country)}: ${esc(t.name)}"`}>
      <span class="gx-prev" aria-hidden="true">
