// After a screen renders, grow every notes box to show its whole text.
function fitNotes() { view.querySelectorAll('.notes-input').forEach(autosize); }

function autosize(el) {
  el.style.height = 'auto';
  el.style.height = `${el.scrollHeight + 2}px`;
}

function renumber(list) {
  const kind = list.dataset.kind;
  let n = 0;
  [...list.children].forEach(row => {
    const header = row.hasAttribute('data-header');
    const label = rowLabel(kind, n, header);
    if (!header) n++;
    const num = row.querySelector('.row-num');
    if (num) num.textContent = n;
    row.querySelector('.grip').setAttribute('aria-label', `Move ${label}. Drag, or use the arrow keys.`);
    row.querySelector('.row-input').setAttribute('aria-label', label);
    row.querySelector('.row-remove').setAttribute('aria-label', `Remove ${label}`);
  });
}

function addRow(list, value = '', after = null, focus = true, header = false) {
  const tmp = document.createElement('ol');
  tmp.innerHTML = editRow(list.dataset.kind, header ? HEADER_MARK + value : value, 0);
  const row = tmp.firstElementChild;
  list.insertBefore(row, after ? after.nextElementSibling : null);
  renumber(list);
  const input = row.querySelector('.row-input');
  autosize(input);
  if (focus) input.focus();
  return row;
}

function setListValues(list, values, flags = {}, doubts = {}) {
  list.innerHTML = editList(list.dataset.kind, values, flags, doubts);
  list.querySelectorAll('.row-input').forEach(autosize);
}

function listValues(id) {
  return [...document.querySelectorAll(`#${id} .edit-row`)].map(row => {
    const v = row.querySelector('.row-input').value.replace(/\s+/g, ' ').trim();
    return v && row.hasAttribute('data-header') ? HEADER_MARK + v.replace(/:$/, '') : v;
  }).filter(Boolean);
}

// Drag to reorder (edit screen only). Pointer events work for touch and mouse.
function startDrag(e, grip) {
  const row = grip.closest('.edit-row');
  const list = row.parentElement;
  e.preventDefault();
  try { grip.setPointerCapture(e.pointerId); } catch { return; } // the touch already ended
  const grabOffset = e.clientY - row.getBoundingClientRect().top;
  let lastY = e.clientY;
  row.classList.add('dragging');
  list.classList.add('is-dragging');

  const place = () => {
    const y = lastY;
    let before = null;
    for (const sib of list.children) {
      if (sib === row) continue;
      const box = sib.getBoundingClientRect();
      if (y < box.top + box.height / 2) { before = sib; break; }
    }
    if (before !== row.nextElementSibling && before !== row) list.insertBefore(row, before);
    row.style.transform = '';
    const natural = row.getBoundingClientRect().top;
    row.style.transform = `translateY(${y - grabOffset - natural}px)`;
  };

  let raf = 0;
  const edgeScroll = () => {
    if (!row.isConnected) return end(); // the list was redrawn mid-drag
    const edge = 90;
    const bottomLimit = window.innerHeight - 80; // keep clear of the tab bar
    let dy = 0;
    if (lastY < edge) dy = -Math.ceil((edge - lastY) / 6);
    else if (lastY > bottomLimit - edge) dy = Math.ceil((lastY - (bottomLimit - edge)) / 6);
    if (dy) { window.scrollBy(0, dy); place(); }
    raf = requestAnimationFrame(edgeScroll);
  };
  raf = requestAnimationFrame(edgeScroll);

  const move = ev => { lastY = ev.clientY; place(); };
  let ended = false;
  function end() {
    if (ended) return;
    ended = true;
    cancelAnimationFrame(raf);
    grip.removeEventListener('pointermove', move);
    grip.removeEventListener('pointerup', end);
    grip.removeEventListener('pointercancel', end);
    grip.removeEventListener('lostpointercapture', end);
    window.removeEventListener('blur', end);
    row.classList.remove('dragging');
    list.classList.remove('is-dragging');
    row.style.transform = '';
    renumber(list);
  }
  grip.addEventListener('pointermove', move);
  grip.addEventListener('pointerup', end);
  grip.addEventListener('pointercancel', end);
  // iOS can take the touch away (a call, a swipe home) without a pointerup.
  grip.addEventListener('lostpointercapture', end);
  window.addEventListener('blur', end);
}

function moveWithKeys(e, grip) {
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  e.preventDefault();
  const row = grip.closest('.edit-row');
  const list = row.parentElement;
  if (e.key === 'ArrowUp' && row.previousElementSibling) list.insertBefore(row, row.previousElementSibling);
  else if (e.key === 'ArrowDown' && row.nextElementSibling) list.insertBefore(row.nextElementSibling, row);
  else return;
  renumber(list);
  grip.focus();
  const pos = [...list.children].indexOf(row) + 1;
  document.getElementById('moveStatus').textContent = `Moved to position ${pos} of ${list.children.length}`;
}

function renderPhotoTray() {
  const tray = document.getElementById('photoTray');
  if (!tray) return;
  const photos = state.draft.photos;
  tray.innerHTML = photos.map((p, i) => `
    <figure class="tray-photo">
      <img src="${p.src}" alt="Photo ${i + 1}">
      <button type="button" class="tray-remove" data-action="remove-photo" data-index="${i}" aria-label="Remove photo ${i + 1}">${ICONS.remove}</button>
    </figure>`).join('');
  tray.hidden = !photos.length;
  document.getElementById('scanBtn').disabled = !photos.length;
  document.getElementById('keepPhotosRow').hidden = !photos.length;
}

async function photoToBlob(p) {
  if (p.file) return p.file;
  const res = await fetch(p.src);
  return res.blob();
}

async function runScan() {
  const form = document.getElementById('recipeForm');
  const photos = state.draft.photos;
  if (!photos.length) return;
  const hasContent = listValues('ingList').length || listValues('stepList').length;
  if (hasContent && !confirm('Replace the ingredients and steps in the form with the scanned recipe?')) return;

  const btn = document.getElementById('scanBtn');
  const box = document.getElementById('scanProgress');
  const fill = box.querySelector('.progress-fill');
  const label = box.querySelector('.progress-label');
  btn.disabled = true;
  box.hidden = false;

  try {
    const blobs = await Promise.all(photos.map(photoToBlob));
    const result = await readRecipePhotos(blobs, ({ label: l, fraction }) => {
      label.textContent = l;
      fill.style.width = `${Math.round(fraction * 100)}%`;
    });
    // Left this screen while the photos were being read: don't write into whatever is open now.
    if (!form.isConnected) return;
    const parsed = parseRecipeText(result.text, result.lines, result.titleHint, { sourceHint: result.sourceHint, gaps: result.gaps });
    state.lastScanReport = [
      `Recipe Box ${typeof APP_VERSION !== 'undefined' ? APP_VERSION : ''} scan report, ${new Date().toLocaleString()}`,
      `Photos (in the order added): ${photos.map((p, i) => (p.file && p.file.name) || `photo ${i + 1}`).join(', ')}`,
      '', result.report, '', '--- Parsed ---', JSON.stringify({ ...parsed, issues: parsed.issues.map(x => x.message) }, null, 2),
    ].join('\n');

    const raw = document.getElementById('rawText');
    raw.hidden = false;
    raw.querySelector('pre').textContent = result.text.trim() || '(No text found)';

    if (!parsed.ingredients.length && !parsed.steps.length) {
      raw.open = true;
      label.textContent = 'No ingredients or steps found. Try a sharper, well-lit photo, or copy what you need from the text below.';
      return;
    }
    // A scan fills in the name, ingredients and steps only. Notes, times, servings and the
    // source are left for you: on a photo they're too often a description or a stray label.
    if (parsed.title) form.title.value = parsed.title;
    const diet = suggestDiet(parsed);
    for (const [k] of DIETS) { const el = form.querySelector(`input[name="diet-${k}"][value="${diet[k]}"]`); if (el) el.checked = true; }
    document.getElementById('dietHint').hidden = !(diet.gf || diet.df);
    if (!form.category.value) form.category.value = guessCategory(parsed) || '';
    const flags = kind => Object.fromEntries(parsed.issues.filter(x => x.field === kind && x.index != null).map(x => [x.index, x.message]));
    const doubts = scanDoubts(parsed, result.assembled);
    setListValues(document.getElementById('ingList'), parsed.ingredients, flags('ingredients'), doubts.ingredients);
    setListValues(document.getElementById('stepList'), parsed.steps, flags('steps'), doubts.steps);
    markFieldDoubts(form, doubts.fields.title ? { title: doubts.fields.title } : {});
    const count = parsed.ingredients.filter(i => !isHeader(i)).length;
    const unsure = (doubts.fields.title ? 1 : 0) + Object.keys(doubts.ingredients).length + Object.keys(doubts.steps).length;
    label.textContent = `Found ${plural(count, 'ingredient')} and ${plural(parsed.steps.length, 'step')}.`
      + (unsure ? ` A dot marks ${unsure === 1 ? 'one line' : `${unsure} lines`} worth a second look.` : '');
    showIssues(parsed.issues);
    (parsed.issues.length ? document.getElementById('issues') : document.getElementById('fields'))
      .scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'start' });
  } catch (err) {
    console.error(err);
    label.textContent = err.message || 'Reading the photos failed. Try again.';
    fill.style.width = '0%';
  } finally {
    btn.disabled = !state.draft.photos.length;
  }
}

// Put the mustard dot on scanned fields (name, times, servings, source) the reader wasn't sure of.
function markFieldDoubts(form, fields) {
  form.querySelectorAll('.field.unsure').forEach(clearFieldDoubt);
  for (const [name, words] of Object.entries(fields)) {
    const input = form[name];
    const field = input && input.closest('.field');
    if (!field) continue;
    const note = doubtNote(words, 'field-doubt');
    field.classList.add('unsure');
    input.insertAdjacentHTML('afterend', note.html);
    input.setAttribute('aria-describedby', [input.getAttribute('aria-describedby'), note.id].filter(Boolean).join(' '));
  }
}

function clearFieldDoubt(field) {
  const note = field.querySelector('.field-doubt');
  const input = field.querySelector('input, select');
  if (note && input) {
    const rest = (input.getAttribute('aria-describedby') || '').split(' ').filter(id => id && id !== note.id).join(' ');
    rest ? input.setAttribute('aria-describedby', rest) : input.removeAttribute('aria-describedby');
  }
  note?.remove();
  field.classList.remove('unsure');
}

function showIssues(issues) {
  const box = document.getElementById('issues');
  if (!issues.length) { box.hidden = true; box.innerHTML = ''; return; }
  box.hidden = false;
  box.innerHTML = `
    <h2 id="issuesHead" class="sec-title cherry">Needs your attention</h2>
    <p class="hint">The scan couldn't fill in everything. Complete these before saving.</p>
    <ul class="issue-list">
      ${issues.map((x, i) => `<li><span>${esc(x.message)}</span><button type="button" class="btn btn-chip" data-action="fix-issue" data-issue="${i}">Fix</button></li>`).join('')}
    </ul>`;
  box._issues = issues;
}

function focusIssue(x) {
  let target;
  if (x.field === 'title') target = document.getElementById('f-title');
  else {
    const list = document.getElementById(x.field === 'steps' ? 'stepList' : 'ingList');
    const rows = list.querySelectorAll('.edit-row');
    if (x.index != null && rows[x.index]) target = rows[x.index].querySelector('.row-input');
    else if (/missing/i.test(x.message) || !list.querySelector('.row-input')?.value) {
      const empty = [...list.querySelectorAll('.row-input')].find(t => !t.value.trim());
      target = empty || addRow(list, '', null, false).querySelector('.row-input');
    } else target = list.querySelector('.row-input');
  }
  if (!target) return;
  target.scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'center' });
  target.focus({ preventScroll: true });
  if (target.setSelectionRange) target.setSelectionRange(target.value.length, target.value.length);
}

async function submitForm(form) {
  const title = form.title.value.trim();
  const err = document.getElementById('titleError');
  if (!title) { err.hidden = false; form.title.focus(); return; }
  err.hidden = true;

  const ingredients = listValues('ingList'), steps = listValues('stepList');
  const missing = [!ingredients.filter(i => !isHeader(i)).length && 'ingredients', !steps.length && 'steps'].filter(Boolean);
  if (missing.length && !confirm(`This recipe has no ${missing.join(' or ')} yet. Save it anyway?`)) return;

  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const existing = state.draft.id ? state.recipes.find(r => r.id === state.draft.id) : null;
    const keep = document.getElementById('f-keepPhotos').checked;
    const images = keep ? await Promise.all(state.draft.photos.map(p => p.file ? compressPhoto(p.file) : p.src)) : [];
    const recipe = {
      ...(existing || { id: uid(), createdAt: Date.now(), rating: 0, favorite: false, timesMade: 0 }),
      title,
      category: form.category.value || guessCategory({ title, ingredients, steps }) || '',
      servings: form.servings.value.trim(),
      prepTime: form.prepTime.value.trim(),
      cookTime: form.cookTime.value.trim(),
      totalTime: form.totalTime.value.trim(),
      diet: Object.fromEntries(DIETS.map(([k]) => [k, (form.querySelector(`input[name="diet-${k}"]:checked`) || {}).value || ''])),
      source: form.source.value.trim(),
      ingredients,
      steps,
      notes: form.notes.value.trim(),
      images,
    };
    await saveRecipe(recipe);
    state.draft.photos.forEach(p => p.file && URL.revokeObjectURL(p.src));
    state.draft = null;
    toast(existing ? 'Recipe saved' : 'Recipe added');
    location.hash = `#/recipe/${encodeURIComponent(recipe.id)}`;
  } catch (e) {
    console.error(e);
    toast(/quota/i.test(e && e.name) ? 'This device is out of storage. Remove some photos and try again.' : 'Saving failed. Try again.');
    btn.disabled = false; btn.textContent = 'Save recipe';
  }
}

function groupItems(items) {
  const groups = new Map();
  if (state.settings.groupBy === 'recipe') {
    for (const it of items) {
      const key = it.recipeTitle || 'Added by hand';
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(it);
    }
    return [...groups.entries()].map(([name, list]) => ({ name, list }));
  }
  for (const it of items) {
    const key = aisleFor(it.text);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(it);
  }
  return AISLES.filter(a => groups.has(a)).map(name => ({
    name,
    list: groups.get(name).sort((a, b) => ingredientName(a.text).localeCompare(ingredientName(b.text))),
  }));
}

function groceryText() {
  const open = state.grocery.filter(i => !i.checked);

  return out.join('\n');
}

// ---------- website import ----------

// What the shortcut runs inside Safari: copy the page's recipe data blocks.
const WEB_SHORTCUT_JS = `var ld = Array.prototype.map.call(document.querySelectorAll('script[type="application/ld+json"]'), function (s) { return s.textContent; });
var site = (document.querySelector('meta[property="og:site_name"]') || {}).content || '';
completion(JSON.stringify({ recipeBox: 1, url: location.href, site: site, ld: ld }));`;
// Shares from the NYT Cooking app carry the recipe link plus a photo; keep just the recipe link.
const NYT_LINK_PATTERN = String.raw`https://cooking\.nytimes\.com/recipes/[^\s?#"'<>]+`;
// What it matches in a downloaded page (shares from the NYT Cooking app arrive as a link).
const WEB_SHORTCUT_PATTERN = '(?s)<script[^>]*application/ld\\+json[^>]*>.*?<\/script>'; // "<\/" keeps this page's own script tag intact

// Reading the clipboard has to start inside the tap itself, so this runs straight from the click.
function readClipboardNow() {
  try {
    if (navigator.clipboard && navigator.clipboard.readText) return navigator.clipboard.readText();
  } catch (err) { return Promise.reject(err); }
  return Promise.reject(new Error('Clipboard unavailable'));
}

async function pasteRecipe(reading) {
  let text;
  try { text = await reading; } catch { return openPasteBox(); } // no clipboard access: paste by hand
  return importWebRecipe(text);
}

function openPasteBox(problem = '') {
  const dlg = document.getElementById('sheet');
  dlg.innerHTML = `
    <div class="sheet-body">
      <h2 class="sheet-title">${problem ? 'No recipe found' : 'Paste a web recipe'}</h2>
      ${problem ? `<p>${esc(problem)}</p>` : ''}
      <p class="hint">Share a recipe to <b>Copy Recipe</b>, then touch and hold the box below and tap Paste.</p>
      <textarea class="paste-box" id="pasteBox" aria-label="Paste the recipe here" placeholder="Paste here"></textarea>
      <button class="btn btn-secondary btn-wide" data-close>Close</button>
    </div>`;
  if (!dlg.open) dlg.showModal();
}

async function importWebRecipe(text) {
  const found = recipeFromWebText(text);
  if (!found) {
    const t = String(text || '').trim();
    const problem = !t ? 'The clipboard is empty.'
      : /^https?:\/\/\S+$/.test(t) ? 'That’s a link, not the recipe. Share the recipe to Copy Recipe instead of copying the link; the shortcut copies the recipe itself.'
      : /<html|<script/i.test(t) ? 'That page doesn’t include recipe data. Open the recipe in Safari and share it from there.'
      : 'The clipboard doesn’t hold a recipe. Share a recipe to Copy Recipe first.';
    openPasteBox(problem);
    return;
  }
  const dlg = document.getElementById('sheet');
  if (dlg.open) dlg.close();

  const existing = found.sourceUrl && state.recipes.find(r => sameRecipeUrl(r.sourceUrl, found.sourceUrl));
  if (existing && !confirm(`“${existing.title}” is already in your Recipe Box. Replace it with this copy? Your rating, notes and photos stay.`)) {
    location.hash = `#/recipe/${encodeURIComponent(existing.id)}`;
    return;
  }
  toast(`Adding ${found.title}…`);
  const { image, ...fields } = found;
  const photo = existing && (existing.photos || []).length ? null : await keepWebPhoto(image);
  const recipe = {
    ...(existing || { id: uid(), createdAt: Date.now(), rating: 0, favorite: false, timesMade: 0, notes: '', images: [] }),
    ...fields,
    category: (existing && existing.category) || guessCategory(fields) || '',
    diet: (existing && existing.diet) || suggestDiet(fields),
    photos: photo ? [photo] : ((existing && existing.photos) || []),
  };
  try {
    await saveRecipe(recipe);
  } catch (e) {
    console.error(e);
    toast(/quota/i.test(e && e.name) ? 'This device is out of storage.' : 'Saving failed. Try again.');
    return;
  }
  toast(existing ? `Updated from ${found.sourceSite || 'the web'}` : `Added from ${found.sourceSite || 'the web'}`);
  if (location.hash === `#/recipe/${encodeURIComponent(recipe.id)}`) render();
  else location.hash = `#/recipe/${encodeURIComponent(recipe.id)}`;
}

// Keep the recipe's photo on this device when the site allows it; otherwise link to it.
async function keepWebPhoto(url) {
  if (!url) return '';
  try {
    const res = await within(fetch(url, { mode: 'cors' }), 8000);
    if (!res.ok) throw new Error(String(res.status));
    return await within(compressPhoto(await res.blob(), 1400, 0.8), 8000);
  } catch { return url; }
}

async function makeBackup() {
  const data = { app: 'recipe-box', version: 1, exportedAt: new Date().toISOString(), recipes: state.recipes, grocery: state.grocery };
  const name = `recipe-box-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const file = new File([JSON.stringify(data)], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Recipe Box backup' }); return; }
    catch (err) { if (err.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(file);
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('Backup saved');
}

async function restoreBackup(file) {
  try {
    const data = JSON.parse(await file.text());
    if (!data || !Array.isArray(data.recipes)) throw new Error('bad');
    const recipes = data.recipes.filter(r => r && r.id && r.title).map(r => ({
      ingredients: [], steps: [], images: [], rating: 0, timesMade: 0, createdAt: Date.now(), ...r,
    }));
    if (!confirm(`Restore ${plural(recipes.length, 'recipe')}? Recipes already saved are kept; matching ones are replaced by the backup copy.`)) return;
    await db.putManyRecipes(recipes);
    state.recipes = await db.allRecipes();
    if (Array.isArray(data.grocery) && data.grocery.length && !state.grocery.length) {
      state.grocery = data.grocery; await saveGrocery();
    }
    toast(`Restored ${plural(recipes.length, 'recipe')}`);
    renderSettings();
  } catch {
    toast("That file isn't a Recipe Box backup.");
  }
}

async function setRating(v) {

function redrawIngredients(r, focusIndex = null) {
  const list = document.querySelector('.ing-list'); if (!list) return;
  const crossed = new Set([...list.querySelectorAll('.ing[aria-pressed="true"]')].map(b => b.dataset.index));
  const factor = state.scale[r.id] || 1, units = state.units[r.id] || {};
  list.innerHTML = r.ingredients.map((ing, i) => ingredientRow(ing, i, factor, units[i] || 0)).join('');
  crossed.forEach(i => { const b = list.querySelector(`.ing[data-index="${i}"]`); if (b) { b.setAttribute('aria-pressed', 'true'); b.closest('.ing-row').classList.add('crossed'); } });
  if (focusIndex != null) list.querySelector(`.ing-qty[data-index="${focusIndex}"]`)?.focus({ preventScroll: true });
}

async function shareRecipe(r) {
  const result = await shareText(recipeToText(r, state.scale[r.id] || 1));
  if (result === 'copied') toast('Recipe copied');
}

async function deleteRecipe(r) {
  if (!confirm(`Delete “${r.title}”? This can't be undone.`)) return;
  await db.deleteRecipe(r.id);
  state.recipes = state.recipes.filter(x => x.id !== r.id);

// Photo viewer: scanned pages ("images") or photos of the dish ("photos", removable).
function openViewer(r, kind, index) {
  const dlg = document.getElementById('photoViewer');
  const list = r[kind] || [];
  if (!list.length) return;
  const i = Math.min(Math.max(index, 0), list.length - 1);
  dlg.dataset.kind = kind; dlg.dataset.index = i;
  document.getElementById('photoViewerImg').src = list[i];
  document.getElementById('photoViewerImg').alt = kind === 'photos' ? `Photo ${i + 1} of ${r.title}` : `Scanned page ${i + 1}`;
  document.getElementById('photoRemove').hidden = kind !== 'photos';
  document.getElementById('photoPrev').hidden = document.getElementById('photoNext').hidden = list.length < 2;
  if (!dlg.open) dlg.showModal();
}

async function addDishPhotos(r, files) {
  const images = [...files].filter(f => f.type.startsWith('image/') || /\.(heic|heif|jpe?g|png|webp)$/i.test(f.name));
  if (!images.length) return;
  toast(`Adding ${plural(images.length, 'photo')}…`);
  const added = await Promise.all(images.map(f => compressPhoto(f, 1600, 0.82)));
  r.photos = [...(r.photos || []), ...added];
  await saveRecipe(r);
  toast(`Added ${plural(added.length, 'photo')}`);
  state.recipeTab = { id: r.id, tab: 'photos' }; // show the photos that were just added
  renderRecipe(r.id);
}

// Recipe / Photos / Notes: switch panels in place, so crossed-off
// ingredients, finished steps and a half-typed note all survive the switch.
function showRecipeTab(key, focus = false) {
  if (!RECIPE_TABS.some(([k]) => k === key)) return;
  state.recipeTab.tab = key;
  view.querySelectorAll('.rtab').forEach(t => {
    const on = t.dataset.rtab === key;
    t.setAttribute('aria-selected', on);
    t.tabIndex = on ? 0 : -1;
    if (on && focus) t.focus();
  });
  view.querySelectorAll('.rpanel').forEach(p => { p.hidden = p.id !== `rpanel-${key}`; });
  if (key === 'notes') fitNotes(); // a hidden box can't measure itself, so size it now
}

async function setCategory(id, category) {
  const r = state.recipes.find(x => x.id === id); if (!r) return;
  r.category = category;
  await saveRecipe(r);
  toast(category ? `Moved to ${category}` : 'Removed from its section');
}

function currentRecipe() {
  const r = route();
  return r.name === 'recipe' ? state.recipes.find(x => x.id === r.id) : null;
}

const actions = {
  'set-theme': el => setTheme(el.dataset.themeId),
  'dismiss-install': async () => { state.settings.installTipDismissed = true; await saveSettings(); document.querySelector('.notice')?.remove(); },
  'filter': el => {
    state.filter.cat = el.dataset.cat;
    document.querySelectorAll('.pill-btn').forEach(d => d.setAttribute('aria-pressed', d === el));
    renderContents();
  },
  'clear-filters': () => { state.filter.q = ''; state.filter.cat = 'all'; renderHome(); },

  'rate': el => {
    const r = currentRecipe(); if (!r) return;
    const n = Number(el.dataset.star), cur = r.rating || 0;
    // n -> n-½ -> cleared -> n
    const next = cur === n ? n - 0.5 : cur === n - 0.5 ? 0 : n;
    setRating(next);
  },
  'fav': async el => {
    const r = currentRecipe(); if (!r) return;
    r.favorite = !r.favorite;
    await saveRecipe(r);
    el.setAttribute('aria-pressed', r.favorite);
    toast(r.favorite ? 'Added to favorites' : 'Removed from favorites');
  },
  'scale': el => {
    const r = currentRecipe(); if (!r) return;
    const f = Number(el.dataset.factor);
    state.scale[r.id] = f;
    document.querySelectorAll('.scaler button').forEach(b => b.setAttribute('aria-pressed', Number(b.dataset.factor) === f));
    redrawIngredients(r);
  },
  'convert': el => {
    const r = currentRecipe(); if (!r) return;
    const i = Number(el.dataset.index);
    const views = unitViews(r.ingredients[i]);
    const units = state.units[r.id] || (state.units[r.id] = {});
    units[i] = ((units[i] || 0) + 1) % views;
    redrawIngredients(r, i);
  },
  'tick': el => {
    const on = el.getAttribute('aria-pressed') !== 'true';
    el.setAttribute('aria-pressed', on);
    el.closest('.ing-row')?.classList.toggle('crossed', on);
    const left = document.querySelectorAll('.ing[aria-pressed="false"]').length;
    const btn = document.getElementById('addToList');
    btn.disabled = left === 0;
    btn.textContent = left ? `Add ${plural(left, 'item')} to grocery list` : 'You have everything';
  },
  'step': el => el.classList.toggle('done'),
  'add-to-list': async () => {
    const r = currentRecipe(); if (!r) return;
    const factor = state.scale[r.id] || 1;
    const picked = [...document.querySelectorAll('.ing[aria-pressed="false"]')].map(b => scaleIngredient(r.ingredients[Number(b.dataset.index)], factor));
    const existing = new Set(state.grocery.filter(i => !i.checked && i.recipeId === r.id).map(i => i.text.toLowerCase()));
    const fresh = picked.filter(t => !existing.has(t.toLowerCase()));
    state.grocery.push(...fresh.map(text => ({ id: uid(), text, checked: false, recipeId: r.id, recipeTitle: r.title, addedAt: Date.now() })));
    await saveGrocery();
    toast(fresh.length ? `Added ${plural(fresh.length, 'item')} to your grocery list` : 'Those are already on your list');
  },
  'made': async () => {
    const r = currentRecipe(); if (!r) return;
    r.timesMade = (r.timesMade || 0) + 1;
    r.lastMade = Date.now();
    await saveRecipe(r);
    document.querySelector('.made-count').textContent = `Made ${plural(r.timesMade, 'time')}, most recently ${fmtDate(r.lastMade)}.`;
    toast('Noted');
  },
  'wake': async el => {
    const on = el.getAttribute('aria-pressed') !== 'true';
    const ok = await setWakeLock(on);
    if (!ok) { toast("This device won't keep the screen on from here."); return; }
    el.setAttribute('aria-pressed', on);
    toast(on ? 'Screen will stay on while this recipe is open' : 'Screen will sleep as usual');
  },
  'recipe-menu': () => { const r = currentRecipe(); if (r) openRecipeMenu(r); },
  'recipe-tab': el => showRecipeTab(el.dataset.rtab),
  'view-scans': () => { const r = currentRecipe(); if (r) openViewer(r, 'images', 0); },
  'view-photo': el => {
    const r = currentRecipe(); if (!r) return;
    const kind = el.dataset.kind || 'images';
    openViewer(r, kind, Number(el.dataset.index));
  },
  'auto-sort': async () => {
    const loose = state.recipes.filter(r => !CATEGORIES.includes(r.category));
    let moved = 0;
    for (const r of loose) { const c = guessCategory(r); if (c) { r.category = c; await saveRecipe(r); moved++; } }
    toast(moved ? `Sorted ${plural(moved, 'recipe')}. Change any of them from the recipe's ⋯ menu.` : 'Couldn’t tell where these go; pick a section for each.');
    renderHome();
  },
  'fix-issue': el => {
    const box = document.getElementById('issues');
    const x = box && box._issues && box._issues[Number(el.dataset.issue)];
    if (x) focusIssue(x);
  },
  'row-add-header': el => addRow(document.getElementById(el.dataset.list), '', null, true, true),

  'remove-photo': el => {
    const [p] = state.draft.photos.splice(Number(el.dataset.index), 1);
    if (p && p.file) URL.revokeObjectURL(p.src);
    renderPhotoTray();
  },
  'scan': () => runScan(),
  'copy-snippet': async el => {
    const src = document.getElementById(el.dataset.target);
    if (src) toast((await copyText(src.textContent)) ? 'Copied' : 'Copying failed on this device');
  },
  'copy-report': async () => {
    if (!state.lastScanReport) return;
    toast((await copyText(state.lastScanReport)) ? 'Scan report copied' : 'Copying failed on this device');
  },
  'row-add': el => addRow(document.getElementById(el.dataset.list)),
  'row-remove': el => {
    const row = el.closest('.edit-row');
    const list = row.parentElement;
    const target = row.nextElementSibling || row.previousElementSibling;
    row.remove();
    if (!list.children.length) addRow(list, '', null, false);
    renumber(list);
    (target || list.lastElementChild).querySelector('.row-input').focus();
  },

  'group': async el => { state.settings.groupBy = el.dataset.by; await saveSettings(); renderList(); },
  'gdel': async el => { state.grocery = state.grocery.filter(i => i.id !== el.dataset.id); await saveGrocery(); renderList(); },
  'export-list': async () => {
    const result = await shareText(groceryText());
    if (result === 'copied') toast('List copied. Paste it into a new note.');
    if (result === 'failed') toast('Sharing is not available here. Use Copy instead.');
  },
  'copy-list': async () => toast((await copyText(groceryText())) ? 'List copied. Paste it into a new note.' : 'Copying failed on this device.'),
  'clear-checked': async () => { state.grocery = state.grocery.filter(i => !i.checked); await saveGrocery(); renderList(); },
  'clear-list': async () => {
    if (!confirm('Clear the whole grocery list?')) return;
    state.grocery = []; await saveGrocery(); renderList();
  },

  'backup': () => makeBackup(),
  'delete-all': async () => {
    if (!confirm(`Delete all ${plural(state.recipes.length, 'recipe')} and clear the grocery list? This can't be undone.`)) return;
    await db.clearRecipes();
    state.recipes = []; state.grocery = [];
    await saveGrocery();
    toast('All recipes deleted');
    location.hash = '#/';
  },
};

view.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || !view.contains(el)) return;
  if (el.dataset.action === 'paste-recipe') { e.preventDefault(); pasteRecipe(readClipboardNow()); return; }
  const fn = actions[el.dataset.action];
  if (!fn) return;
  e.preventDefault();
  // An error in one button shouldn't leave the screen unresponsive.
  Promise.resolve().then(() => fn(el, e)).catch(err => { console.error(err); toast('That didn’t work. Try again.'); });
});

view.addEventListener('pointerdown', e => {
  const grip = e.target.closest('[data-grip]');
  if (grip && (e.button === 0 || e.pointerType !== 'mouse')) startDrag(e, grip);
});

view.addEventListener('keydown', e => {
  // Arrow keys, Home and End move between the recipe's tabs.
  const rtab = e.target.closest('.rtab');
  if (rtab && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
    e.preventDefault();
    const keys = RECIPE_TABS.map(([k]) => k);
    const i = keys.indexOf(rtab.dataset.rtab);
    const next = e.key === 'Home' ? 0 : e.key === 'End' ? keys.length - 1
      : (i + (e.key === 'ArrowRight' ? 1 : -1) + keys.length) % keys.length;
    showRecipeTab(keys[next], true);
    return;
  }
  const grip = e.target.closest('[data-grip]');
  if (grip) return moveWithKeys(e, grip);
  const input = e.target.closest('.edit-row .row-input');
  if (!input) return;
  const row = input.closest('.edit-row');
  // Return starts a new row; Backspace in an empty row removes it.
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    addRow(row.parentElement, '', row);
  } else if (e.key === 'Backspace' && !input.value && row.parentElement.children.length > 1) {
    e.preventDefault();
    const prev = row.previousElementSibling || row.nextElementSibling;
    const list = row.parentElement;
    row.remove(); renumber(list);
    const t = prev.querySelector('.row-input');
    t.focus(); t.setSelectionRange(t.value.length, t.value.length);
  }
});

view.addEventListener('paste', e => {
  const input = e.target.closest('.edit-row .row-input');
  if (!input) return;
  const text = (e.clipboardData || window.clipboardData).getData('text');
  const parts = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  if (parts.length < 2) return;
  e.preventDefault();
  const row = input.closest('.edit-row');
  input.value = (input.value + ' ' + parts[0]).trim();
  autosize(input);
  let after = row;
  for (const p of parts.slice(1)) after = addRow(row.parentElement, p, after, false);
  after.querySelector('.row-input').focus();
});

view.addEventListener('input', e => {
  if (e.target.id === 'search') { state.filter.q = e.target.value; renderContents(); }
  if (e.target.classList.contains('notes-input')) autosize(e.target);
  if (e.target.classList.contains('row-input')) {
    autosize(e.target);
    const row = e.target.closest('.needs-check');
    if (row) { row.classList.remove('needs-check'); row.querySelector('.row-flag')?.remove(); }
    const unsure = e.target.closest('.edit-row.unsure');
    if (unsure) {
      unsure.classList.remove('unsure');
      unsure.querySelector('.row-doubt')?.remove();
      e.target.removeAttribute('aria-describedby');
    }
  }
  const field = e.target.closest && e.target.closest('.field.unsure');
  if (field) clearFieldDoubt(field);
});

let notesTimer;
view.addEventListener('input', e => {
  if (e.target.id !== 'notes') return;
  clearTimeout(notesTimer);
  const value = e.target.value;
  notesTimer = setTimeout(async () => {
    const r = currentRecipe(); if (!r) return;
    r.notes = value.trim();
    await saveRecipe(r);
  }, 600);
});

view.addEventListener('change', async e => {
  const t = e.target;
  if (t.name === 'appearance') { await setMode(t.value); return; }
  if (t.dataset.categoryFor) { await setCategory(t.dataset.categoryFor, t.value); renderContents(); return; }
  if (t.hasAttribute('data-photo-input')) { const r = currentRecipe(); if (r) await addDishPhotos(r, t.files); t.value = ''; return; }
  if (t.id === 'sort') { state.filter.sort = t.value; renderContents(); }
  else if (t.id === 'photoInput') {
    const files = [...t.files].filter(f => f.type.startsWith('image/') || /\.(heic|heif|jpe?g|png|webp)$/i.test(f.name));
    state.draft.photos.push(...files.map(file => ({ file, src: URL.createObjectURL(file) })));
    // Number-aware name order (IMG_7945, IMG_7946…) is the fallback when pages don't overlap.
    state.draft.photos.sort((a, b) => (a.file && b.file) ? a.file.name.localeCompare(b.file.name, undefined, { numeric: true }) : 0);
    t.value = '';
    renderPhotoTray();
  }
  else if (t.id === 'restoreInput' && t.files[0]) { await restoreBackup(t.files[0]); t.value = ''; }
  else if (t.dataset.gid) {
    const item = state.grocery.find(i => i.id === t.dataset.gid);
    if (!item) return;
    item.checked = t.checked;
    t.closest('.g-item').classList.toggle('done', t.checked);
    await saveGrocery();
    document.querySelector('[data-action="clear-checked"]').disabled = !state.grocery.some(i => i.checked);
    const open = state.grocery.some(i => !i.checked);
    document.querySelector('[data-action="export-list"]').disabled = !open;
    document.querySelector('[data-action="copy-list"]').disabled = !open;
    const meta = document.getElementById('listMeta');
    if (meta) meta.textContent = `${plural(state.grocery.filter(i => !i.checked).length, 'item')} to buy`;
  }
});

view.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'recipeForm') submitForm(e.target);
  if (e.target.id === 'addItemForm') {
    const input = document.getElementById('newItem');
    const text = input.value.trim();
    if (!text) return;
    state.grocery.push({ id: uid(), text, checked: false, recipeId: null, recipeTitle: '', addedAt: Date.now() });
    await saveGrocery();
    renderList();
    document.getElementById('newItem').focus();
  }
});

const viewer = document.getElementById('photoViewer');
viewer.addEventListener('click', async e => {
  if (e.target === viewer) return viewer.close(); // tap outside the photo
  const r = currentRecipe(); if (!r) return;
  const kind = viewer.dataset.kind, i = Number(viewer.dataset.index);
  if (e.target.closest('#photoPrev')) openViewer(r, kind, (i - 1 + r[kind].length) % r[kind].length);
  if (e.target.closest('#photoNext')) openViewer(r, kind, (i + 1) % r[kind].length);
  if (e.target.closest('#photoRemove') && confirm('Remove this photo?')) {
    r.photos.splice(i, 1);
    await saveRecipe(r);
    viewer.close();
    toast('Photo removed');
    renderRecipe(r.id);
  }
});

const sheet = document.getElementById('sheet');
sheet.addEventListener('click', async e => {
  if (e.target === sheet || e.target.closest('[data-close]')) return sheet.close();
  const btn = e.target.closest('[data-sheet-action]');
  if (!btn) return;
  const r = currentRecipe(); if (!r) return;
  sheet.close();
  if (btn.dataset.sheetAction === 'share') shareRecipe(r);
  if (btn.dataset.sheetAction === 'scans') openViewer(r, 'images', 0);
  if (btn.dataset.sheetAction === 'delete') deleteRecipe(r);
});
// The paste box: import as soon as something is pasted into it.
sheet.addEventListener('input', e => {
  if (e.target.id !== 'pasteBox') return;
  const text = e.target.value;
  if (text.trim().length > 20) importWebRecipe(text);
});
sheet.addEventListener('change', async e => {
  const t = e.target;
  const r = currentRecipe(); if (!r) return;
  if (t.dataset.categoryFor) { sheet.close(); await setCategory(r.id, t.value); renderRecipe(r.id); }
  if (t.dataset.dietFor) {
    r.diet = { ...(r.diet || {}), [t.dataset.dietFor]: t.value };
    await saveRecipe(r);
    renderRecipe(r.id);
    toast(dietTags(r).length ? `Marked ${dietTags(r).join(', ')}` : 'Diet tags cleared');
  }
  if (t.hasAttribute('data-photo-input')) { sheet.close(); await addDishPhotos(r, t.files); t.value = ''; }
});

// ---------- start ----------

async function boot() {
  try {
    const [recipes, grocery, settings] = await Promise.all([db.allRecipes(), db.get('grocery'), db.get('settings')]);
    state.recipes = recipes || [];
    state.grocery = grocery || [];
    state.settings = { ...state.settings, ...(settings || {}) };
    state.settings.mode = window.rbApplyMode(state.settings.mode);
    state.settings.theme = window.rbApplyTheme(state.settings.theme);
  } catch (err) {
    console.error(err);
    window.__recipeBoxStarted = true;
    view.innerHTML = `<section class="card sec"><h1 class="sec-title">Recipe Box can't open its storage</h1>
      <p>Private Browsing blocks saved data. Open Recipe Box in a regular Safari tab or from your Home Screen.</p></section>`;
    return;
  }
  updateListCount();
  window.addEventListener('hashchange', render);
  render();
  window.__recipeBoxStarted = true;
  if (db.memoryOnly) toast('Preview mode: recipes added here won’t be saved');
  else requestPersistence();
}

// Offline support needs a real web address; file previews don't have one.
try {
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Offline support unavailable', err));
  }
} catch (err) { console.warn('Offline support unavailable', err); }

boot();
  </script>
</body>
