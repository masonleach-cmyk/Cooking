<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recipe Box</title>
  <meta name="description" content="Scan, keep and cook from your recipe cards.">

  <!-- Home screen app (iOS + Android) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Recipe Box">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#8FD3CC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#24524E" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">

  <!-- Fonts: Lilita One (diner signage) + Nunito Sans (everything else) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito+Sans:opsz,wght@6..12,400;6..12,700;6..12,800&display=swap">

  <style>
/* Recipe Box — Diner '56: aqua and cherry red, checkerboard trim, menu-card lists, order-ticket steps. */

:root {
  --cream: #FFF8EC;          /* page */
  --card: #FFFFFF;
  --aqua: #8FD3CC;           /* light band */
  --aqua-deep: #1C6E69;      /* deep band, sign plates */
  --heading: #1C6E69;        /* headings and links on cream and white */
  --cherry: #C2202A;
  --cherry-ink: #FFFFFF;
  --ink: #1E2A2A;
  --muted: #4E5C5B;
  --line: #D9E6E3;
  --dash: #E6DCCF;
  --star-off: #E7D8CF;
  --tab: #1E2A2A;
  --tab-text: #C9D6D4;

  --display: 'Lilita One', 'Arial Rounded MT Bold', 'Helvetica Neue', sans-serif;
  --text: 'Nunito Sans', -apple-system, 'Helvetica Neue', sans-serif;

  --measure: 40rem;
  --gutter: 1.1rem;
  --radius: 18px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --tabs-h: 3.75rem;

  color-scheme: light;
}

/* Diner after closing time */
@media (prefers-color-scheme: dark) {
  :root {
    --cream: #111A1A;
    --card: #1B2727;
    --aqua: #24524E;
    --aqua-deep: #163F3C;
    --heading: #8FD3CC;
    --cherry: #E5525B;
    --cherry-ink: #1A0507;
    --ink: #EAF2F0;
    --muted: #A9BAB8;
    --line: #2C3D3C;
    --dash: #2E3B3A;
    --star-off: #3A4A49;
    --tab: #0B1212;
    --tab-text: #9FB1AE;
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--cream); }

body {
  margin: 0;
  min-height: 100dvh;
  overflow-x: hidden;
  font-family: var(--text);
  font-size: 1.0625rem;
  line-height: 1.5;
  color: var(--ink);
  background: var(--cream);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

main {
  max-width: calc(var(--measure) + 2 * var(--gutter));
  margin: 0 auto;
  padding: 0 var(--gutter) calc(var(--tabs-h) + var(--safe-bottom) + 2rem);
  outline: none;
}

img { max-width: 100%; display: block; }
a { color: var(--heading); }
p { margin: 0 0 .75rem; }

:focus-visible { outline: 3px solid var(--cherry); outline-offset: 2px; border-radius: 4px; }
main:focus, main:focus-visible { outline: none; } /* focused on each screen change for screen readers only */

.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip-link { position: absolute; left: -999px; top: 0; }
.skip-link:focus { left: 1rem; top: calc(var(--safe-top) + .5rem); z-index: 50; background: var(--card); padding: .5rem 1rem; }

/* ---------- header bands, sign lettering, checker trim ---------- */

.band {
  position: relative;
  width: 100vw;
  margin-left: calc(50% - 50vw);
  padding: calc(var(--safe-top) + .6rem) max(var(--gutter), calc(50vw - var(--measure) / 2)) 1.25rem;
  background: var(--aqua-deep);
  color: #FFFFFF;
}
.band > .sign:first-child { margin-top: .9rem; }
.band-home { background: var(--aqua); text-align: center; padding-top: calc(var(--safe-top) + 1.75rem); color: var(--ink); }
.checker {
  width: 100vw;
  margin-left: calc(50% - 50vw);
  height: 14px;
  background: repeating-conic-gradient(#1E2A2A 0 25%, #FFFFFF 0 50%) 0 0 / 14px 14px;
  margin-bottom: 1.1rem;
}

.sign {
  margin: 0;
  font: 400 clamp(2rem, 9vw, 2.5rem)/1.05 var(--display);
  color: #FFFFFF;
  text-shadow: 3px 3px 0 var(--cherry);
  letter-spacing: .01em;
  text-wrap: balance;
}
.sign-plate {
  display: inline-block;
  padding: .85rem 1.6rem .6rem;
  border-radius: 999px;
  background: var(--aqua-deep);
  border: 4px solid #FFFFFF;
  box-shadow: 0 0 0 4px var(--cherry);
}
.band-home .sign { font-size: clamp(2.4rem, 11vw, 2.75rem); }
.band-sub { margin: .7rem 0 0; font-weight: 800; font-size: .9rem; opacity: .92; }
.band-home .band-sub { color: var(--ink); }
.band-settings { position: absolute; top: calc(var(--safe-top) + .4rem); right: .5rem; color: var(--ink); }

.band-bar { display: flex; justify-content: space-between; align-items: center; margin: 0 -.5rem .35rem; min-height: 2.75rem; }
.back {
  display: inline-flex; align-items: center; gap: .3rem; min-height: 2.75rem; padding: 0 .5rem;
  color: inherit; text-decoration: none; font-weight: 800;
}
.back::before {
  content: ''; width: .55rem; height: .55rem;
  border-left: 2.5px solid currentColor; border-bottom: 2.5px solid currentColor;
  transform: rotate(45deg); margin-right: .1rem;
}
.band-actions { display: flex; align-items: center; }
.band-link { color: #FFFFFF; font-weight: 800; text-decoration: none; padding: 0 .6rem; min-height: 2.75rem; display: inline-flex; align-items: center; }
.fav-btn { color: #FFFFFF; }
.fav-btn svg path { fill: none; }
.fav-btn[aria-pressed="true"] { color: #FF8C93; }
.fav-btn[aria-pressed="true"] svg path { fill: currentColor; }

.band-pills { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .9rem; }
.pill { display: inline-flex; align-items: center; min-height: 2rem; padding: .2rem .85rem; border-radius: 999px; font-weight: 800; font-size: .9rem; }
.pill-cherry { background: var(--cherry); color: var(--cherry-ink); }
.pill-white { background: #FFFFFF; color: #1E2A2A; }

/* half-star rating: tap position sets the value in half steps */
.st { display: inline-block; color: var(--star-off); }
.st.full { color: var(--cherry); }
.st.half {
  background: linear-gradient(90deg, var(--cherry) 50%, var(--star-off) 50%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.rating {
  display: inline-flex; align-items: center; gap: .15rem;
  min-height: 2.75rem; padding: 0 .75rem; cursor: pointer;
  font-size: 1.45rem; letter-spacing: .05em; touch-action: manipulation;
  --star-off: #E7D8CF; --cherry: #C2202A;
}
.rating:focus-visible { outline: 3px solid #FFFFFF; outline-offset: 2px; }

/* ---------- controls ---------- */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  min-height: 2.9rem; padding: .55rem 1.25rem;
  font: 800 1rem/1.2 var(--text);
  text-decoration: none; cursor: pointer;
  border-radius: 999px; border: 2.5px solid transparent;
  touch-action: manipulation;
}
.btn:disabled { opacity: .45; cursor: default; }
.btn-primary { background: var(--cherry); color: var(--cherry-ink); box-shadow: 0 3px 0 rgba(0, 0, 0, .18); }
.btn-primary:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, .18); }
.btn-secondary { background: var(--card); color: var(--ink); border-color: var(--ink); }
.btn-secondary[aria-pressed="true"], .btn-chip[aria-pressed="true"] { background: var(--ink); color: var(--cream); }
.btn-danger { background: transparent; color: var(--cherry); border-color: var(--cherry); }
.btn-quiet { background: none; color: var(--muted); padding-inline: .6rem; }
.btn-chip { min-height: 2.5rem; padding: .3rem .9rem; font-size: .85rem; background: var(--card); color: var(--ink); border-color: var(--line); }
.btn-wide { width: 100%; }
.file-btn { position: relative; }

.text-btn {
  display: inline-flex; align-items: center; min-height: 2.75rem;
  background: none; border: 0; padding: 0 .25rem; cursor: pointer;
  font: 800 1rem var(--text); color: var(--heading); text-decoration: none;
}
.icon-btn { display: grid; place-items: center; width: 2.75rem; height: 2.75rem; border: 0; background: none; border-radius: 50%; cursor: pointer; }
.action-row { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }

/* ---------- cards & sections ---------- */

.card {
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: var(--radius);
  margin-bottom: 1rem;
}
.sec { padding: 1.1rem 1.15rem 1.25rem; }
.sec.plain { padding-inline: .1rem; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap; margin-bottom: .5rem; }
.sec-title { margin: 0; font: 400 1.6rem/1.15 var(--display); color: var(--heading); }
.sec-title.cherry { color: var(--cherry); }
.sec > .sec-title { margin-bottom: .6rem; }
.hint { color: var(--muted); font-size: .92rem; margin: .75rem 0; }
.empty p { color: var(--muted); max-width: 32em; }
.notice { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .75rem 1rem; }
.notice p { margin: 0; font-size: .95rem; }

/* ---------- home: the menu ---------- */

.search {
  display: flex; align-items: center; gap: .6rem;
  min-height: 3rem; padding: 0 1rem;
  border-radius: 999px; background: var(--card);
  border: 3px solid var(--cherry); color: var(--muted);
}
.search input {
  flex: 1; min-width: 0; min-height: 2.6rem; padding: 0;
  font: 1.0625rem var(--text); color: var(--ink);
  background: transparent; border: 0; outline: none;
  -webkit-appearance: none; appearance: none;
}
.search input::placeholder { color: var(--muted); }
.search:focus-within { box-shadow: 0 0 0 3px color-mix(in srgb, var(--cherry) 25%, transparent); }

.finder-row { margin-top: .75rem; }
.chapters {
  display: flex; gap: .5rem; overflow-x: auto; scrollbar-width: none; padding: .15rem 2rem .15rem 0;
  -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 2rem), transparent);
  mask-image: linear-gradient(to right, #000 calc(100% - 2rem), transparent);
}
.chapters::-webkit-scrollbar { display: none; }
.pill-btn {
  flex: none; min-height: 2.5rem; padding: 0 1rem; cursor: pointer;
  border-radius: 999px; border: 2.5px solid var(--ink); background: var(--card); color: var(--ink);
  font: 800 .9rem var(--text);
}
.pill-btn[aria-pressed="true"] { background: var(--cherry); border-color: var(--cherry); color: var(--cherry-ink); }
.sort { display: flex; justify-content: flex-end; align-items: center; gap: .35rem; margin: .4rem 0 .5rem; font-size: .9rem; font-weight: 800; color: var(--muted); }
.sort select {
  font: 800 .9rem var(--text); color: var(--ink);
  background: transparent; border: 0; padding: .4rem .2rem; min-height: 2.5rem; cursor: pointer;
}

.menu { padding: .4rem 1.15rem .75rem; }
.menu-title { margin: .8rem 0 0; font: 400 1.6rem/1.2 var(--display); color: var(--cherry); }
.toc { list-style: none; margin: 0; padding: 0; }
.toc-row { display: block; padding: .7rem 0; color: var(--ink); text-decoration: none; }
.toc-row:active { opacity: .7; }
.toc-line { display: flex; align-items: baseline; gap: .5rem; }
.toc-title { font-weight: 800; font-size: 1.1rem; line-height: 1.3; }
.toc-leader { flex: 1; min-width: 1rem; border-bottom: 2.5px dotted var(--heading); opacity: .45; transform: translateY(-.3em); }
.toc-meta { flex: none; }
.toc-sub { display: block; font-size: .9rem; color: var(--muted); }
.fav-mark { color: var(--cherry); }
.new-tag { font-size: .85rem; font-weight: 800; color: var(--heading); }
.stars-static { letter-spacing: .06em; font-size: .9rem; white-space: nowrap; }

/* ---------- recipe ---------- */

.scaler { display: flex; gap: .3rem; }
.scaler button {
  min-width: 2.75rem; min-height: 2.25rem; padding: 0 .4rem; cursor: pointer;
  border-radius: 999px; border: 2.5px solid var(--ink); background: none; color: var(--ink);
  font: 800 .85rem var(--text);
}
.scaler button[aria-pressed="true"] { background: var(--cherry); border-color: var(--cherry); color: var(--cherry-ink); }

.ing-list { list-style: none; margin: 0; padding: 0; }
.ing {
  display: grid; grid-template-columns: 5.75rem 1fr; gap: .8rem;
  width: 100%; padding: .6rem 0; text-align: left; cursor: pointer;
  background: none; border: 0; border-bottom: 2px dashed var(--dash); color: var(--ink);
  font: 1.0625rem/1.4 var(--text);
}
.ing-qty { font-weight: 800; color: var(--cherry); overflow-wrap: anywhere; }
.ing-item { min-width: 0; }
.ing[aria-pressed="true"] { color: var(--muted); }
.ing[aria-pressed="true"] .ing-item, .ing[aria-pressed="true"] .ing-qty {
  text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: var(--heading);
  color: var(--muted);
}

/* order tickets */
.tickets { list-style: none; margin: .5rem 0 0; padding: 0; display: flex; flex-direction: column; gap: .8rem; }
.ticket {
  position: relative;
  display: grid; grid-template-columns: 2rem 1fr; gap: .75rem;
  padding: 1.15rem 1rem 1rem;
  background: var(--card);
  border-radius: 4px 4px 14px 14px;
  box-shadow: 0 2px 0 var(--line);
  cursor: pointer;
}
.ticket::before { /* perforated top edge */
  content: ''; position: absolute; left: 0; right: 0; top: -1px; height: 9px;
  background: radial-gradient(circle at 7px 0, var(--cream) 6px, transparent 6.5px) 0 0 / 14px 9px repeat-x;
}
.ticket-num { font: 400 1.9rem/1 var(--display); color: var(--cherry); }
.ticket p { margin: .15rem 0 0; line-height: 1.55; }
.ticket.done { opacity: .55; }
.ticket.done .ticket-num { color: var(--muted); }
.ticket.done p { text-decoration: line-through; text-decoration-color: var(--heading); }

.notes-input {
  display: block; width: 100%; min-height: 4.5rem;
  font: 1.0625rem/1.5 var(--text); color: var(--ink);
  background: var(--cream); border: 2px solid var(--line); border-radius: 12px;
  padding: .7rem .85rem; resize: vertical;
}
.notes-input:focus { outline: none; border-color: var(--heading); }

.photo-strip { display: flex; gap: .6rem; overflow-x: auto; padding-bottom: .25rem; }
.thumb { flex: none; padding: 0; border: 2px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--cream); cursor: zoom-in; }
.thumb img { width: 5.5rem; height: 7rem; object-fit: cover; object-position: top; }

.made-count { color: var(--muted); font-weight: 700; }

/* ---------- add / edit form ---------- */

.scan .hint { margin-top: 0; }
.photo-tray { display: flex; flex-wrap: wrap; gap: .75rem; margin-bottom: 1rem; }
.photo-tray[hidden] { display: none; }
.tray-photo { position: relative; margin: 0; border: 2px solid var(--line); border-radius: 10px; }
.tray-photo img { width: 4.5rem; height: 6rem; object-fit: cover; object-position: top; border-radius: 8px; }
.tray-remove {
  position: absolute; top: -.65rem; right: -.65rem;
  display: grid; place-items: center; width: 1.9rem; height: 1.9rem; border-radius: 50%;
  border: 0; background: var(--cherry); color: #FFFFFF; cursor: pointer;
}
.tray-remove svg { width: 14px; height: 14px; }

.progress { margin-top: 1rem; }
.progress[hidden] { display: none; }
.progress-track { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.progress-fill { display: block; height: 100%; width: 0; background: var(--cherry); transition: width .25s ease; }
.progress-label { margin: .6rem 0 0; font-weight: 700; }

.raw { margin-top: .9rem; font-size: .9rem; }
.raw[hidden] { display: none; }
.raw summary { cursor: pointer; color: var(--heading); font-weight: 800; min-height: 2.5rem; display: flex; align-items: center; }
.raw pre {
  white-space: pre-wrap; font: .85rem/1.5 ui-monospace, Menlo, monospace;
  background: var(--cream); border-radius: 10px; padding: .75rem; max-height: 18rem; overflow: auto; margin: 0;
}

.field { display: grid; gap: .2rem; margin-bottom: 1rem; min-width: 0; }
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1rem; }
.field label { font-size: .85rem; font-weight: 800; color: var(--muted); }
.field input, .field select {
  width: 100%; min-height: 2.9rem; padding: .4rem .85rem;
  font: 1.0625rem var(--text); color: var(--ink);
  background: var(--cream); border: 2px solid var(--line); border-radius: 12px;
  -webkit-appearance: none; appearance: none;
}
.field select {
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%;
  background-size: 5px 5px; background-repeat: no-repeat;
}
.field input:focus, .field select:focus { outline: none; border-color: var(--heading); }
.field input::placeholder { color: color-mix(in srgb, var(--muted) 70%, transparent); }
.field-error { margin: .25rem 0 0; color: var(--cherry); font-weight: 800; font-size: .9rem; }
.field-error[hidden] { display: none; }

/* one box per ingredient or step, reorderable by the handle */
.edit-list { list-style: none; margin: .5rem 0 0; padding: 0; }
.edit-row {
  display: grid; grid-template-columns: 2.25rem 1fr 2.5rem; align-items: start;
  background: var(--cream); border: 2px solid var(--line); border-radius: 12px;
  margin-bottom: .5rem;
}
.edit-list.steps .edit-row { grid-template-columns: 2.25rem 1.7rem 1fr 2.5rem; }
.grip {
  display: grid; place-items: center; align-self: stretch; min-height: 2.75rem;
  background: none; border: 0; color: var(--muted); cursor: grab;
  touch-action: none; /* lets a finger drag the row without scrolling the page */
}
.grip:active { cursor: grabbing; }
.row-num { font: 400 1.4rem/1 var(--display); color: var(--cherry); padding-top: .65rem; }
.row-input {
  display: block; width: 100%; min-height: 2.75rem; resize: none; overflow: hidden;
  padding: .6rem .25rem; border: 0; background: transparent;
  font: 1.0625rem/1.5 var(--text); color: var(--ink);
}
.edit-list.steps .row-input { min-height: 6.25rem; }
.row-input:focus { outline: none; }
.edit-row:focus-within { border-color: var(--heading); }
.row-remove {
  display: grid; place-items: center; width: 2.5rem; height: 2.75rem;
  background: none; border: 0; color: var(--muted); cursor: pointer;
}
.edit-row.dragging {
  position: relative; z-index: 5;
  border-color: var(--cherry); background: var(--card);
  box-shadow: 0 10px 24px -8px rgba(0, 0, 0, .3);
}
.is-dragging .edit-row:not(.dragging) { transition: transform .15s ease; }
.add-row { margin-top: .1rem; }

.check-row { display: flex; align-items: center; gap: .6rem; min-height: 2.75rem; margin-top: .75rem; font-weight: 700; }
.check-row[hidden] { display: none; }
.check-row input { width: 1.25rem; height: 1.25rem; accent-color: var(--cherry); }
.form-actions { padding: .25rem 0 1rem; }
.form-actions .btn { width: 100%; }

/* ---------- grocery list ---------- */

.add-item { display: flex; gap: .6rem; align-items: center; padding: .6rem .6rem .6rem 1rem; border-radius: 999px; }
.add-item input {
  flex: 1; min-width: 0; min-height: 2.6rem; padding: 0;
  font: 1.0625rem var(--text); color: var(--ink);
  background: transparent; border: 0; outline: none;
}
.add-item .btn { min-height: 2.6rem; }

.segmented { display: inline-flex; gap: .35rem; margin: 0 0 .75rem; }
.segmented button {
  min-height: 2.5rem; padding: 0 1rem; cursor: pointer;
  border-radius: 999px; border: 2.5px solid var(--ink); background: var(--card); color: var(--ink);
  font: 800 .9rem var(--text);
}
.segmented button[aria-pressed="true"] { background: var(--ink); color: var(--cream); }

.g-card { padding: .3rem 1.15rem .6rem; }
.g-title { margin: .8rem 0 .1rem; font: 400 1.35rem var(--display); color: var(--cherry); }
.g-list { list-style: none; margin: 0; padding: 0; }
.g-item { display: flex; align-items: center; gap: .5rem; border-bottom: 2px dashed var(--dash); }
.g-item:last-child { border-bottom: 0; }
.g-item label { display: flex; align-items: flex-start; gap: .75rem; flex: 1; padding: .6rem 0; cursor: pointer; min-height: 2.75rem; }
.g-item input {
  -webkit-appearance: none; appearance: none; flex: none;
  width: 1.4rem; height: 1.4rem; margin: .05rem 0 0;
  border: 2.5px solid var(--ink); border-radius: 6px; background: var(--card); cursor: pointer;
  display: grid; place-items: center;
}
.g-item input:checked { background: var(--cherry); border-color: var(--cherry); }
.g-item input:checked::after {
  content: ''; width: .35rem; height: .7rem; margin-top: -.15rem;
  border-right: 3px solid var(--cherry-ink); border-bottom: 3px solid var(--cherry-ink); transform: rotate(45deg);
}
.g-item.done span { color: var(--muted); text-decoration: line-through; }
.list-actions { margin: .5rem 0 .25rem; }

/* ---------- settings ---------- */

.settings p { max-width: 34em; }
.plain-steps { margin: 0 0 .75rem; padding-left: 1.3rem; }

/* ---------- bottom tabs ---------- */

.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: flex; justify-content: center;
  padding: .35rem .5rem calc(var(--safe-bottom) + .35rem);
  background: var(--tab);
}
.tab {
  position: relative; flex: 1; max-width: 9rem;
  display: flex; flex-direction: column; align-items: center; gap: .1rem;
  min-height: 2.9rem; padding: .25rem 0;
  font: 800 .72rem/1.2 var(--text); color: var(--tab-text); text-decoration: none;
}
.tab[aria-current="page"] { color: #8FD3CC; }
.tab-count {
  position: absolute; top: .05rem; left: calc(50% + .55rem);
  min-width: 1.2rem; height: 1.2rem; padding: 0 .3rem; border-radius: .6rem;
  background: #C2202A; color: #FFFFFF;
  font: 800 .7rem/1.2rem var(--text); text-align: center;
}
.tab-count[hidden] { display: none; }

/* ---------- toast & photo viewer ---------- */

.toast {
  position: fixed; left: 50%; z-index: 20;
  bottom: calc(var(--tabs-h) + var(--safe-bottom) + .9rem);
  width: max-content; max-width: min(26rem, calc(100vw - 2rem));
  padding: .65rem 1.2rem; text-align: center;
  background: var(--ink); color: var(--cream);
  border-radius: 999px; font-weight: 800; font-size: .95rem;
  transform: translate(-50%, .75rem); opacity: 0; pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.photo-viewer {
  border: 0; padding: 0; max-width: 100vw; max-height: 100dvh; width: 100vw; height: 100dvh;
  background: rgba(10, 18, 18, .94);
}
.photo-viewer[open] { display: grid; place-items: center; overflow: auto; }
.photo-viewer::backdrop { background: rgba(10, 18, 18, .94); }
.photo-viewer img { max-width: 96vw; max-height: 86dvh; object-fit: contain; border-radius: 8px; }
.photo-close {
  position: fixed; top: calc(var(--safe-top) + .75rem); right: 1rem;
  min-height: 2.75rem; padding: 0 1.1rem;
  font: 800 1rem var(--text); color: #1E2A2A; background: #FFFFFF;
  border: 0; border-radius: 999px; cursor: pointer;
}

.noscript { text-align: center; padding: 2rem; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ---------- ingredient sections ---------- */
.ing-head h3 {
  margin: 1.1rem 0 .1rem; font: 400 1.25rem/1.2 var(--display); color: var(--heading);
}
.ing-list > .ing-head:first-child h3 { margin-top: .25rem; }

/* ---------- recipe list: quick section picker ---------- */
.menu-head { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-top: .8rem; }
.menu-head .menu-title { margin: 0; }
.quick-cat { display: block; margin: -.2rem 0 .6rem; }
.quick-cat select {
  min-height: 2.4rem; padding: .2rem 2rem .2rem .8rem; border-radius: 999px;
  border: 2px dashed var(--heading); background: var(--cream); color: var(--heading);
  font: 800 .85rem var(--text); -webkit-appearance: none; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--heading) 50%), linear-gradient(135deg, var(--heading) 50%, transparent 50%);
  background-position: calc(100% - 15px) 55%, calc(100% - 10px) 55%; background-size: 5px 5px; background-repeat: no-repeat;
}

/* ---------- photos of the dish ---------- */
.dish-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(7rem, 1fr)); gap: .5rem; }
.dish { padding: 0; border: 0; border-radius: 12px; overflow: hidden; aspect-ratio: 1; cursor: zoom-in; background: var(--cream); }
.dish img { width: 100%; height: 100%; object-fit: cover; }
.menu-btn, .fav-btn { color: #FFFFFF; }

/* ---------- options sheet ---------- */
.sheet {
  margin: auto auto 0; width: 100%; max-width: 32rem; max-height: 90dvh;
  border: 0; padding: 0; border-radius: 22px 22px 0 0;
  background: var(--card); color: var(--ink);
}
.sheet::backdrop { background: rgba(10, 18, 18, .55); }
.sheet-body { padding: 1.1rem 1.1rem calc(var(--safe-bottom) + 1.1rem); }
.sheet-title { margin: 0 0 .75rem; font: 400 1.5rem/1.2 var(--display); color: var(--heading); text-wrap: balance; }
.sheet-actions { display: flex; flex-direction: column; margin-bottom: 1rem; border: 2px solid var(--line); border-radius: 16px; overflow: hidden; }
.sheet-item {
  display: flex; align-items: center; justify-content: space-between; gap: 1rem;
  min-height: 3.25rem; padding: .5rem 1rem; width: 100%; text-align: left;
  background: none; border: 0; border-bottom: 2px solid var(--line);
  font: 800 1rem var(--text); color: var(--ink); text-decoration: none; cursor: pointer;
}
.sheet-item:last-child { border-bottom: 0; }
.sheet-item.danger { color: var(--cherry); }
.sheet-select select {
  font: 800 1rem var(--text); color: var(--heading); background: transparent; border: 0;
  min-height: 2.5rem; text-align: right; cursor: pointer;
}

/* ---------- needs-attention card and flagged rows ---------- */
.attention { border-color: var(--cherry); border-style: dashed; }
.attention[hidden] { display: none; }
.issue-list { list-style: none; margin: 0; padding: 0; }
.issue-list li { display: flex; align-items: center; justify-content: space-between; gap: .75rem; padding: .55rem 0; border-top: 2px dashed var(--dash); font-weight: 700; }
.edit-row.is-header { background: var(--card); border-style: dashed; border-color: var(--heading); }
.edit-row.is-header .row-input { font: 400 1.2rem/1.5 var(--display); color: var(--heading); }
.edit-row.needs-check { border-color: var(--cherry); }
.row-flag { grid-column: 1 / -1; margin: 0; padding: .1rem .75rem .6rem 2.25rem; color: var(--cherry); font-size: .88rem; font-weight: 800; }

/* ---------- photo viewer controls ---------- */
.photo-bar { position: fixed; left: 0; right: 0; bottom: calc(var(--safe-bottom) + 1rem); display: flex; justify-content: center; gap: .75rem; }
.photo-nav, .photo-remove {
  min-width: 2.9rem; min-height: 2.9rem; padding: 0 1.1rem; border: 0; border-radius: 999px; cursor: pointer;
