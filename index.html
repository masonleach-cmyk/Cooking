function headingOf(s) {
  const plain = s.replace(/[:.\-–—]+$/, '').trim();
  // Allow "Directions: Preheat the oven..." on one line.
  const restAfterColon = () => { const after = s.includes(':') ? s.slice(s.indexOf(':') + 1).trim() : ''; return after.length > 3 ? after : ''; };
  for (const [kind, re] of Object.entries(HEADINGS)) {
    if (re.test(plain) && (plain.length < 32 || /:/.test(s))) return { kind, rest: restAfterColon() };
  }
  // Approximate: the first word alone (optionally with a colon), close to a heading word.
  const head = s.split(':')[0].trim();
  const word = head.toLowerCase().replace(/[^a-z]/g, '');
  if (word.length >= 5 && head.split(/\s+/).length <= 2 && (s.includes(':') || head.length === plain.length)) {
    for (const [target, kind] of FUZZY_HEADINGS) {
      const allowed = target.length >= 9 ? 2 : 1;
      if (Math.abs(word.length - target.length) <= allowed && editDistance(word, target) <= allowed) return { kind, rest: restAfterColon() };
    }
  }
  return null;
}

function looksLikeIngredient(s) {
  if (s.length > 80) return false;
  if (NUMBER_MARKER.test(s) && STEP_VERBS.test(s.replace(NUMBER_MARKER, ''))) return false;
  if (QTY_START.test(s)) return true;
  return UNIT_RE.test(s) && s.length < 50;
}

function looksLikeStep(s) {
  if (STEP_ONLY.test(s)) return true;
  if (NUMBER_MARKER.test(s)) {
    const body = s.replace(NUMBER_MARKER, '');
    return !QTY_START.test(body) || STEP_VERBS.test(body);
  }
  if (STEP_VERBS.test(s) && s.length > 18) return true;
  return s.length > 70 && /[.!]/.test(s);
}

const TIME = `((?:about\\s+)?[\\d½¼¾]+(?:\\s*(?:-|–|to)\\s*\\d+)?\\s*(?:min(?:ute)?s?|hours?|hrs?|h)\\.?(?:\\s*\\d+\\s*(?:min(?:ute)?s?))?)`;
const META = {
  servings: /\b(?:serves|servings?|yields?|makes)\b\s*:?\s*(?:about\s+)?([\d½¼¾⅓⅔]+(?:\s*(?:-|–|to)\s*\d+)?(?:\s+(?!prep|cook|bake|total|time|ready)[a-z]+)?)/i,
  prepTime: new RegExp(`\\bprep(?:aration)?(?:\\s*time\\s*:?|\\s*:|\\s+(?=\\d))\\s*${TIME}`, 'i'),
  cookTime: new RegExp(`\\b(?:cook(?:ing)?|bake|baking)(?:\\s*time\\s*:?|\\s*:)\\s*${TIME}`, 'i'),
  source: /\b(?:from the kitchen of|recipe from|from)\s*:\s*(.+)$/i,
};
// Tolerates misreads like "4 servines" / "4 sernings".
const SERVINGS_LINE = /^((?:about\s+)?[\d½¼¾]+(?:\s*(?:-|–|to)\s*\d+)?)\s+(?:serv\w*|ser\w{2}ngs?|se\w{1,2}ings?|portions?|people)\b/i;
// App/website labels that aren't part of the recipe.
const UI_LINE = /^(?:(?:yield|scale|convert|servings|print|share|save|rate|\d?x|ix|ixv)\s*)+$/i;
// "Bake 30 min" alone on a short line is metadata; inside a sentence it's a step.
const LOOSE_COOK = new RegExp(`^(?:cook|bake)\\s+${TIME}$`, 'i');

// ---------- main entry ----------

/**
 * @param {string} rawText  full OCR text (pages separated by blank lines)
 * @param {Array<{text:string,height:number}>} [ocrLines] lines with text height, used to find the title
 */
// Which parts of a scanned recipe to double-check: the words the reader was unsure of,
// traced to the ingredient, step or field they ended up in. Returns
// { fields: { servings: ['1hr'] }, ingredients: { 3: ['½'] }, steps: { 0: ['wok'] } }.
function scanDoubts(parsed, lines) {
  const toks = t => (t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .match(/[a-z]+|\d+|[½¼¾⅓⅔⅛⅜⅝⅞]/g) || []);
  const contains = (hay, needle) => {
    if (!needle.length || needle.length > hay.length) return false;
    outer: for (let i = 0; i + needle.length <= hay.length; i++) {
      for (let k = 0; k < needle.length; k++) if (hay[i + k] !== needle[k]) continue outer;
      return true;
    }
    return false;
  };
  const doubtful = (lines || []).filter(l => l.weak && l.weak.length).map(l => ({ toks: toks(l.text), weak: l.weak }));
  // An amount whose fraction couldn't be rebuilt ("¥% cup", "1% teaspoons"): the reader is
  // often confident about these, but they're the costliest thing to get wrong.
  const BAD_AMOUNT = /(?:^|\s)(\d*[%¥#@&§$£€*?]+[A-Za-z]?)(?=\s+(?:cups?|teaspoons?|tablespoons?|tsps?|tbsps?|pounds?|lbs?|ounces?|oz|pints?|quarts?|inch(?:es)?|medium|large|small|cloves?|sticks?)\b|-inch)|¥\S*/gi;
  const check = text => {
    if (!text) return [];
    const words = text.split(/\s+/);
    const all = toks(text);
    const found = new Set();
    for (const m of text.matchAll(BAD_AMOUNT)) found.add((m[1] || m[0]).trim());
    for (const l of doubtful) {
      // The line ended up in this text (or, for a short field, this text came from the line).
      if (!(contains(all, l.toks) || (all.length && contains(l.toks, all)))) continue;
      for (const w of l.weak) {
        if (!/[a-z0-9]/i.test(w) && words.includes(w)) { found.add(w); continue; } // a symbol where a word should be
        const wt = toks(w);
        // Ignore junk that was cleaned away and words too common to be worth a look.
        if (!wt.length || !contains(all, wt) || /^(?:a|an|the|and|or|of|to|in|on|is|it|at|by|as)$/.test(wt.join(' '))) continue;
        const shown = words.find(x => contains(toks(x), wt));
        if (shown) found.add(shown.replace(/^[^\w½¼¾⅓⅔⅛⅜⅝⅞]+|[^\w½¼¾⅓⅔⅛⅜⅝⅞)]+$/g, '') || shown);
      }
    }
    const list = [...found];
    return list.filter(w => !list.some(o => o !== w && o.includes(w))).slice(0, 3);
  };
  const out = { fields: {}, ingredients: {}, steps: {} };
  for (const k of ['title', 'servings', 'prepTime', 'cookTime', 'totalTime', 'source']) {
    const d = check(parsed[k]);
    if (d.length) out.fields[k] = d;
  }
  for (const kind of ['ingredients', 'steps']) {
    (parsed[kind] || []).forEach((t, i) => { const d = check(t); if (d.length) out[kind][i] = d; });
  }
  return out;
}

function parseRecipeText(rawText, ocrLines = [], titleHint = '', extra = {}) {
  const out = { title: '', servings: '', prepTime: '', cookTime: '', totalTime: '', source: extra.sourceHint || '', ingredients: [], steps: [], notes: '', issues: [] };

  // Keep blank lines as paragraph breaks (null entries).
  let lines = [];
  for (const raw of rawText.split(/\r?\n/)) {
    const s = cleanLine(raw);
    if (!s || isNoise(s)) { if (lines.length && lines[lines.length - 1] !== null) lines.push(null); continue; }
    lines.push(s);
  }

  // Step markers with a misread digit ("STEPS" for "STEP 5", "STEP l" for "STEP 1"):
  // fix them when the neighbouring step numbers make the intended number clear.
  lines = fixStepMarkers(lines);

  // Pull out metadata lines (serves, times, source) wherever they appear.
  lines = lines.filter(s => {
    if (s === null) return true;
    if (UI_LINE.test(s)) return false;
    const by = s.match(/^[Bb][Yy]\s+([A-Z][\w.'’-]+(?:\s+[A-Z][\w.'’-]+){0,3})\s*$/);
    if (by) { if (!out.source) out.source = by[1]; return false; }
    const NAMES = `([A-Z][\\w.'’-]+(?:\\s+(?:[A-Z][\\w.'’-]+|and|&))*)`;
    const from = s.match(new RegExp(`^recipe (?:from|by)\\s+${NAMES}\\s*$`, 'i'));
    if (from) { out.source = out.source && out.source !== from[1] ? `${from[1]}, ${out.source}` : from[1]; return false; }
    const adapted = s.match(new RegExp(`^adapted (?:by|from)\\s+${NAMES}\\s*$`, 'i'));
    if (adapted) { out.source = out.source ? `${out.source}, adapted by ${adapted[1]}` : `Adapted by ${adapted[1]}`; return false; }
    if (/\bprep\b/i.test(s) && !out.cookTime) {
      const c = s.match(/\bcook\s*:?\s*(\d+\s*(?:-|–|to)?\s*\d*\s*(?:min(?:ute)?s?|hours?|hrs?)\.?)/i);
      if (c) out.cookTime = c[1].trim();
    }
    // "4 servings" (number first) is checked before "Servings 4" so "4 servings 1x" reads as 4.
    const sv = s.match(SERVINGS_LINE);
    if (sv && s.length < 30) { if (!out.servings) out.servings = sv[1]; return false; }
    const total = s.match(/^(?:total\s+)?time\b[^\d\n]{0,4}?((?:about\s+)?\d+\s*(?:-|–|to)?\s*\d*\s*(?:min(?:ute)?s?|hours?|hrs?)(?:\s*\d+\s*min(?:ute)?s?)?)\.?$/i);
    if (total) { if (!out.totalTime) out.totalTime = total[1].trim(); return false; }
    let matched = false;
    for (const [key, re] of Object.entries(META)) {
      const m = s.match(re);
      if (m && !out[key]) { out[key] = m[1].trim().replace(/\.$/, ''); matched = true; }
    }
    const loose = !out.cookTime && s.match(LOOSE_COOK);
    if (loose) { out.cookTime = loose[1].trim(); return false; }
    // Only drop the line if it's mostly metadata, not a step that mentions baking time.
    return !(matched && s.length < 60 && !looksLikeStep(s));
  });

  // A title found elsewhere (e.g. an app's title bar): use it and drop repeats of it.
  if (titleHint) {
    out.title = titleHint;
    const t = titleHint.toLowerCase().replace(/[^a-z0-9]/g, '');
    lines = lines.filter(s => s === null || s.toLowerCase().replace(/[^a-z0-9]/g, '') !== t);
  }

  // Recipe card templates: "Recipe for: Apple Pie", a lone "Recipe" header.
  lines = lines.filter(s => s === null || !/^recipes?:?$/i.test(s));
  for (let i = 0; i < lines.length && !out.title; i++) {
    const m = lines[i] && lines[i].match(/^recipe(?:\s+for)?\s*:?\s+(.{3,})$/i);
    if (m) { out.title = m[1].trim(); lines.splice(i, 1); break; }
  }

  // Social captions often open with the name in capitals, then the description.
  if (!out.title) {
    const first = lines.findIndex(Boolean);
    if (first >= 0 && !headingOf(lines[first])) {
      const two = [lines[first], lines[first + 1]].filter(Boolean).join(' ');
      const m = two.match(/^([A-Z0-9][A-Z0-9 &'’,-]{5,}[A-Z0-9])(?=[^A-Za-z0-9]|\s+[a-z]|$)/);
      if (m && (m[1].match(/[A-Z]{2,}/g) || []).length >= 2) {
        out.title = m[1];
        const rest = two.slice(m[1].length).replace(/^[^A-Za-z(]+/, '');
        const usedSecond = m[1].length > lines[first].length;
        lines.splice(first, usedSecond ? 2 : 1, ...(rest ? [rest.charAt(0).toUpperCase() + rest.slice(1)] : []));
      }
    }
  }

  // Title: tallest text near the top if we have sizes; otherwise the first plausible line.
  if (!out.title) {
    const firstHeading = lines.findIndex(s => s && headingOf(s));
    const topZone = lines.slice(0, firstHeading > 0 ? Math.min(firstHeading, 6) : 6).filter(Boolean);
    const candidates = topZone.filter(s => /[a-z]{3}/i.test(s) && s.length <= 60 && !/^[a-z]/.test(s)
      && s.split(/\s+/).length <= 9 && !/[.!?,]$/.test(s) && !looksLikeIngredient(s) && !looksLikeStep(s));
    let pick = candidates[0] || '';
    if (ocrLines.length && candidates.length > 1) {
      let best = 0;
      for (const c of candidates) {
        const match = ocrLines.find(l => cleanLine(l.text) === c);
        if (match && match.height > best) { best = match.height; pick = c; }
      }
    }
    if (pick) {
      out.title = pick;
      lines.splice(lines.indexOf(pick), 1);
    }
  }
  out.title = titleCase(fixCommonMisreads(out.title.replace(/[:.]+$/, '')));
  // Recipe websites tack "Recipe" onto the name ("Teriyaki Baked Salmon Recipe").
  if (out.title.split(/\s+/).length >= 3) out.title = out.title.replace(/\s+recipe$/i, '');
  if (out.title) {
    const t = out.title.toLowerCase().replace(/[^a-z0-9]/g, '');
    lines = lines.filter(s => { if (s === null) return true; const k = s.toLowerCase().replace(/[^a-z0-9]/g, ''); return !(k.length >= 4 && t.includes(k)); });
  }

  // Split into sections by headings.
  const sections = { intro: [], ingredients: [], steps: [], notes: [] };
  let current = 'intro';
  let sawHeading = { ingredients: false, steps: false };
  for (const s of lines) {
    if (s === null) { sections[current].push(null); continue; }
    const h = headingOf(s);
    if (h) {
      current = h.kind;
      if (h.kind in sawHeading) sawHeading[h.kind] = true;
      if (h.rest) sections[current].push(h.rest);
      continue;
    }
    sections[current].push(s);
  }

  let ingLines = [], stepLines = [], noteLines = [...sections.notes];

  if (sawHeading.ingredients && sawHeading.steps) {
    ingLines = sections.ingredients;
    stepLines = sections.steps;
    noteLines = [...sections.intro, ...noteLines];
  } else {
    // Missing one or both headings: walk the unlabeled text and find where steps begin.
    const pool = sawHeading.ingredients ? sections.ingredients
      : sawHeading.steps ? sections.intro
      : sections.intro;
    let firstStep = pool.findIndex(s => s && looksLikeStep(s));
    // A method screenshot that starts mid-sentence ("minutes. Add zucchini…" then "STEP 4"):
    // the text before the first step marker finishes the previous step.
    const firstLine = pool.find(Boolean);
    if (!sawHeading.ingredients && !sawHeading.steps && firstLine && /^[a-z]/.test(firstLine)
      && pool.some(s => s && /^(?:step|stage)\s*\d{1,2}\s*[.:)]?$/i.test(s))) firstStep = pool.indexOf(firstLine);
    const head = firstStep === -1 ? pool : pool.slice(0, firstStep);
    const tail = firstStep === -1 ? [] : pool.slice(firstStep);

    if (sawHeading.ingredients) {
      noteLines = [...sections.intro, ...noteLines];
      ingLines = head;
      stepLines = tail;
    } else {
      for (const s of head) {
        if (s === null) { ingLines.push(null); continue; }
        (looksLikeIngredient(s) || ingLines.some(Boolean) ? ingLines : noteLines).push(s);
      }
      stepLines = tail;
    }
    if (sawHeading.steps) stepLines = [...stepLines, ...sections.steps];
  }

  out.ingredients = buildIngredients(ingLines);
  out.steps = buildSteps(stepLines);
  // Rejoin a description the scan split mid-sentence before tidying it.
  const noteParas = joinParagraphs(noteLines).reduce((acc, p) => {
    if (acc.length && !/[.!?)"”:]$/.test(acc[acc.length - 1]) && /^[a-z]/.test(p)) acc[acc.length - 1] = joinWrapped(acc[acc.length - 1], p);
    else acc.push(p);
    return acc;
  }, []);
  out.notes = noteParas.map(tidyNote).filter(Boolean).join('\n');
  for (const k of ['prepTime', 'cookTime', 'totalTime']) out[k] = out[k].replace(/(\d)(?=[a-z])/gi, '$1 ');
  out.issues = findIssues(out, extra);
  return out;
}

// ---------- section builders ----------

const DIGIT_LOOKALIKE = { S: '5', s: '5', O: '0', o: '0', l: '1', I: '1', i: '1', '|': '1', B: '8', Z: '2', z: '2', G: '6', g: '9', q: '9', A: '4', T: '7' };
function fixStepMarkers(lines) {
  const markerNum = s => { const m = s && s.match(/^step\s*(\d{1,2})\s*[.:)]?$/i); return m ? Number(m[1]) : null; };
  if (lines.filter(markerNum).length < 2) return lines;
  return lines.map((s, i) => {
    if (!s || markerNum(s) !== null) return s;
    const m = s.match(/^(step)\s*([0-9SsOolIi|BZzGgqAT]{1,3})\s*[.:)]?$/i);
    if (!m || /^\d+$/.test(m[2])) return s;
    // Readings to try for "5S": "55", "5"; for "S": "5"
    const mapped = [...m[2]].map(c => DIGIT_LOOKALIKE[c] ?? c).join('');
    const guesses = [...new Set([mapped, mapped.slice(0, 1), mapped.slice(0, 2), m[2].replace(/\D/g, '')])].map(Number).filter(Boolean);
    // Accept only a reading that fits the sequence around it.
    let prev = null, next = null;
    for (let j = i - 1; j >= 0 && prev === null; j--) prev = markerNum(lines[j]);
    for (let j = i + 1; j < lines.length && next === null; j++) next = markerNum(lines[j]);
    const fit = guesses.find(g => (prev !== null && g === prev + 1) || (next !== null && g === next - 1));
    return fit ? `STEP ${fit}` : s;
  });
}

function splitTwoColumn(s) {
  // "2 cups flour 1/2 tsp salt" -> two ingredients (common with two-column cards).
  const re = new RegExp(`\\s(?=${NUM}\\s*(?:${UNIT_WORDS.join('|')})\\.?\\s)`, 'gi');
  const parts = [];
  let last = 0, m;
  while ((m = re.exec(s))) {
    const left = s.slice(last, m.index).trim();
    const leftWords = left.replace(QTY_RE, '').replace(UNIT_RE, '').trim();
    if (/[a-z]{3,}/i.test(leftWords) && !/[(,]$/.test(left) && !/\b(?:or|and|plus|about|to)$/i.test(left)) {
      parts.push(left);
      last = m.index + 1;
    }
  }
  parts.push(s.slice(last).trim());
  return parts.filter(Boolean);
}

const STARTS_NUM = new RegExp(`^[\\d${FRAC}]`);
// "For the sauce:", "For serving: peanuts, green onion", "Sauce:", "FOR THE DRESSING"
const SUBHEAD = /^(?:for (?:the )?([a-z][a-z ]{1,28}?)|([A-Za-z][a-z]+(?: [a-z]+){0,2}))\s*:\s*(.*)$/i;
const SUBHEAD_BARE = /^(?:for (?:the )?[a-z][a-z ]{1,28}|[A-Z]{3,}(?: [A-Z]{3,}){0,2})$/i;
const HEADER_MARK = '# ';
const isHeader = s => typeof s === 'string' && s.startsWith(HEADER_MARK);

function subhead(line) {
  if (QTY_START.test(line) && !/^for\b/i.test(line)) return null;
  const m = line.match(SUBHEAD);
  if (m && (m[1] || /^(?:sauce|dressing|marinade|topping|toppings|filling|glaze|crust|garnish|to serve|for serving|batter|frosting|icing|rub|base|salad|dough)$/i.test(m[2] || ''))) {
    const label = line.slice(0, line.indexOf(':')).trim().toLowerCase();
    return { name: label.charAt(0).toUpperCase() + label.slice(1), rest: m[3].trim() };
  }
  if (SUBHEAD_BARE.test(line) && line.length < 32 && (/^for /i.test(line) || line === line.toUpperCase())) {
    const name = line.toLowerCase().replace(/^\w/, c => c.toUpperCase());
    return { name, rest: '' };
  }
  return null;
}

function splitList(text) {
  // Commas outside parentheses separate items: "peanuts, sliced green onion, chili oil"
  const parts = []; let depth = 0, cur = '';
  for (const ch of text) {
    if (ch === '(') depth++;
    if (ch === ')') depth = Math.max(0, depth - 1);
    if (ch === ',' && depth === 0) { parts.push(cur); cur = ''; } else cur += ch;
  }
  parts.push(cur);
  return parts.map(p => p.replace(/^\s*(?:and|&)\s+/i, '').trim()).filter(Boolean);
}

const CONTINUES = /[,(+&]$|\b(?:or|and|plus|about|to|of|with|if|for|into|in|approximately|approx\.?|roughly|around|each|total|such as)$/i;

function buildIngredients(lines) {
  const real = lines.filter(Boolean);
  const maxLen = Math.max(0, ...real.map(l => l.length));
  // Blank lines between most items (apps, cookbooks) tell us where each item ends.
  const paras = []; let cur = [];
  for (const s of lines) { if (s === null) { if (cur.length) paras.push(cur); cur = []; } else cur.push(s); }
  if (cur.length) paras.push(cur);
  const paragraphMode = paras.length >= 4 && paras.filter(p => p.length === 1).length >= paras.length * 0.4;

  const items = [];
  let inline = null; // an open "For serving: a, b," list still collecting lines
  const flushInline = () => { if (inline) { items.push(...splitList(inline)); inline = null; } };

  paras.forEach(para => {
    para.forEach((line, li) => {
      const head = subhead(line);
      if (head) {
        flushInline();
        items.push(HEADER_MARK + head.name.replace(/:$/, ''));
        if (head.rest) inline = head.rest;
        return;
      }
      if (inline !== null) {
        if (/^[a-z(]/.test(line) && !STARTS_NUM.test(line) && (CONTINUES.test(inline) || inline.length >= maxLen * 0.6)) {
          inline = joinWrapped(inline, line); return;
        }
        flushInline();
      }
      for (const part of splitTwoColumn(line)) {
        const prev = items.length && !isHeader(items[items.length - 1]) ? items[items.length - 1] : null;
        const lower = /^[a-z(]/.test(part) && !QTY_START.test(part);
        let join = false;
        if (prev) {
          if (paragraphMode && li > 0) join = CONTINUES.test(prev) || (lower && !STARTS_NUM.test(part));
          else if (CONTINUES.test(prev) && !/,$/.test(prev)) join = true;
          else join = lower && prev.length >= maxLen * 0.75; // a wrapped long line
        }
        if (join) items[items.length - 1] = joinWrapped(prev, part);
        else items.push(part);
      }
    });
  });
  flushInline();
  // Drop a header with nothing under it at the very end.
  while (items.length && isHeader(items[items.length - 1])) items.pop();
  return items.map(i => (isHeader(i) ? i : i.replace(/[;]$/, '').replace(/,$/, '').trim())).filter(i => i && i !== HEADER_MARK.trim());
}

function joinWrapped(a, b) {
  const frag = (a.match(/([a-z]+)-$/i) || [])[1];
  if (frag && /^[a-z]/.test(b)) return frag.length <= 3 ? a.slice(0, -1) + b : a + b;
  return `${a} ${b}`;
}

function joinParagraphs(lines) {
  const paras = [];
  let cur = '';
  for (const s of lines) {
    if (s === null) { if (cur) paras.push(cur); cur = ''; continue; }
    cur = cur ? joinWrapped(cur, s) : s;
  }
  if (cur) paras.push(cur);
  return paras;
}

let lastStepNumbers = [];
function buildSteps(lines) {
  const real = lines.filter(Boolean);
  lastStepNumbers = real.map(s => (s.match(STEP_ONLY) || s.match(NUMBER_MARKER) || [])).map(m => Number(m[1] || m[2])).filter(n => n > 0);
  const markerOnly = real.filter(s => STEP_ONLY.test(s)).length;
  const worded = real.filter(s => /^(?:step|stage)\s*\d/i.test(s) && STEP_ONLY.test(s)).length; // "STEP 4"
  const inline = real.filter(s => NUMBER_MARKER.test(s)).length;
  let steps = [];
  if (inline >= 2 && markerOnly < 2 && !worded) return numberedSteps(lines);
  if (markerOnly >= 2 || inline >= 2 || worded >= 1) {
    let open = false;
    for (const s of real) {
      if (STEP_ONLY.test(s)) { steps.push(''); open = true; continue; }
      if (NUMBER_MARKER.test(s) && markerOnly < 2 && !worded) { steps.push(s.replace(NUMBER_MARKER, '')); open = true; continue; }
      if (open && steps.length) steps[steps.length - 1] = steps[steps.length - 1] ? joinWrapped(steps[steps.length - 1], s) : s;
      else { steps.push(s); open = true; } // the end of a step from before this screenshot
    }
  } else {
    lastStepNumbers = [];
    steps = splitUnnumbered(lines);
    // One long paragraph: split into sentence groups of a readable size.
    if (steps.length === 1 && steps[0].length > 220) steps = sentenceChunks(steps[0]);
  }
  return steps.map(s => s.trim()).filter(s => s.length > 1);
}

// "1. Heat the oven… 2. Stir…": numbered steps. On a photographed page the numbers sit in a
// margin and the reader sometimes drops one ("Preheat the oven…" with no "3."). A paragraph
// that starts a new sentence is then a step whose number was lost, but only where the
// numbers around it leave room for it (2 … 5 has room for two), or after the last number.
function numberedSteps(lines) {
  const pieces = []; // { n, text, cand }
  let afterBreak = false;
  for (const s of lines) {
    if (s === null) { afterBreak = true; continue; }
    const m = s.match(NUMBER_MARKER);
    if (m) pieces.push({ n: Number(m[1]), text: s.replace(NUMBER_MARKER, ''), cand: false });
    else if (!pieces.length) pieces.push({ n: null, text: s, cand: false }); // the end of a step from an earlier page
    else {
      const last = pieces[pieces.length - 1];
      // A new paragraph starting a new sentence, after a finished step.
      const cand = afterBreak && /^[A-Z]/.test(s) && /[.!?)"”]\**$/.test(last.text) && (last.n !== null || last.cand);
      if (cand) pieces.push({ n: null, text: s, cand: true });
      else last.text = joinWrapped(last.text, s);
    }
    afterBreak = false;
  }
  // Decide which candidates really are steps: fill each numbering gap exactly. After the last
  // number there's no gap to measure, so trust paragraphs there only if no numbered step
  // elsewhere has a paragraph of its own (then paragraphs here just mean paragraphs).
  const runs = [];
  for (let i = 0; i < pieces.length; i++) {
    if (pieces[i].n === null) continue;
    let j = i + 1; const between = [];
    while (j < pieces.length && pieces[j].n === null) { if (pieces[j].cand) between.push(j); j++; }
    runs.push({ from: pieces[i].n, next: j < pieces.length ? pieces[j].n : null, between });
  }
  const paragraphsInSteps = runs.some(r => r.next !== null && r.next - r.from - 1 < r.between.length);
  const keep = new Set();
  for (const r of runs) {
    const room = r.next === null ? (paragraphsInSteps ? 0 : r.between.length) : r.next - r.from - 1;
    if (room > 0 && r.between.length === room) r.between.forEach(k => keep.add(k));
  }
  const steps = [];
  pieces.forEach((p, i) => {
    if (steps.length && p.cand && !keep.has(i)) steps[steps.length - 1] = joinWrapped(steps[steps.length - 1], p.text);
    else steps.push(p.text);
  });
  lastStepNumbers = [];
  let n = 0;
  for (const p of pieces) { if (p.n !== null) n = p.n; else if (keep.has(pieces.indexOf(p))) n += 1; else continue; lastStepNumbers.push(n); }
  return steps.map(t => t.trim().replace(/([.!?)"”])\*+$/, '$1')).filter(t => t.length > 1);
}

// Unnumbered steps: a new step starts after a blank line, or when the previous
// line ended a sentence and stopped short of the full text width.
function splitUnnumbered(lines) {
  const maxLen = Math.max(0, ...lines.filter(Boolean).map(l => l.length));
  const steps = [];
  let cur = '', prev = '';
  for (const s of lines) {
    // A paragraph break ends a step only once the sentence is finished.
    if (s === null) { if (cur && /[.!?)"”]$/.test(cur)) { steps.push(cur); cur = ''; prev = ''; } continue; }
    const breakHere = cur && /[.!)]$/.test(prev || cur) && /^[A-Z]/.test(s) &&
      (prev.length < maxLen * 0.8 || STEP_VERBS.test(s));
    if (breakHere) { steps.push(cur); cur = s; }
    else cur = cur ? joinWrapped(cur, s) : s;
    prev = s;
  }
  if (cur) steps.push(cur);
  return steps;
}

// Descriptions cut off by "Read more" or the screen edge: keep the complete sentences.
function tidyNote(p) {
  // "...and crunch w Read More": the text fades out before "Read more", so a short or
  // garbled last word ("w", "sa|", "t!") is a cut-off fragment; drop it.
  let t = p.trim();
  if (/\bread more\s*$/i.test(t)) {
    t = t.replace(/\s*read more\s*$/i, '');
    t = t.replace(/\s+(\S+)$/, (m, w) => (/^[A-Za-z]{3,}[,;:]?$/.test(w) ? m : '')).trim();
  }
  if (t && !/[.!?)"”]$/.test(t)) {
    const end = Math.max(t.lastIndexOf('. '), t.lastIndexOf('! '), t.lastIndexOf('? '));
    if (end > 20) t = t.slice(0, end + 1);
    else if (/^[a-z]/.test(t)) t = ''; // a fragment from the middle of a cut-off sentence
    else t = `${t.replace(/[,;:\s]+$/, '')}…`;
  }
  return t;
}

// Things the person should check or fill in before saving.
function findIssues(r, extra) {
  const issues = [];
  if (!r.title) issues.push({ field: 'title', message: 'No recipe name was found. Give it a name.' });
  const realIngredients = r.ingredients.filter(i => !isHeader(i));
  if (!realIngredients.length) issues.push({ field: 'ingredients', message: 'No ingredients were found. Add them, or scan the part of the recipe that lists them.' });
  r.ingredients.forEach((ing, i) => {
    if (!isHeader(ing) && /(?:\b(?:or|and|plus|with|of)|[,(+])$/i.test(ing)) issues.push({ field: 'ingredients', index: i, message: `“${ing}” looks cut off.` });
  });
  if (!r.steps.length) issues.push({ field: 'steps', message: 'No steps were found. Add them, or scan the part of the recipe with the method.' });
  const nums = [...new Set(lastStepNumbers)].sort((a, b) => a - b);
  if (nums.length) {
    const missing = [];
    for (let n = 1; n < nums[nums.length - 1]; n++) if (!nums.includes(n)) missing.push(n);
    if (missing.length) issues.push({ field: 'steps', message: `Step${missing.length > 1 ? 's' : ''} ${missing.join(', ')} ${missing.length > 1 ? 'are' : 'is'} missing. Add ${missing.length > 1 ? 'them' : 'it'}, or scan that part of the recipe.` });
  }
  if (r.steps.length) {
    const last = r.steps[r.steps.length - 1];
    if (!/[.!?)"”]$/.test(last)) issues.push({ field: 'steps', index: r.steps.length - 1, message: `Step ${r.steps.length} looks cut off. Finish it, and add any steps after it.` });
  }
  if (extra.gaps) issues.push({ field: 'steps', message: 'Part of the recipe may be missing between two of your photos. Check where they meet.' });
  return issues;
}

function sentenceChunks(text) {
  const sentences = text.match(/[^.!?]+(?:[.!?]+(?=\s|$)|$)/g) || [text];
  const chunks = [];
  let cur = '';
  for (const sent of sentences.map(s => s.trim()).filter(Boolean)) {
    cur = cur ? `${cur} ${sent}` : sent;
    if (cur.length >= 70) { chunks.push(cur); cur = ''; }
  }
  if (cur) {
    if (chunks.length && cur.length < 40) chunks[chunks.length - 1] += ` ${cur}`;
    else chunks.push(cur);
  }
  return chunks;
}

// ---------- quantities & scaling ----------

function toNumber(s) {
  s = s.replace(/\s+/g, ' ').trim().replace(',', '.');
  let m;
  if ((m = s.match(/^(\d+) (\d+)\/(\d+)$/))) return +m[1] + m[2] / m[3];
  if ((m = s.match(/^(\d+)\/(\d+)$/))) return m[1] / m[2];
  if ((m = s.match(new RegExp(`^(\\d+(?:\\.\\d+)?)\\s*([${FRAC}])$`)))) return +m[1] + FRACTIONS[m[2]];
  if (FRACTIONS[s] != null) return FRACTIONS[s];
  return parseFloat(s);
}

const NICE = [[0, ''], [1 / 8, '⅛'], [1 / 4, '¼'], [1 / 3, '⅓'], [3 / 8, '⅜'], [1 / 2, '½'],
  [5 / 8, '⅝'], [2 / 3, '⅔'], [3 / 4, '¾'], [7 / 8, '⅞'], [1, '']];

function formatQuantity(n) {
  if (!isFinite(n) || n <= 0) return '';
  if (n >= 20) return String(Math.round(n));
  let whole = Math.floor(n);
  const frac = n - whole;
  let best = NICE[0], diff = Infinity;
  for (const pair of NICE) {
    const d = Math.abs(pair[0] - frac);
    if (d < diff) { diff = d; best = pair; }
  }
  if (diff > 0.04) return String(Math.round(n * 100) / 100);
  if (best[0] === 1) { whole += 1; return String(whole); }
  if (!best[1]) return String(whole);
  return whole ? `${whole}${best[1]}` : best[1];
}

// ---------- amounts: parsing, scaling, unit conversion ----------

// Unit words -> canonical unit, with singular/plural display forms.
const UNITS = [
  ['tsp', /^(?:teaspoons?|tsps?\.?|t\.)$/i, 'tsp', 'tsp'],
  ['tbsp', /^(?:tablespoons?|tbsps?\.?|tbs\.?|tbl\.?|T\.?)$/, 'tbsp', 'tbsp'],
  ['cup', /^(?:cups?|c\.)$/i, 'cup', 'cups'],
  ['floz', /^(?:fl\.?\s?oz\.?|fluid ounces?)$/i, 'fl oz', 'fl oz'],
  ['pint', /^(?:pints?|pts?\.?)$/i, 'pint', 'pints'],
  ['quart', /^(?:quarts?|qts?\.?)$/i, 'quart', 'quarts'],
  ['ml', /^(?:ml|milliliters?|millilitres?)$/i, 'ml', 'ml'],
  ['l', /^(?:l|liters?|litres?)$/i, 'l', 'l'],
  ['oz', /^(?:ounces?|oz\.?)$/i, 'oz', 'oz'],
  ['lb', /^(?:pounds?|lbs?\.?)$/i, 'lb', 'lb'],
  ['g', /^(?:g|grams?)$/i, 'g', 'g'],
  ['kg', /^(?:kg|kilograms?|kilos?)$/i, 'kg', 'kg'],
];
const UNIT_WORD = String.raw`fl\.?\s?oz\.?|fluid ounces?|teaspoons?|tsps?\.?|tablespoons?|tbsps?\.?|tbs\.?|tbl\.?|cups?|pints?|pts?\.?|quarts?|qts?\.?|milliliters?|millilitres?|ml|liters?|litres?|ounces?|oz\.?|pounds?|lbs?\.?|grams?|kilograms?|kg|g|l|c\.|T\.?|t\.`;
const canonUnit = word => (UNITS.find(([, re]) => re.test(word.trim())) || [null])[0];

const ML = { tsp: 4.929, tbsp: 14.787, cup: 236.59, floz: 29.574, pint: 473.18, quart: 946.35, ml: 1, l: 1000 };
const G = { oz: 28.35, lb: 453.59, g: 1, kg: 1000 };
// What tapping an amount cycles through, starting from its own unit.
const CYCLE = {
  tsp: ['tsp', 'ml'], tbsp: ['tbsp', 'tsp', 'ml'], cup: ['cup', 'floz', 'ml'], floz: ['floz', 'cup', 'ml'],
  pint: ['pint', 'cup', 'ml'], quart: ['quart', 'cup', 'l'], ml: ['ml', 'us'], l: ['l', 'cup'],
  oz: ['oz', 'g'], lb: ['lb', 'oz', 'g'], g: ['g', 'oz'], kg: ['kg', 'lb'],
};

const AMOUNT = new RegExp(`^(${NUM})(?:\\s*(?:-|–|to)\\s*(${NUM}))?(?:\\s*(${UNIT_WORD}))?(?=[\\s,/()]|$)`, 'i');
const ALT = new RegExp(`^\\s*(?:\\/\\s*|\\(\\s*)(${NUM})\\s*(${UNIT_WORD})\\s*\\)?`, 'i');

/** "4 cups/32 ounces broth" -> { a: 4, unit: 'cup', alt: { a: 32, unit: 'oz' }, rest: ' broth' } */
function parseAmount(text) {
  const m = text.match(AMOUNT);
  if (!m) return null;
  const a = toNumber(m[1]);
  if (!isFinite(a)) return null;
  const b = m[2] ? toNumber(m[2]) : null;
  const unitWord = m[3] ? m[3].trim() : '';
  let rest = text.slice(m[0].length), alt = null, altParen = false;
  if (unitWord) {
    const x = rest.match(ALT);
    if (x && canonUnit(x[2]) && (!x[0].includes('(') || x[0].includes(')'))) {
      alt = { a: toNumber(x[1]), unit: canonUnit(x[2]), word: x[2] };
      altParen = x[0].includes('(');
      rest = rest.slice(x[0].length);
    }
  }
  return { a, b, unitWord, unit: unitWord ? canonUnit(unitWord) : null, alt, altParen, rest };
}

function fmtMetric(v, unit) {
  if (unit === 'l' || unit === 'kg') return String(Math.round(v * 100) / 100);
  if (v >= 50) return String(Math.round(v / 5) * 5);
  if (v >= 10) return String(Math.round(v));
  return String(Math.round(v * 2) / 2);
}
function fmtUnit(unit, v) {
  const u = UNITS.find(x => x[0] === unit);
  return v > 1 ? u[3] : u[2];
}
// Converted US amounts round to what a cook would measure: eighths, then halves, then wholes.
function kitchenRound(v) {
  if (v >= 20) return Math.round(v);
  if (v >= 10) return Math.round(v * 2) / 2;
  const third = Math.round(v * 3) / 3;
  return Math.abs(third - v) < 0.03 ? third : Math.round(v * 8) / 8;
}
function fmtAmount(a, b, unit, converted = false) {
  const metric = ['ml', 'l', 'g', 'kg'].includes(unit);
  const f = v => (metric ? fmtMetric(v, unit) : formatQuantity(converted ? kitchenRound(v) : v));
  let out = f(a);
  if (b != null) out += `–${f(b)}`;
  return `${out} ${fmtUnit(unit, b != null ? b : a)}`;
}
// Bigger units once the number gets large.
function settle(v, unit) {
  if (unit === 'ml' && v >= 1000) return [v / 1000, 'l'];
  if (unit === 'g' && v >= 1000) return [v / 1000, 'kg'];
  return [v, unit];
}
function convertValue(v, from, to) {
  if (to === 'us') { // pick a sensible US measure for millilitres
    const ml = v * ML[from];
    to = ml < 14 ? 'tsp' : ml < 59 ? 'tbsp' : 'cup';
    return [ml / ML[to], to];
  }
  if (ML[from] && ML[to]) return [v * ML[from] / ML[to], to];
  if (G[from] && G[to]) return [v * G[from] / G[to], to];
  return [v, from];
}

/** How many unit views an ingredient can cycle through (1 = not convertible). */
function unitViews(text) {
  if (isHeader(text)) return 1;
  const p = parseAmount(text);
  return p && p.unit ? CYCLE[p.unit].length : 1;
}

function scaleIngredient(text, factor) {
  if (factor === 1 || isHeader(text)) return text;
  const p = parseAmount(text);
  if (!p) return text;
  let out = formatQuantity(p.a * factor);
  if (p.b != null) out += `–${formatQuantity(p.b * factor)}`;
  if (p.unitWord) out += ` ${p.unitWord}`;
  if (p.alt) {
    const alt = `${formatQuantity(p.alt.a * factor)} ${p.alt.word}`;
    out += p.altParen ? ` (${alt})` : `/${alt}`;
  }
  return out + (p.rest && !/^[\s,]/.test(p.rest) ? ' ' : '') + p.rest;
}

// Short forms keep the quantity column narrow: "3 tablespoons" shows as "3 tbsp".
const SHORT_UNITS = [[/^tablespoons?$|^tbsps?\.?$|^tbl$|^tbs$/i, 'tbsp'], [/^teaspoons?$|^tsps?\.?$/i, 'tsp'],
  [/^ounces?$/i, 'oz'], [/^pounds?$|^lbs?\.?$/i, 'lb'], [/^grams?$/i, 'g'], [/^kilograms?$/i, 'kg'],
  [/^milliliters?$/i, 'ml'], [/^liters?$|^litres?$/i, 'l'], [/^packages?$|^pkgs?\.?$/i, 'pkg'], [/^quarts?$/i, 'qt'], [/^pints?$/i, 'pt']];
function shortUnit(u) {
  for (const [re, short] of SHORT_UNITS) if (re.test(u)) return short;
  return u;
}
const DISPLAY_UNITS = new RegExp(`^\\s*(?:${UNIT_WORDS.filter(u => !/^eggs/.test(u)).join('|')})\\.?(?=[\\s/]|$)`, 'i');

/**
 * Split an ingredient for display, scaled and optionally converted:
 * { qty: "4 cups", alt: "32 oz", item: "chicken broth", convertible: true }
 * view 0 shows the recipe's own units; 1, 2… cycle through conversions.
 */
function displayIngredient(text, factor = 1, view = 0) {
  if (isHeader(text)) return { qty: '', alt: '', item: text.slice(HEADER_MARK.length), header: true };
  const p = parseAmount(text);
  if (!p) return { qty: '', alt: '', item: text };
  const a = p.a * factor, b = p.b != null ? p.b * factor : null;

  if (p.unit) { // a real unit: can be converted
    const cycle = CYCLE[p.unit];
    const target = cycle[view % cycle.length];
    let qty, alt = '';
    if (view % cycle.length === 0) {
      qty = fmtAmount(a, b, p.unit);
      if (p.alt) alt = fmtAmount(p.alt.a * factor, null, p.alt.unit);
    } else {
      let [ca, unit] = convertValue(a, p.unit, target);
      const cb = b != null ? convertValue(b, p.unit, target)[0] : null;
      if (cb == null) [ca, unit] = settle(ca, unit);
      qty = fmtAmount(ca, cb, unit, true);
    }
    return { qty, alt, item: p.rest.replace(/^[\s,]+/, '').trim(), convertible: true };
  }

  // A count: "3 garlic cloves", "2 bricks", "1 inch knob…", "3 large"
  let qty = formatQuantity(a);
  if (b != null) qty += `–${formatQuantity(b)}`;
  let rest = p.rest;
  const u = rest.match(DISPLAY_UNITS) || rest.match(/^\s*(?:inch(?:es)?|bricks?|knobs?)(?=\s|$)/i);
  let alt = '';
  if (u) {
    let word = shortUnit(u[0].trim());
    if ((b ?? a) > 1 && /^(?:can|jar|package|pkg|bag|box|stick|slice|piece|bunch|head|bottle|envelope|handful|brick|knob|sprig|stalk|clove)$/i.test(word)) word += /(?:ch|sh|x)$/i.test(word) ? 'es' : 's';
    qty += ` ${word}`; rest = rest.slice(u[0].length);
    // "1 can (14 oz)": the size of each can, shown underneath and not scaled
    const size = rest.match(new RegExp(`^\\s*\\(\\s*(${NUM})\\s*(${UNIT_WORD})\\s*\\)`, 'i'));
    if (size && canonUnit(size[2])) { alt = `${fmtAmount(toNumber(size[1]), null, canonUnit(size[2]))} each`; rest = rest.slice(size[0].length); }
  } else {
    const c = rest.match(/^\s*((?:[a-z-]+\s+){1,2}?)(cloves?|stalks?|sprigs?)\b(.*)$/i);
    if (c) { qty += ` ${c[2]}`; rest = `${c[1].trim()}${c[3]}`; }
  }
  return { qty, alt, item: rest.trim() };
}

function aisleFor(text) {
  if (isHeader(text)) return 'Other';
  const t = text.toLowerCase().replace(QTY_RE, '');
  for (const [aisle, re] of AISLE_RULES) if (re.test(t)) return aisle;
  if (/\b(?:tsp|teaspoons?)\b/.test(t)) return 'Spices';
  return 'Other';
}

// Name without the leading quantity, used for sorting.
function ingredientName(text) {
  return text.replace(QTY_RE, '').replace(UNIT_RE, '').replace(/^[\s.,of]+/i, '').trim().toLowerCase();
}
