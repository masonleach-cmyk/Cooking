  ['Drinks', /\b(?:smoothie|cocktail|lemonade|latte|punch|margarita|sangria|spritz|mocktail|milkshake|iced tea|hot chocolate)\b/i],
  ['Soups & salads', /\b(?:soup|stew|chowder|bisque|gazpacho|salad|slaw|pho|ramen soup|chili)\b/i],
  ['Appetizers', /\b(?:dip|salsa|guacamole|bruschetta|crostini|appetizers?|hummus|deviled eggs|sliders|nachos|wings|meatballs)\b/i],
  ['Sides', /\b(?:side|roasted (?:vegetables|potatoes|carrots|broccoli)|mashed potatoes|pilaf|green beans|coleslaw|cornbread|fries|risotto)\b/i],
  ['Mains', /\b(?:chicken|beef|pork|lamb|turkey|salmon|shrimp|fish|tofu|steak|pasta|noodles|ramen|spaghetti|lasagna|tacos?|burritos?|curry|stir[- ]fry|casserole|enchiladas|burgers?|risotto|gnocchi|dinner|skillet|one pot|sheet pan)\b/i],
];

/** Best-guess section from the title (strong signal), then ingredients and steps. */
function guessCategory(r) {
  const title = r.title || '';
  for (const [cat, re] of CATEGORY_RULES) if (re.test(title)) return cat;
  const body = [...(r.ingredients || []).filter(i => !isHeader(i)), ...(r.steps || []).slice(0, 2)].join(' ');
  const scores = CATEGORY_RULES.map(([cat, re]) => [cat, (body.match(new RegExp(re.source, 'gi')) || []).length]);
  const mains = scores.find(([c]) => c === 'Mains')[1];
  const best = scores.filter(([c]) => c !== 'Mains').sort((a, b) => b[1] - a[1])[0];
  if (best && best[1] >= 3 && best[1] > mains) return best[0];
  return mains ? 'Mains' : '';
}

// ---------- diet tags ----------
// Each tag is '' (not marked), 'optional' (can be made that way), or 'yes'.

const DAIRY = /\b(?:butter|buttermilk|milk|cream|cheeses?|cheddar|parmesan|parmigiano|pecorino|mozzarella|feta|cotija|ricotta|yogh?urt|ghee|half[- ]and[- ]half|cr[eè]me fra[iî]che|mascarpone|gruy[eè]re|brie|paneer|whey|custard|pesto|alfredo|queso|burrata|halloumi)\b/i;
const DAIRY_OK = /\b(?:coconut|almond|oat|soy|cashew|rice|peanut|nut|apple|cocoa|vegan|plant[- ]based|dairy[- ]free|non[- ]dairy|cream of tartar|sunflower|sesame|seed)\b/i;
const GLUTEN = /\b(?:flour|breads?|breadcrumbs|bread crumbs|panko|pasta|spaghetti|linguine|penne|fettuccine|macaroni|noodles|ramen|udon|soba|couscous|barley|bulgur|farro|semolina|tortillas?|pita|crackers|croutons|soy sauce|beer|wheat|rye|seitan|orzo|gnocchi|dumplings?|wontons?|pie crust|puff pastry|biscuits?|cake mix|graham|brioche|bagels?|buns|rolls)\b/i;
const GLUTEN_OK = /\b(?:gluten[- ]free|gf|almond flour|coconut flour|rice flour|tapioca|cassava|corn tortillas?|rice noodles|glass noodles|rice paper|arrowroot|cornstarch|chickpea flour|buckwheat|potato starch|tamari|coconut aminos|quinoa)\b/i;

function dietStatus(ingredients, bad, ok) {
  let anyHit = false, allSwappable = true;
  for (const ing of ingredients) {
    if (isHeader(ing)) continue;
    // "X or Y": each side is a choice. "store-bought or homemade pesto" is one choice described two ways.
    const segs = ing.split(/\s+or\s+/i);
    const isBad = seg => bad.test(seg) && !ok.test(seg);
    if (!segs.some(isBad)) continue;
    anyHit = true;
    const realChoice = seg => {
      const p = parseAmount(seg);
      const words = (p ? p.rest : seg).replace(/\(.*?\)/g, '').trim().split(/\s+/).filter(Boolean);
      return ok.test(seg) || words.length >= 2;
    };
    const swappable = /\boptional\b/i.test(ing) || segs.some(seg => !isBad(seg) && realChoice(seg));
    if (!swappable) allSwappable = false;
  }
  if (!anyHit) return 'yes';
  return allSwappable ? 'optional' : '';
}

/** Suggested tags from the ingredients, for the person to confirm. */
function suggestDiet(r) {
  const ings = r.ingredients || [];
  if (!ings.filter(i => !isHeader(i)).length) return { gf: '', df: '' };
  const text = [r.title, r.notes].join(' ');
  return {
    gf: /\bgluten[- ]free\b/i.test(text) ? 'yes' : dietStatus(ings, GLUTEN, GLUTEN_OK),
    df: /\bdairy[- ]free\b/i.test(text) ? 'yes' : dietStatus(ings, DAIRY, DAIRY_OK),
  };
}

// ================================================================
// Website import: recipe data a web page carries for search engines
// ================================================================

// Recipe sites (NYT Cooking included) describe each recipe in a block of schema.org data
// for search engines. The "Copy Recipe" shortcut copies that block (or the whole
// page) to the clipboard; this turns it into a recipe. Pure, so it can be tested anywhere.

const WEB_SITES = { 'cooking.nytimes.com': 'NYT Cooking', 'nytimes.com': 'The New York Times', 'seriouseats.com': 'Serious Eats',
  'bonappetit.com': 'Bon Appétit', 'epicurious.com': 'Epicurious', 'allrecipes.com': 'Allrecipes', 'foodnetwork.com': 'Food Network',
  'smittenkitchen.com': 'Smitten Kitchen', 'budgetbytes.com': 'Budget Bytes', 'food52.com': 'Food52', 'thekitchn.com': 'The Kitchn' };

function decodeEntities(t) {
  const named = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'", nbsp: ' ', ndash: '–', mdash: '—', hellip: '…', rsquo: '’', lsquo: '‘',
    rdquo: '”', ldquo: '“', deg: '°', frac12: '½', frac14: '¼', frac34: '¾', eacute: 'é', egrave: 'è', ntilde: 'ñ', uuml: 'ü', ouml: 'ö', auml: 'ä', ccedil: 'ç', times: '×' };
  return String(t).replace(/&(#x[0-9a-f]+|#\d+|[a-z]+\d*);/gi, (m, e) => {
    if (e[0] === '#') { const n = e[1] === 'x' || e[1] === 'X' ? parseInt(e.slice(2), 16) : Number(e.slice(1)); return n ? String.fromCodePoint(n) : m; }
    return named[e.toLowerCase()] ?? m;
  });
}
// Text from the page: drop tags, decode entities, tidy spaces.
const webText = t => decodeEntities(decodeEntities(String(t ?? '').replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]+>/g, ''))).replace(/\s+/g, ' ').trim();

// "PT1H20M" -> "1 hr 20 min"
function isoDuration(d) {
  const m = String(d || '').match(/^P(?:(\d+)D)?(?:T(?:(\d+(?:\.\d+)?)H)?(?:(\d+(?:\.\d+)?)M)?(?:\d+(?:\.\d+)?S)?)?$/i);
  if (!m) return '';
  let h = Number(m[2] || 0) + Number(m[1] || 0) * 24, min = Math.round(Number(m[3] || 0));
  h += Math.floor(min / 60); min %= 60;
  return [h ? `${h} hr` : '', min ? `${min} min` : ''].filter(Boolean).join(' ');
}

function findRecipeNode(node, depth = 0) {
  if (!node || depth > 8) return null;
  if (Array.isArray(node)) { for (const n of node) { const r = findRecipeNode(n, depth + 1); if (r) return r; } return null; }
  if (typeof node !== 'object') return null;
  const type = [].concat(node['@type'] || []).map(String);
  if (type.some(t => /(^|\/)Recipe$/i.test(t))) return node;
  for (const key of ['@graph', 'mainEntity', 'mainEntityOfPage', 'itemListElement', 'item']) {
    const r = findRecipeNode(node[key], depth + 1); if (r) return r;
  }
  return null;
}

function webSteps(ins) {
  const out = [];
  const walk = (n, depth = 0) => {
    if (!n || depth > 6) return;
    if (Array.isArray(n)) return n.forEach(x => walk(x, depth + 1));
    if (typeof n === 'string') {
      // One block of text: split on line breaks, then numbered lines.
      const t = n.replace(/<\/(?:p|li)>|<br\s*\/?>/gi, '\n');
      for (const part of t.split(/\n+/)) { const s = webText(part).replace(/^(?:step\s*)?\d{1,2}[.)]\s+/i, ''); if (s) out.push(s); }
      return;
    }
    const type = [].concat(n['@type'] || []).join(' ');
    if (/HowToSection/i.test(type) || (n.itemListElement && !n.text)) return walk(n.itemListElement, depth + 1);
    const s = webText(n.text || n.name || n.description || '');
    if (s) out.push(s);
  };
  walk(ins);
  return out;
}

function webAuthor(a) {
  const names = [].concat(a || []).map(x => webText(typeof x === 'string' ? x : x && x.name)).filter(Boolean);
  return [...new Set(names)].join(' and ');
}

function webYield(y) {
  const all = [].concat(y || []).map(v => webText(v)).filter(Boolean);
  const pick = all.find(v => /[a-z]/i.test(v) && /\d/.test(v)) || all[0] || '';
  const serv = pick.match(/^(?:serves\s+|makes\s+)?(\d+(?:\s*(?:-|–|to)\s*\d+)?)(?:\s+(?:servings?|people|portions?))?$/i);
  if (serv) return serv[1].replace(/\s*[-–]\s*/, ' to ');
  return pick && /^\d/.test(pick) ? `Makes ${pick}` : pick;
}

function webImage(img) {
  const first = [].concat(img || [])[0];
  const url = typeof first === 'string' ? first : first && (first.url || first.contentUrl);
  return /^https:\/\//.test(url || '') ? url : '';
}

function siteName(url, fallback = '') {
  let host = '';
  try { host = new URL(url).hostname.replace(/^www\./, ''); } catch { return fallback; }
  return WEB_SITES[host] || fallback || host;
}

// Parse JSON-LD text that may be wrapped in comments or CDATA, or several blocks run together.
function parseLd(text) {
  const t = String(text).trim().replace(/^<!--|-->$/g, '').replace(/^\s*\/\/\s*<!\[CDATA\[|\/\/\s*\]\]>\s*$/g, '').trim();
  try { return JSON.parse(t); } catch { /* try stripping control characters */ }
  try { return JSON.parse(t.replace(/[\u0000-\u001f]+/g, ' ')); } catch { return null; }
}

/**
 * Turn what the shortcut copied into a recipe, or null if there's no recipe in it.
 * Accepts the shortcut's payload ({"recipeBox":1,"url":…,"ld":[…]}), a whole web page's
 * HTML, the page's script blocks, or bare JSON-LD.
 */
function recipeFromWebText(input) {
  const text = String(input || '').trim();
  if (!text) return null;
  let url = '', site = '', blocks = [];
  const payload = text.startsWith('{') ? parseLd(text) : null;
  if (payload && payload.recipeBox) {
    url = payload.url || ''; site = payload.site || '';
    blocks = [].concat(payload.ld || []).map(parseLd);
  } else {
    for (const m of text.matchAll(/<script[^>]*application\/ld\+json[^>]*>([\s\S]*?)<\/script>/gi)) blocks.push(parseLd(m[1]));
    if (!blocks.length) blocks.push(parseLd(text));
    const meta = (prop) => (text.match(new RegExp(`<meta[^>]+(?:property|name)=["']${prop}["'][^>]*content=["']([^"']+)`, 'i'))
      || text.match(new RegExp(`<meta[^>]+content=["']([^"']+)["'][^>]*(?:property|name)=["']${prop}["']`, 'i')) || [])[1];
    url = meta('og:url') || (text.match(/<link[^>]+rel=["']canonical["'][^>]*href=["']([^"']+)/i) || [])[1] || '';
    site = meta('og:site_name') || '';
  }
  const node = findRecipeNode(blocks.filter(Boolean));
  if (!node) return null;
  const title = webText(node.name || node.headline);
  const ingredients = [].concat(node.recipeIngredient || node.ingredients || []).map(webText).filter(Boolean);
  const steps = webSteps(node.recipeInstructions);
  if (!title || (!ingredients.length && !steps.length)) return null;
  url = webText(node.url || (typeof node.mainEntityOfPage === 'string' ? node.mainEntityOfPage : node.mainEntityOfPage && node.mainEntityOfPage['@id']) || url);
  if (!/^https?:\/\//.test(url)) url = '';
  const author = webAuthor(node.author);
  const name = siteName(url, webText(site));
  return {
    title: titleCase(title),
    servings: webYield(node.recipeYield),
    prepTime: isoDuration(node.prepTime),
    cookTime: isoDuration(node.cookTime),
    totalTime: isoDuration(node.totalTime),
    source: author || name,
    sourceUrl: url,
    sourceSite: name,
    ingredients,
    steps,
    image: webImage(node.image),
  };
}

// The same recipe page with or without tracking bits ("?smid=ck-recipe-iOS-share").
function sameRecipeUrl(a, b) {
  const k = u => { try { const x = new URL(u); return (x.hostname.replace(/^www\./, '') + x.pathname.replace(/\/$/, '')).toLowerCase(); } catch { return ''; } };
  return !!a && !!b && k(a) === k(b);
}

// ================================================================
// Scan clean-up: fraction repair, screenshot clutter, overlapping pages
// ================================================================

// Turns raw OCR results from one or more photos/screenshots into clean recipe text.
// Pure functions (no DOM), so they can be tested outside the browser.

// ---------- 1. Fraction repair ----------
// OCR engines misread single-glyph fractions (½ -> "Y%", ¼ -> "Y4", 2¼ -> "2%").
// We find those tokens, split the glyph into numerator / slash / denominator
// by connected components, and read the two small digits on their own.

const GLYPH = {
  '1/2': '½', '1/3': '⅓', '2/3': '⅔', '1/4': '¼', '3/4': '¾', '1/5': '⅕', '2/5': '⅖',
  '3/5': '⅗', '4/5': '⅘', '1/6': '⅙', '5/6': '⅚', '1/8': '⅛', '3/8': '⅜', '5/8': '⅝', '7/8': '⅞',
};

function isSuspectToken(t) {
  if (!t) return false;
  const head = t.replace(/-[a-z]{2,}$/i, ''); // "%-inch": judge the part before the hyphen
  if (head.length > 6 || /[A-Za-z]{3}/.test(head)) return false;
  // Plain 1-2 digit numbers are checked too: a stacked "¼" is sometimes read as "4".
  return /^[([]?\d*(?:[%¥Y¢£€§]|V[a-z2-4]|\/\d)[%¥Y¢£€§\w']*[)\],.;]?$/.test(head) || /^[([]?\d{1,2}$/.test(head);
}

function components(ink, w, h) {
  const seen = new Uint8Array(w * h);
  const comps = [];
  const stack = [];
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const start = y * w + x;
      if (!ink[start] || seen[start]) continue;
      seen[start] = 1; stack.push(start);
      const c = { x0: x, x1: x, y0: y, y1: y, n: 0, pts: [] };
      while (stack.length) {
        const p = stack.pop();
        const py = (p / w) | 0, px = p - py * w;
        c.n++; c.pts.push(px, py);
        if (px < c.x0) c.x0 = px; if (px > c.x1) c.x1 = px;
        if (py < c.y0) c.y0 = py; if (py > c.y1) c.y1 = py;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          const nx = px + dx, ny = py + dy;
          if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
          const q = ny * w + nx;
          if (ink[q] && !seen[q]) { seen[q] = 1; stack.push(q); }
        }
      }
      if (c.n > 4) comps.push(c);
    }
  }
  return comps;
}

function isSlash(c, H) {
  const ch = c.y1 - c.y0 + 1, cw = c.x1 - c.x0 + 1;
  if (ch < 0.6 * H || cw < 0.25 * ch || cw > 0.9 * ch) return false;
  let topSum = 0, topN = 0, botSum = 0, botN = 0;
  for (let i = 0; i < c.pts.length; i += 2) {
    const x = c.pts[i], y = c.pts[i + 1];
    if (y < c.y0 + ch * 0.2) { topSum += x; topN++; }
    else if (y > c.y1 - ch * 0.2) { botSum += x; botN++; }
  }
  return topN && botN && (topSum / topN - botSum / botN) > 0.35 * cw;
}

/**
 * Look for a stacked-fraction glyph inside bbox of a grayscale image.
 * Returns the numerator and denominator as { box, pts } in image coordinates, or null.
 */
function findFractionGlyph(gray, W, H, bbox) {
  const x0 = Math.max(0, bbox.x0 - 2), y0 = Math.max(0, bbox.y0 - 2);
  const x1 = Math.min(W - 1, bbox.x1 + 2), y1 = Math.min(H - 1, bbox.y1 + 2);
  const w = x1 - x0 + 1, h = y1 - y0 + 1;
  if (w < 6 || h < 6 || w * h > 40000) return null;
  const ink = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) ink[y * w + x] = gray[(y + y0) * W + (x + x0)] < 140 ? 1 : 0;
  const comps = components(ink, w, h);
  if (comps.length < 3) return null;
  const top = Math.min(...comps.map(c => c.y0)), bottom = Math.max(...comps.map(c => c.y1));
  const Hc = bottom - top + 1;
  const slashes = comps.filter(c => isSlash(c, Hc));
  if (slashes.length !== 1) return null;
  const s = slashes[0];
  const mid = (s.y0 + s.y1) / 2, sx = (s.x0 + s.x1) / 2;
  const others = comps.filter(c => c !== s);
  const tall = others.filter(c => (c.y1 - c.y0 + 1) >= 0.7 * Hc && c.x1 < s.x0);
  const small = others.filter(c => !tall.includes(c));
  const num = small.filter(c => (c.y0 + c.y1) / 2 < mid && (c.x0 + c.x1) / 2 < sx + 2);
  const den = small.filter(c => (c.y0 + c.y1) / 2 > mid && (c.x0 + c.x1) / 2 > sx - 2);
  if (!num.length || !den.length) return null;
  // Each part carries only its own ink pixels, so a neighbouring slash can't leak in.
  const part = cs => {
    const pts = [];
    for (const c of cs) for (let i = 0; i < c.pts.length; i += 2) pts.push(x0 + c.pts[i], y0 + c.pts[i + 1]);
    return {
      x0: x0 + Math.min(...cs.map(c => c.x0)), y0: y0 + Math.min(...cs.map(c => c.y0)),
      x1: x0 + Math.max(...cs.map(c => c.x1)) + 1, y1: y0 + Math.max(...cs.map(c => c.y1)) + 1, pts,
    };
  };
  return { num: part(num), den: part(den), tallCount: tall.length };
}

/**
 * Repair fraction tokens in OCR words, in place.
 * readDigit(part) -> Promise<string> reads one digit drawn from part.pts (x, y pairs).
 */
async function repairFractions(words, gray, W, H, readDigit) {
  for (const word of words) {
    if (!isSuspectToken(word.text)) continue;
    let box = word.bbox;
    const suffix = (word.text.match(/-[a-z]{2,}$/i) || [''])[0];
    if (suffix) { // only look at the glyph before "-inch"
      const h = box.y1 - box.y0, headLen = word.text.length - suffix.length;
      box = { ...box, x1: Math.min(box.x1, box.x0 + Math.round(h * 1.25 * headLen)) };
    }
    const g = findFractionGlyph(gray, W, H, box);
    if (!g) continue;
    const n = await readDigit(g.num), d = await readDigit(g.den);
    if (!/^[1-9]$/.test(n) || !/^[1-9]$/.test(d) || Number(n) >= Number(d)) continue;
    const t = word.text.slice(0, word.text.length - suffix.length);
    const open = /^[([]/.test(t) ? t[0] : '';
    const close = (t.match(/[)\],.;]$/) || [''])[0] + suffix;
    const lead = /^[([]?\d{1,2}$/.test(t) ? null : t.slice(open.length).match(/^\d+/); // a lone "4" was the fraction itself
    const tallNeeded = open ? 2 : 1; // an opening paren is also a tall shape
    const whole = lead && g.tallCount >= tallNeeded ? lead[0] : '';
    const frac = GLYPH[`${n}/${d}`] || `${whole ? ' ' : ''}${n}/${d}`;
    word.text = `${open}${whole}${frac}${close}`;
  }
}

// ---------- 2. OCR result -> page of lines ----------

// A phone screenshot (tall and narrow), as opposed to a photo of a page.
const isScreenshot = (w, h) => h / w > 1.9;
const STATUS_BAR_BOTTOM = 0.055; // fraction of a screenshot's height taken by the status bar

/** Walk tesseract.js blocks (or a flat paragraphs list) into lines with layout info. */
const WEAK_WORD_CONF = 70;

function pageFromOCR(data, width, height) {
  const paragraphs = data.blocks ? data.blocks.flatMap(b => b.paragraphs || []) : (data.paragraphs || []);
  // On a phone screenshot the top strip is the status bar (clock, signal, Dynamic Island
  // live activities). It's never recipe text, but it reads as junk like "2200 CHEE @ -".
  const statusBar = isScreenshot(width, height) ? height * STATUS_BAR_BOTTOM : 0;
  const lines = [];
  for (const p of paragraphs) {
    let first = true;
    for (const l of p.lines || []) {
      let words = (l.words || []).filter(w => w.text && w.text.trim());
      if (statusBar) words = words.filter(w => (w.bbox.y0 + w.bbox.y1) / 2 > statusBar);
      // Checkboxes beside ingredients read as "{_]", "(l_l", "[]": a squarish mark with no real letters.
      words = words.filter(w => {
        const bw = w.bbox.x1 - w.bbox.x0, bh = w.bbox.y1 - w.bbox.y0;
        return !(w.text.length <= 4 && /^[[\]{}()|_lIi!:;=—-]+$/.test(w.text) && bh > 0 && bw / bh > 0.6 && bw / bh < 1.6);
      });
      if (!words.length) continue;
      // Drop short junk stuck onto a line from a separate column (like/comment counts, icons),
      // but only when it stands apart from the text: short words at the end of a line
      // ("is", "a", "to 6") are real words, and "Time   15 min" keeps its number.
      const gaps = words.slice(1).map((w, i) => w.bbox.x0 - words[i].bbox.x1).sort((a, b) => a - b);
      const usual = gaps.length ? gaps[(gaps.length - 1) >> 1] : 0;
      const apart = g => g > Math.max(width * 0.06, usual * 3);
      words = words.filter((w, i) => {
        if (/[A-Za-z]{3}/.test(w.text) || w.text.length > 6) return true;
        if (i === 0) return !(words.length === 1 && w.bbox.x0 > width * 0.86);
        const gapBefore = w.bbox.x0 - words[i - 1].bbox.x1;
        const gapAfter = i + 1 < words.length ? words[i + 1].bbox.x0 - w.bbox.x1 : Infinity;
        return !(apart(gapBefore) && apart(gapAfter));
      });
      // The last word, read with almost no confidence, is a mark rather than text when it sits
      // far from the line (star-rating icons beside a title read as "ataltet") or is a lone
      // symbol after a finished sentence (a pen tick read as "f" or "#").
      while (words.length > 1) {
        const w = words[words.length - 1], prev = words[words.length - 2];
        if ((w.confidence ?? 100) >= 20) break;
        const lineH = Math.max(1, ...words.map(x => x.bbox.y1 - x.bbox.y0));
        const far = w.bbox.x0 - prev.bbox.x1 > Math.max(lineH * 2.5, apart(0) ? 0 : usual * 3);
        const tick = w.text.length <= 2 && /[.!?)]$/.test(prev.text);
        if (!far && !tick) break;
        words = words.slice(0, -1);
      }
      // A screenshot's header bar: a centred title between a back arrow and icons
      // ("<   Miso Chicken   (1k  ⇧"). Keep the title words; note the back arrow.
      let header = null;
      if (statusBar && l.bbox.y1 < height * 0.12 && words.length > 1) {
        const groups = [[words[0]]];
        for (let i = 1; i < words.length; i++) {
          if (words[i].bbox.x0 - words[i - 1].bbox.x1 > width * 0.04) groups.push([]);
          groups[groups.length - 1].push(words[i]);
        }
        const letters = g => g.reduce((a, w) => a + (w.text.match(/[A-Za-z]/g) || []).length, 0);
        const main = groups.reduce((a, g) => (letters(g) > letters(a) ? g : a));
        header = { back: /^[<‹«]/.test(words[0].text) };
        if (groups.length > 1 && letters(main) >= 3) words = main;
      }
      const text = words.map(w => w.text).join(' ').replace(/\s+/g, ' ').trim();
      if (!text) continue;
      const conf = words.reduce((a, w) => a + (w.confidence ?? 100), 0) / words.length;
      const box = {
        x0: Math.min(...words.map(w => w.bbox.x0)), x1: Math.max(...words.map(w => w.bbox.x1)),
        y0: Math.min(...words.map(w => w.bbox.y0)), y1: Math.max(...words.map(w => w.bbox.y1)),
      };
      // Words the reader wasn't sure of (and fractions we rebuilt from a digit re-read).
      // Fractions always read with low confidence, but repairFractions has already rebuilt them;
      // likewise accents the misread fixer restores (jalapeño, purée). Neither needs a second look.
      const fold = t => t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ñ/g, 'n');
      const weak = words.filter(w => (w.confidence ?? 100) < WEAK_WORD_CONF
        && !new RegExp(`^\\W*\\d*[${FRAC}]`).test(w.text)
        && fixCommonMisreads(fold(w.text)) === fold(w.text)).map(w => w.text);
      lines.push({ text, ...box, height: box.y1 - box.y0, conf, weak, brk: first, ...(header ? { header } : {}) });
      first = false;
    }
  }
  // Drop garbage: very low confidence, or squashed lines (e.g. the edge of a photo).
  const heights = lines.map(l => l.height).sort((a, b) => a - b);
  const median = heights[heights.length >> 1] || 0;
  // Screenshot text is crisp, so a shaky read there is a photo or an ad, not recipe text.
  const minConf = isScreenshot(width, height) ? 50 : 35;
  // A shaky "Time  1 hr" is still worth keeping: its label tells us what it is.
  const meta = l => /^(?:total\s+|prep\w*\s+|cook\w*\s+)?time\b|^(?:serves|yield|servings)\b/i.test(l.text) && /\d/.test(l.text);
  const kept = lines.filter(l => (l.conf >= minConf || (l.conf >= 25 && meta(l))) && !(l.height < median * 0.6 && l.conf < 70)
    && !(l.conf < 75 && !/[A-Za-z]{4}/.test(l.text))); // shaky read with no real words: "mo are ee. a"
  kept.forEach((l, i) => { if (i && !l.brk && !lines.includes(kept[i - 1])) l.brk = true; });
  return { width, height, lines: kept };
}

/** Where a screenshot's header bar sits (below the status bar), in pixels. */
function headerBand(height) {
  return { top: Math.round(height * STATUS_BAR_BOTTOM), bottom: Math.round(height * 0.105) };
}

/**
 * Swap a screenshot's header-bar lines for a separate read of just that strip.
 * Read with the whole page, a small two-line title bar often comes out garbled
 * ("< See Wee itp Gorn and"); read on its own it's clean. hdr is the strip's OCR
 * result, drawn at `scale` times the page's size starting at `top`.
 */
function mergeHeader(data, hdr, top, bottom, scale) {
  const words = l => (l.words || []).filter(w => w.text && w.text.trim());
  const conf = ls => { const ws = ls.flatMap(words); return ws.length ? ws.reduce((a, w) => a + (w.confidence ?? 0), 0) / ws.length : 0; };
  const map = b => ({ x0: b.x0 / scale, x1: b.x1 / scale, y0: b.y0 / scale + top, y1: b.y1 / scale + top });
  const stripHeight = (bottom - top) * scale;
  // Only lines wholly inside the strip; one cut by its edge is partial.
  const fresh = (hdr.blocks || []).flatMap(b => b.paragraphs || []).flatMap(p => p.lines || [])
    .filter(l => l.bbox.y0 > 1 && l.bbox.y1 < stripHeight - 1 && words(l).length)
    .map(l => ({ ...l, bbox: map(l.bbox), words: words(l).map(w => ({ ...w, bbox: map(w.bbox) })) }));
  if (!fresh.length) return data;
  const overlaps = l => fresh.some(f => Math.min(l.bbox.y1, f.bbox.y1) - Math.max(l.bbox.y0, f.bbox.y0)
    > 0.5 * Math.min(l.bbox.y1 - l.bbox.y0, f.bbox.y1 - f.bbox.y0));
  const old = (data.blocks || []).flatMap(b => b.paragraphs || []).flatMap(p => p.lines || []).filter(overlaps);
  if (old.length && conf(fresh) <= conf(old)) return data;
  const blocks = (data.blocks || []).map(b => ({ ...b, paragraphs: (b.paragraphs || [])
    .map(p => ({ ...p, lines: (p.lines || []).filter(l => !overlaps(l)) })).filter(p => p.lines.length) }))
    .filter(b => b.paragraphs.length);
  const box = { x0: Math.min(...fresh.map(l => l.bbox.x0)), x1: Math.max(...fresh.map(l => l.bbox.x1)),
    y0: Math.min(...fresh.map(l => l.bbox.y0)), y1: Math.max(...fresh.map(l => l.bbox.y1)) };
  return { ...data, blocks: [{ bbox: box, paragraphs: [{ bbox: box, lines: fresh }] }, ...blocks] };
}

/**
 * How badly a page's read is broken into fragments (0 = clean). Automatic layout can
 * mistake a text column for two, splitting "Pour half…" into "Po" + "ur half…".
 */
function fragmentation(page) {
  const lines = page.lines.filter(l => l.text.trim());
  if (lines.length < 6) return 0;
  const tiny = lines.filter(l => l.text.replace(/[^A-Za-z]/g, '').length <= 3 && !/^\d|^(?:step|tip)\b/i.test(l.text)).length;
  // Pieces of text side by side on the same row with almost no gap: a split column.
  let split = 0;
  if (lines.every(l => l.x0 != null)) {
    for (const a of lines) {
      if (lines.some(b => b !== a && b.x0 >= a.x1 && b.x0 - a.x1 < page.width * 0.03
        && Math.min(a.y1, b.y1) - Math.max(a.y0, b.y0) > 0.5 * Math.min(a.y1 - a.y0, b.y1 - b.y0))) split++;
    }
  }
  return Math.max(tiny, split * 2) / lines.length;
}

// ---------- 3. Assemble pages ----------

const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');

function similar(a, b) {
  const x = norm(a), y = norm(b);
  if (!x || !y) return false;
  if (x === y) return true;
  if (Math.min(x.length, y.length) < 12) return false;
  if (Math.abs(x.length - y.length) > Math.max(x.length, y.length) * 0.2) return false;
  return 1 - levenshtein(x, y) / Math.max(x.length, y.length) >= 0.85;
}

// For pinned elements read slightly differently on each screenshot ("TX" vs "™").
function looselySame(x, y) {
  if (Math.min(x.length, y.length) < 6) return false;
  return 1 - levenshtein(x, y) / Math.max(x.length, y.length) >= 0.75;
}

function levenshtein(a, b) {
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[b.length];
}

const STATUS_BAR = /\b\d{1,2}:\d{2}\b|\b(?:5G|LTE|4G|3G)\b/i;
const TAB_WORDS = /^(?:(?:home|search|recent|saved|profile|account|recipe box|recipes|inspiration|explore|library|settings|more|shop|for you|cart|menu|favorites|collections|grocery list)\s*)+$/i;
const CHROME_LINE = new RegExp([
  '^advertisement$', '^sponsored', '^add a note$', '^your (?:private )?notes$', "^you don.?t have any notes",
  '^cooked(?![,;]?\\s+[a-z]{2,})', '^jump to recipe', '^print(?: recipe)?$', '^save(?: recipe| to recipe box)?$', '^saved\\b',
  '^share(?: recipe)?$', '^rate (?:this|the) recipe', '^leave a (?:review|comment)', '^(?:log|sign) in',
  '^subscribe', '^read (?:more|comments)', '^\\d+ (?:comments|ratings|reviews)$', '^(?:yield|scale|convert)(?:\\s+(?:yield|scale|convert))*$',
  '^add (?:a )?comment', 'find\\s*rel\\w*\\s*(?:con\\w*)?', '\\bfind\\s+\\w{2,9}\\s+cont\\w*', '^search$', '^(?:less|more|see more|show more|\\.\\.\\. ?more)\\W*\\w?$',
  '^add to grocery list', 'shop (?:on instacart|ingredients)', '^shop\\s*ingred', '\\bsho\\w?\\s+ing\\w*\\b', '^\\W*\\w{0,3}\\s*saved\\b', '^rating\\b', '^comments\\b', '^ingredient substitution', '^nutrition(?:al)? info', '^cook mode$',
  '^overview\\b.*\\bcook mode', 'food stylist', 'for the new york times\\b', '^photo(?:graph)? by\\b',
  '^enjoy!*$', '^(?:follow|like|subscribe)\\b.*\\b(?:recipes?|more)\\b',
  // Connection banners and toasts that pop up over the page.
  'working on (?:our|the|your) connection', '^try again (?:later|in a (?:few|moment))', '^no internet connection',
  '^you(?:\'|’)?re offline', '^(?:check|lost) (?:your )?(?:internet )?connection', '^something went wrong',
].join('|'), 'i');

function lettersOnly(s) { return s.replace(/^[^A-Za-z]+/, ''); }

const TAB_LABELS = ['home', 'inspiration', 'search', 'recent', 'recipe', 'box', 'saved', 'profile', 'account', 'explore', 'library', 'settings', 'more', 'shop', 'cart', 'menu', 'favorites', 'collections', 'grocery', 'list', 'discover', 'cook', 'plan', 'you'];
// "Home nspiration Searc Recen Recipe Box": a tab bar read imperfectly.
function nearLabel(w) {
  return TAB_LABELS.some(l => l.includes(w) || w.includes(l) || (w.length >= 3 && levenshtein(w, l.slice(0, w.length)) <= 1));
}
function looksLikeTabBar(t, atVeryBottom = false) {
  const words = t.toLowerCase().split(/\s+/).map(w => w.replace(/[^a-z]/g, '')).filter(w => w.length >= 3);
  if (/recipe\s*box/i.test(t) && atVeryBottom) return true; // the app's own tab label
  if (words.length < 2) return false;
  const hits = words.filter(nearLabel).length;
  return hits / words.length >= 0.75 || (atVeryBottom && hits >= 2 && words.length <= 5);
}

// Lines that are mostly hashtags, or have no words at all (like counts, stray marks).
function isNoiseLine(t) {
  const words = t.split(/\s+/).filter(Boolean);
  if (words.length && words.filter(w => w.startsWith('#')).length / words.length >= 0.5) return true;
  if (/^(?:(?:step|stage)\s*)?\d{1,2}\s*[.):]?$/i.test(t)) return false; // a step number on its own line
  if (!/[A-Za-z]{2}/.test(t)) return true;
  // A row of icons read as letters: "A Pl Q Oy W"
  return words.length >= 3 && !/\d/.test(t) && words.every(w => w.replace(/\W/g, '').length <= 2);
}
// "Austin, TX · Austin" location tags on social posts.
const LOCATION = /^\W*[A-Z][a-z]+(?: [A-Z][a-z]+)*, (?:[A-Z]{2}\b|\S{1,3}\s*[-–·•])/;
// "Olivia Adriance · 2024-7-18": a poster's name followed by a date.
const AUTHOR_DATE = /^\W*([A-Z][a-z'’-]+(?:\s+[A-Z][a-z'’-]+){1,2})\s*[-–·•.,‘'’ ]*\d[\d\s\-/.°'’]{3,}\S{0,2}\s*$/;
const PERSON_NAME = /^\W*([A-Z][a-z'’-]+(?:\s+[A-Z][a-z'’-]+){1,2})\W*$/;

/** "< Marry Me Chicken Gi) (4 A" -> "Marry Me Chicken" */
function cleanTitleLine(s) {
  const words = s.split(/\s+/);
  const out = [];
  for (const w of words) {
    if (/^[A-Za-z][A-Za-z'’&-]*,?$/.test(w) || (out.length && /^(?:&|and|with|of|the|a)$/i.test(w))) out.push(w);
    else if (out.length) break;
  }
  // Trailing icon letters ("GJ", "a"): trim them before judging the title.
  while (out.length > 1 && (/^[A-Z]{1,2}$/.test(out[out.length - 1]) || /^[a-z]$/.test(out[out.length - 1]))) out.pop();
  // A real title bar reads like a title: starts with a capital, no stray single lowercase letters.
  if (!out.length || !/^[A-Z0-9]/.test(out[0]) || out.some(w => /^[a-z]$/.test(w))) return '';
  if (CHROME_LINE.test(out.join(' '))) return '';
  const t = out.join(' ').replace(/,$/, '');
  return t.length >= 3 ? t : '';
}

function stepNumbers(lines) {
  return lines.map(l => (l.text.match(/^step\s*(\d{1,2})\b/i) || [])[1]).filter(Boolean).map(Number);
}

/**
 * Where does the start of page B overlap the end of page A?
 * Tolerates a line read on one page but missed on the other.
 */
function align(A, B) {
  let best = null;
  for (let j = 0; j < Math.min(6, B.length); j++) {
    for (let i = A.length - 1; i >= Math.max(0, A.length - 80); i--) {
      if (!similar(A[i].text, B[j].text)) continue;
      let ia = i + 1, jb = j + 1, matched = 1, skips = 0;
      while (ia < A.length && jb < B.length) {
        if (similar(A[ia].text, B[jb].text)) { ia++; jb++; matched++; continue; }
        if (skips >= 3) break;
        if (ia + 1 < A.length && similar(A[ia + 1].text, B[jb].text)) { ia++; skips++; continue; }
        if (jb + 1 < B.length && similar(A[ia].text, B[jb + 1].text)) { jb++; skips++; continue; }
        break;
      }
      const reachesEnd = ia >= A.length - 1; // the last line of A may be cut off
      // A section heading ("PREPARATION") appears once per recipe, so it pins the overlap
      // even when the line after it was cut off by the tab bar ("CTED 1" for "STEP 1").
      const strong = matched >= 2 || norm(A[i].text).length >= 25 || !!headingOf(A[i].text) || /^step\s*\d{1,2}$/i.test(A[i].text.trim());
      if (reachesEnd && strong && (!best || matched > best.score)) best = { i, j, score: matched };
    }
    if (best) break;
  }
  return best;
}

/**
 * The recipe's name set in large type at the top of a recipe (a website or app's header):
 * the tallest run of big lines, joined when it wraps ("Linguine With Zucchini," / "Corn and Shrimp").
 */
function heroTitle(pages) {
  let best = null;
  pages.forEach(p => {
    if (!isScreenshot(p.width, p.height)) return;
    // Normal text height: buttons and junk reads are tall, so look below the middle.
    const hs = p.lines.map(l => l.height).sort((a, b) => a - b);
    const median = hs[Math.floor(hs.length * 0.35)] || 0;
    const ok = l => l.y0 > p.height * 0.12 && l.conf >= 60 && /[A-Za-z]{3}/.test(l.text) && !/^\W/.test(l.text)
      && (l.x1 - l.x0) / l.text.length >= 0.3 * l.height // real big type is wide; a button's outline isn't
      && !CHROME_LINE.test(l.text.replace(/^(?:[A-Za-z]{1,2}\s+)+/, ''))
      && l.text.split(/\s+/).length <= 12 && (l.text.match(/[A-Za-z]/g) || []).length >= l.text.replace(/\s/g, '').length * 0.8
      && !CHROME_LINE.test(l.text) && !headingOf(l.text);
    for (let i = 0; i < p.lines.length; i++) {
      const l = p.lines[i];
      if (l.height < median * 1.45 || !ok(l)) continue;
      const group = [l];
      for (let j = i + 1; j < p.lines.length; j++) {
        const m = p.lines[j], last = group[group.length - 1];
        if (m.height < last.height * 0.7 || m.height > last.height * 1.3 || m.y0 - last.y1 > last.height * 0.8
          || m.y0 < last.y0 + last.height * 0.6 || !ok(m)) break; // overlapping = a second read of the same line
        group.push(m);
      }
      const h = Math.max(...group.map(g => g.height));
      // The reader sometimes reads big type twice, overlapping ("Mapo Ragt" / "apo Kagu").
      const twins = p.lines.filter(m => !group.includes(m) && group.some(g => Math.min(g.y1, m.y1) - Math.max(g.y0, m.y0) > 0.5 * Math.min(g.height, m.height)));
      if (!best || h > best.height) best = { height: h, lines: [...group, ...twins], text: group.map(g => g.text).join(' ').replace(/\s+/g, ' ').trim() };
      i += group.length - 1;
    }
  });
  return best;
}

/**
 * pages: [{ width, height, lines:[{text,y0,y1,brk}] }] in the order the person chose.
 * Returns { lines: [{text, brk}], titleHint, sourceHint, gaps }.
 */
function assemblePages(pages) {
  const screenshot = p => isScreenshot(p.width, p.height);
  const topZone = p => l => l.y1 < p.height * 0.12;
  const bottomZone = p => l => l.y0 > p.height * 0.88;

  // Text repeated at the top or bottom of several screenshots is app chrome. Each read
  // can pick up different stray marks, so compare loosely, and compare title bars by
  // their cleaned title ("< Marry Me Chicken (1k" and "Marry Me Chicken @" match).
  const countLoose = (zone) => {
    const keys = pages.map(p => p.lines.filter(zone(p)).map(l => norm(l.text)));
    return key => keys.filter(list => list.some(k => k === key || looselySame(k, key))).length;
  };
  const topCount = countLoose(topZone), bottomCount = countLoose(bottomZone);
  const titleCounts = new Map();
  for (const p of pages) {
    const seen = new Set(p.lines.filter(topZone(p)).map(l => cleanTitleLine(lettersOnly(l.text))).filter(Boolean));
    for (const t of seen) titleCounts.set(t, (titleCounts.get(t) || 0) + 1);
  }
  const repeatedTop = { get: key => topCount(key) }, repeatedBottom = { get: key => bottomCount(key) };

  // Title bars: an app's header at the top of each screenshot, sometimes over two lines
  // ("Linguine With Zucchini, Corn and" / "< Shrimp"). Once two screenshots agree on it,
  // that strip is chrome on every screenshot, even where it was misread ("< See Wee itp Gorn").
  const wordSet = t => new Set((t.toLowerCase().match(/[a-z]{2,}/g) || []));
  const overlap = (a, b) => { const A = wordSet(a), B = wordSet(b); return Math.min(A.size, B.size) ? [...A].filter(w => B.has(w)).length / Math.min(A.size, B.size) : 0; };
  const bars = pages.map(p => {
    if (!screenshot(p)) return null;
    const ls = p.lines.filter(l => l.y1 < p.height * (pages.length === 1 ? 0.11 : 0.12));
    const title = ls.filter(l => !headingOf(l.text) && !CHROME_LINE.test(l.text))
      .map(l => cleanTitleLine(lettersOnly(l.text))).filter(Boolean).join(' ');
    const conf = ls.length ? ls.reduce((a, l) => a + l.conf, 0) / ls.length : 0;
    return { ls, title, conf, back: ls.some(l => l.header && l.header.back) };
  });
  // A title bar is trusted when another screenshot (or the big title) agrees with it, allowing
  // for a garbled word or two; when it sits beside a back arrow; or on a lone screenshot.
  let hero = heroTitle(pages);
  const agrees = b => bars.some(o => o && o !== b && o.title && overlap(o.title, b.title) >= 0.6) || (hero && overlap(hero.text, b.title) >= 0.6);
  const trusted = bars.map((b, i) => [b, i]).filter(([b]) => b && b.title
    && (pages.length === 1 || agrees(b) || (b.back && b.conf >= 80)));
  let barBottom = 0;
  for (const [b, i] of trusted) barBottom = Math.max(barBottom, ...b.ls.map(l => l.y1 / pages[i].height));
  const barTitle = (trusted.map(([b]) => b).sort((a, b) => (agrees(b) - agrees(a)) || b.conf - a.conf || b.title.length - a.title.length)[0] || {}).title || '';
  // Big text that has nothing to do with the header bar's title isn't the title.
  if (hero && barTitle && overlap(hero.text, barTitle) < 0.5) hero = null;
  const knownTitle = (hero && hero.text) || barTitle;

  // Pinned elements sit at the same spot on every screenshot (author line, video
  // caption stickers, like counts); scrolled content moves between screenshots.
  const placed = pages.map(p => p.lines.map(l => ({ key: norm(l.text), y: l.y0 / p.height })));
  const pinned = (pi, l) => {
    const key = norm(l.text), y = l.y0 / pages[pi].height;
    return key.length > 0 && placed.some((pl, qi) => qi !== pi && pl.some(o => Math.abs(o.y - y) < 0.015 && (o.key === key || looselySame(o.key, key))));
  };

  let titleHint = '', sourceHint = '';
  const cleaned = pages.map((p, index) => {
    const lines = [];
    let pendingBrk = false, lastDropped = null;
    for (const l of p.lines) {
      const key = norm(l.text);
      const inTop = topZone(p)(l), inBottom = bottomZone(p)(l);
      let drop = false;
      const author = l.text.match(AUTHOR_DATE);
      if (author) { if (!sourceHint) sourceHint = author[1]; drop = true; }
      else if (inTop && l.y1 < p.height * 0.06 && STATUS_BAR.test(l.text)) drop = true;
      else if (isNoiseLine(l.text) || LOCATION.test(l.text)) drop = true;
      else if (hero && hero.lines.includes(l)) drop = true;
      else if (inTop && barBottom && l.y1 <= p.height * (barBottom + 0.01)) drop = true;
      else if (inTop && pages.length > 1 && (repeatedTop.get(key) >= 2 || titleCounts.get(cleanTitleLine(lettersOnly(l.text))) >= 2)) {
        drop = true;
        const t = cleanTitleLine(lettersOnly(l.text));
        if (!titleHint && t && titleCounts.get(t) >= 2) titleHint = t;
      }
      else if (inBottom && pages.length > 1 && repeatedBottom.get(key) >= 2) drop = true;
      else if (pages.length > 1 && pinned(index, l)) {
        drop = true;
        const name = l.text.match(PERSON_NAME);
        if (name && !sourceHint && l.text.split(/\s+/).length <= 3) sourceHint = name[1];
      }
      else if (inBottom && (TAB_WORDS.test(lettersOnly(l.text)) || looksLikeTabBar(l.text, l.y0 > p.height * 0.9))) drop = true;
      else if (CHROME_LINE.test(lettersOnly(l.text).trim()) || CHROME_LINE.test(l.text.replace(/^(?:\S*[^A-Za-z\s]\S*\s+|[A-Za-z]{1,2}\s+)+/, ''))) drop = true;
      // A header bar: starts with a back arrow, or repeats the recipe's name.
      if (!drop && screenshot(p) && inTop && (/^[<‹«]/.test(l.text) || (l.header && l.header.back) || (knownTitle && overlap(l.text, knownTitle) >= 0.6))) drop = true;
      if (!drop && lastDropped && /^[a-z]/.test(l.text) && l.text.length <= 25 && !/[.!?:]$/.test(lastDropped.text)
        && l.y0 - lastDropped.y1 < lastDropped.height * 1.5) drop = true; // the wrapped end of chrome text
      lastDropped = drop ? l : null;
      if (drop) { pendingBrk = pendingBrk || l.brk; continue; }
      lines.push({ text: l.text, weak: l.weak, brk: l.brk || pendingBrk });
      pendingBrk = false;
    }
    return { index, lines };
  });

  // Chain overlapping pages (screenshots scrolled with some overlap).
  const n = cleaned.length;
  const edges = [];
  for (let a = 0; a < n; a++) for (let b = 0; b < n; b++) {
    if (a === b) continue;
    const al = align(cleaned[a].lines, cleaned[b].lines);
    if (al) edges.push({ a, b, ...al });
  }
  edges.sort((x, y) => y.score - x.score);
  const next = new Array(n).fill(null), prev = new Array(n).fill(null), link = {};
  for (const e of edges) {
    if (next[e.a] !== null || prev[e.b] !== null) continue;
    let c = e.b; let cycle = false;           // avoid a -> ... -> a
    while (c !== null) { if (c === e.a) { cycle = true; break; } c = next[c]; }
    if (cycle) continue;
    next[e.a] = e.b; prev[e.b] = e.a; link[`${e.a}>${e.b}`] = e;
  }

  const chains = [];
  for (let s = 0; s < n; s++) {
    if (prev[s] !== null) continue;
    const order = [];
    for (let c = s; c !== null; c = next[c]) order.push(c);
    let merged = cleaned[order[0]].lines.slice();
    for (let k = 1; k < order.length; k++) {
      const e = link[`${order[k - 1]}>${order[k]}`];
      const B = cleaned[order[k]].lines;
      const offset = merged.length - cleaned[order[k - 1]].lines.length; // A's lines sit at the end of merged
      const cut = offset + e.i;
      const first = { ...B[e.j], brk: merged[cut] ? merged[cut].brk : B[e.j].brk };
      const tail = B.slice(e.j + 1);
      // Lines both photos show were read twice: a word only stays doubtful if both reads were unsure of it.
      [first, ...tail].forEach((l, t) => {
        const a = merged[cut + t];
        if (!a || norm(a.text) !== norm(l.text) || !l.weak) return;
        l.weak = l.weak.filter(w => (a.weak || []).includes(w));
      });
      merged = merged.slice(0, cut).concat([first], tail);
    }
    // Rank: an intro page (title, byline, times) comes first, then ingredients, then steps.
    const hasIngredients = merged.some(l => /^ingredients?\b/i.test(l.text));
    const steps = stepNumbers(merged);
    const hasSteps = steps.length > 0 || merged.some(l => /^(?:directions?|instructions?|method|preparation)\b/i.test(l.text));
    const hasIntro = merged.some(l => /^\(?\s*prep\b|^by [A-Z]|\bservings?\b|^serves\b|^yield/i.test(l.text));
    // What a page starts with says where it belongs better than what it contains:
    // an intro page often ends with the "Ingredients" heading peeking in at the bottom.
    const head = merged.slice(0, 3).map(l => l.text);
    const startsIngredients = head.some(t => /^ingredients?\b/i.test(t));
    const startsSteps = head.some(t => /^(?:step\s*\d|directions?|instructions?|method|preparation)\b/i.test(t));
    const startsIntro = head.some(t => /^by\s+[A-Z]|^\(?\s*prep\b|^(?:total\s+)?time\b|^rating\b/i.test(t));
    const rank = startsIngredients ? 1 : startsSteps ? 2 : startsIntro ? 0
      : hasIngredients ? 1 : hasSteps ? 2 : hasIntro ? 0 : 1.5;
    chains.push({ merged, key: [rank, steps.length ? Math.min(...steps) : 999, order[0]] });
  }
  chains.sort((x, y) => x.key[0] - y.key[0] || x.key[1] - y.key[1] || x.key[2] - y.key[2]);

  // Where separate chains meet mid-sentence, something between them is probably missing.
  let gaps = 0;
  for (let c = 1; c < chains.length; c++) {
    const prev = chains[c - 1].merged, next = chains[c].merged;
    if (!prev.length || !next.length) continue;
    const end = prev[prev.length - 1].text, start = next[0].text;
    if (!/[.!?:)"”]$/.test(end) && /^[a-z]/.test(start)) gaps++;
  }

  // Safety net: drop exact repeats of long lines across separate chains.
  const seen = new Set();
  const lines = [];
  for (const ch of chains) {
    ch.merged.forEach((l, i) => {
      const key = norm(l.text);
      if (key.length >= 30 && seen.has(key)) return;
      seen.add(key);
      lines.push({ text: l.text, weak: l.weak, brk: i === 0 ? true : l.brk });
    });
  }
  if (lines.length) lines[0].brk = false;
  // Title: the header bar's plain type reads most reliably, but it can be cut short; the
  // big title is complete but its decorative type can misread ("Mapo Ragt"). Use the bar
  // when it has as many words as the big title, otherwise the big title.
  const words = t => new Set(t.toLowerCase().match(/[a-z]+/g) || []);
  const count = t => (t.match(/\S+/g) || []).length;
  if (barTitle) titleHint = barTitle;
  if (hero) {
    const hw = words(hero.text), bw = words(titleHint);
    const related = [...bw].filter(w => hw.has(w)).length >= bw.size / 2;
    if (!titleHint || (related && count(titleHint) < count(hero.text))) titleHint = hero.text;
  }
  return { lines, titleHint: titleHint.replace(/[,;:]$/, ''), sourceHint, gaps };
}

function linesToText(lines) {
  return lines.map(l => (l.brk ? '\n' : '') + l.text).join('\n').trim();
}

// On-device text recognition with Tesseract.js (loaded from a CDN on first use).
// The language data (~4 MB) downloads once and is then cached by the browser.


const TESSERACT_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
const MAX_SIDE = 2400; // text reads most accurately around this size; also keeps memory low on phones

let scriptPromise = null;
let workerPromise = null;
let progressHandler = null;
let quiet = false; // true while reading fraction digits, so progress doesn't jump around

function loadScript() {
  if (window.Tesseract) return Promise.resolve();
  if (scriptPromise) return scriptPromise;
  scriptPromise = new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = TESSERACT_URL;
    el.async = true;
    el.onload = resolve;
    el.onerror = () => {
      scriptPromise = null;
      el.remove();
      reject(new Error('The text reader could not load. Connect to the internet and try again (it works offline after the first scan).'));
    };
    document.head.appendChild(el);
  });
  return scriptPromise;
}

async function getWorker() {
  await loadScript();
  if (!workerPromise) {
    workerPromise = (async () => {
      const worker = await window.Tesseract.createWorker('eng', 1, {
        logger: m => !quiet && progressHandler && progressHandler(m),
      });
      await worker.setParameters({ tessedit_pageseg_mode: '3' }); // automatic layout: keeps paragraphs apart
      return worker;
    })().catch(err => { workerPromise = null; throw err; });
  }
  return workerPromise;
}

// The reader works in the background. A phone can stop it when memory runs short, and then
// it never answers, so every read gets a time limit and a stalled reader is replaced.
const READ_LIMIT_MS = 150000, DIGIT_LIMIT_MS = 20000;
class ReaderStalled extends Error {}
async function within(promise, ms) {
  let timer;
  try {
    return await Promise.race([promise, new Promise((_, reject) => { timer = setTimeout(() => reject(new ReaderStalled()), ms); })]);
  } finally { clearTimeout(timer); }
}
async function resetWorker() {
  const pending = workerPromise;
  workerPromise = null;
  try { const w = await within(pending, 3000); await within(w.terminate(), 3000); } catch {}
}
// Let the screen respond to taps between the heavy steps of a scan.
const breathe = () => new Promise(resolve => setTimeout(resolve, 0));

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(`${file.name || 'That file'} isn't an image this browser can open. Try a JPEG or PNG.`)); };
    img.src = url;
  });
}

// Grayscale + contrast stretch. Returns the canvas plus its gray pixels for fraction repair.
async function prepareForOCR(file) {
  const img = await loadImage(file);
  const longSide = Math.max(img.naturalWidth, img.naturalHeight);
  let scale = 1;
  if (longSide > MAX_SIDE) scale = MAX_SIDE / longSide;
  else if (longSide < 1400) scale = Math.min(2, 1400 / longSide);
  const w = Math.round(img.naturalWidth * scale);
  const h = Math.round(img.naturalHeight * scale);

  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, w, h);

  const data = ctx.getImageData(0, 0, w, h);
  const px = data.data;
  const gray = new Uint8Array(w * h);
  const hist = new Uint32Array(256);
  for (let i = 0, j = 0; i < px.length; i += 4, j++) {
    const g = (px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114) | 0;
    gray[j] = g; hist[g]++;
  }
  const total = w * h;

  // Mostly-dark page. The reader wants dark text on a light page, so flip it.
  let acc0 = 0, median = 0;
  for (; median < 255; median++) { acc0 += hist[median]; if (acc0 >= total / 2) break; }
  let flat = 0;
  for (let v = Math.max(0, median - 10); v <= Math.min(255, median + 10); v++) flat += hist[v];
  if (median < 100 && flat >= total * 0.45) {
    // An app in dark mode (flat background): invert, keeping the soft letter edges,
    // which read far better than hard black-and-white ("Ragt", "chets" otherwise).
    for (let j = 0; j < gray.length; j++) gray[j] = 255 - gray[j];
    hist.reverse();
  } else if (median < 100) {
    // White caption text over a busy video frame: keep only the bright text.
    for (let j = 0, i = 0; j < gray.length; j++, i += 4) {
      const v = gray[j] > 185 ? 0 : 255;
      gray[j] = v;
      px[i] = px[i + 1] = px[i + 2] = v;
    }
    ctx.putImageData(data, 0, 0);
    return { canvas, gray, width: w, height: h };
  }

  // Ignore the darkest/lightest 1% so stray shadows don't flatten the stretch.
  let lo = 0, hi = 255, acc = 0;
  for (; lo < 255; lo++) { acc += hist[lo]; if (acc > total * 0.01) break; }
  acc = 0;
  for (; hi > 0; hi--) { acc += hist[hi]; if (acc > total * 0.01) break; }
  const range = Math.max(1, hi - lo);
  for (let j = 0, i = 0; j < gray.length; j++, i += 4) {
    const v = Math.max(0, Math.min(255, ((gray[j] - lo) * 255) / range)) | 0;
    gray[j] = v;
    px[i] = px[i + 1] = px[i + 2] = v;
  }
  ctx.putImageData(data, 0, 0);
  return { canvas, gray, width: w, height: h };
}

// Draw one fraction digit (only its own pixels) at a fixed height with generous margins,
// the layout single-character recognition handles best.
function digitCanvas(part, gray, W, digitHeight) {
  const w = part.x1 - part.x0, h = part.y1 - part.y0;
  const small = document.createElement('canvas');
  small.width = w; small.height = h;
  const sctx = small.getContext('2d');
  const img = sctx.createImageData(w, h);
  img.data.fill(255);
  for (let i = 0; i < part.pts.length; i += 2) {
    const x = part.pts[i], y = part.pts[i + 1], v = gray[y * W + x], o = ((y - part.y0) * w + (x - part.x0)) * 4;
    img.data[o] = img.data[o + 1] = img.data[o + 2] = v;
  }
  sctx.putImageData(img, 0, 0);
  const s = digitHeight / h, pad = Math.round(digitHeight * 0.35);
  const c = document.createElement('canvas');
  c.width = Math.round(w * s) + 2 * pad; c.height = digitHeight + 2 * pad;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(small, pad, pad, Math.round(w * s), digitHeight);
  return c;
}

/**
 * Read one or more photos or screenshots of a recipe, in any order.
 * onProgress receives { label, fraction } with fraction from 0 to 1.
 * Returns { text, lines, titleHint } ready for parseRecipeText.
 */
async function readRecipePhotos(files, onProgress = () => {}) {
  const count = files.length;
  let page = 0;
  const label = () => (count > 1 ? `Reading photo ${page + 1} of ${count}` : 'Reading the recipe');
  progressHandler = m => {
    if (m.status === 'recognizing text') onProgress({ label: label(), fraction: (page + (m.progress || 0) * 0.9) / count });
    else if (/load|initializ/.test(m.status)) onProgress({ label: 'Getting the text reader ready', fraction: 0 });
  };

  onProgress({ label: 'Getting the text reader ready', fraction: 0 });
  const worker = await within(getWorker(), READ_LIMIT_MS).catch(async err => {
    if (err instanceof ReaderStalled) { await resetWorker(); throw new Error('The text reader didn’t start. Check your connection and try again.'); }
    throw err;
  });

  const pages = [];
  try {
    for (page = 0; page < count; page++) {
      onProgress({ label: label(), fraction: page / count });
      await breathe();
      const prepared = await prepareForOCR(files[page]);
      await breathe();
      let { data } = await within(worker.recognize(prepared.canvas, {}, { text: true, blocks: true }), READ_LIMIT_MS);

      // A fragmented read means the automatic layout split a text column: reread the
      // page as one block of text and keep whichever read is cleaner.
      const first = fragmentation(pageFromOCR(data, prepared.width, prepared.height));
      if (first > 0.15) {
        onProgress({ label: `${label()} (second pass)`, fraction: (page + 0.5) / count });
        await worker.setParameters({ tessedit_pageseg_mode: '6' });
        const retry = (await within(worker.recognize(prepared.canvas, {}, { text: true, blocks: true }), READ_LIMIT_MS)).data;
        await worker.setParameters({ tessedit_pageseg_mode: '3' });
        if (fragmentation(pageFromOCR(retry, prepared.width, prepared.height)) < first) data = retry;
      }

      // Repair misread fractions (½, ¼, ¾…) by reading their digits one at a time.
      const words = (data.blocks || []).flatMap(b => b.paragraphs.flatMap(p => p.lines.flatMap(l => l.words)));
      let digitMode = false;
      quiet = true;
      await repairFractions(words, prepared.gray, prepared.width, prepared.height, async part => {
        if (!digitMode) {
          await worker.setParameters({ tessedit_pageseg_mode: '10', tessedit_char_whitelist: '0123456789' });
          digitMode = true;
        }
        for (const size of [48, 72]) {
          const r = await within(worker.recognize(digitCanvas(part, prepared.gray, prepared.width, size)), DIGIT_LIMIT_MS);
          const digit = (r.data.text || '').trim().slice(0, 1);
          if (/^[1-9]$/.test(digit)) return digit;
        }
        return '';
      });
      if (digitMode) await worker.setParameters({ tessedit_pageseg_mode: '3', tessedit_char_whitelist: '' });

      // Screenshots: reread the header bar (the recipe's name) on its own, at double size.
      if (isScreenshot(prepared.width, prepared.height)) {
        const { top, bottom } = headerBand(prepared.height);
        const strip = document.createElement('canvas');
        strip.width = prepared.width * 2; strip.height = (bottom - top) * 2;
        const sctx = strip.getContext('2d');
        sctx.imageSmoothingQuality = 'high';
        sctx.drawImage(prepared.canvas, 0, top, prepared.width, bottom - top, 0, 0, strip.width, strip.height);
        await worker.setParameters({ tessedit_pageseg_mode: '6' });
        const hdr = (await within(worker.recognize(strip, {}, { text: true, blocks: true }), READ_LIMIT_MS)).data;
        await worker.setParameters({ tessedit_pageseg_mode: '3' });
        data = mergeHeader(data, hdr, top, bottom, 2);
      }
      quiet = false;

      const pageResult = pageFromOCR(data, prepared.width, prepared.height);
      pageResult.secondPass = first > 0.15;
      pages.push(pageResult);
    }
  } catch (err) {
    if (err instanceof ReaderStalled) {
      await resetWorker();
      throw new Error('The text reader stopped responding. Try again; if it keeps happening, scan fewer photos at a time.');
    }
    // A failed read can leave the reader in single-digit mode; start fresh next time.
    await resetWorker();
    throw err;
  } finally {
    progressHandler = null;
    quiet = false;
  }

  onProgress({ label: 'Putting the pages together', fraction: 1 });
  const { lines, titleHint, sourceHint, gaps } = assemblePages(pages);
  return {
    text: linesToText(lines),
    assembled: lines,
    lines: pages.flatMap(p => p.lines.map(l => ({ text: l.text, height: l.height }))),
    titleHint, sourceHint, gaps,
    // For troubleshooting: what was read on each photo, line by line.
    report: pages.map((p, i) => `--- Photo ${i + 1} (${p.width}×${p.height}${p.secondPass ? ', reread as one block' : ''}) ---\n`
      + p.lines.map(l => `${Math.round(l.y0 / p.height * 100)}%  ${l.text}`).join('\n')).join('\n\n'),
  };
}

// Shrink a photo for storage alongside the recipe.
async function compressPhoto(file, maxSide = 1400, quality = 0.8) {
  const img = await loadImage(file);
  const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(img.naturalWidth * scale);
  canvas.height = Math.round(img.naturalHeight * scale);
  canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', quality);
}

function starRow(rating) {
  return [1, 2, 3, 4, 5].map(n => {
    const fill = rating >= n ? 'full' : rating >= n - 0.5 ? 'half' : 'empty';
    return `<span class="st ${fill}" aria-hidden="true">★</span>`;
  }).join('');
}
const ratingLabel = r => `${String(r).replace('.5', '½')} star${r === 1 ? '' : 's'}`;

// Big star buttons. Tapping a star gives that many; tapping the same star again
// takes off a half; a third tap clears.
function ratingButtons(rating) {
  return [1, 2, 3, 4, 5].map(n => {
    const fill = rating >= n ? 'full' : rating >= n - 0.5 ? 'half' : 'empty';
    return `<button class="rate-star" data-action="rate" data-star="${n}" aria-label="${n} star${n > 1 ? 's' : ''}" aria-pressed="${rating >= n - 0.5}"><span class="st ${fill}" aria-hidden="true">★</span></button>`;
  }).join('');
}

function starsText(rating) {
  if (!rating) return '';
  return `<span class="stars-static" role="img" aria-label="Rated ${ratingLabel(rating)} out of 5">${starRow(rating)}</span>`;
}

const DIETS = [['gf', 'Gluten-free', 'GF'], ['df', 'Dairy-free', 'DF']];
// Short tags shown on recipes: GF / DF, with "optional" ones outlined in dashes.
function dietBadges(r) {
  const d = r.diet || {};
  return DIETS.filter(([k]) => d[k]).map(([k, full, short]) => ({ short, optional: d[k] !== 'yes', label: d[k] === 'yes' ? full : `${full} optional` }));
}
const dietBadge = (b, cls) => `<span class="${cls}${b.optional ? ' opt' : ''}" title="${esc(b.label)}"><span aria-hidden="true">${esc(b.short)}</span><span class="sr-only">${esc(b.label)}</span></span>`;

// "Gluten-free", "GF optional"
function dietTags(r) {
  const d = r.diet || {};
  return DIETS.filter(([k]) => d[k]).map(([k, full, short]) => (d[k] === 'yes' ? full : `${short} optional`));
}

function metaSentence(r) {
  const parts = [];
  if (r.servings) parts.push(/^\d/.test(r.servings) ? `Serves ${r.servings}` : r.servings);
  if (r.prepTime) parts.push(`Prep ${r.prepTime}`);
  if (r.cookTime) parts.push(`Cook ${r.cookTime}`);
  if (r.totalTime && !r.prepTime && !r.cookTime) parts.push(`${r.totalTime} total`);
  return parts.join('. ') + (parts.length ? '.' : '');
}

async function saveRecipe(recipe) {
  recipe.updatedAt = Date.now();
  await db.putRecipe(recipe);
  const i = state.recipes.findIndex(r => r.id === recipe.id);
  if (i >= 0) state.recipes[i] = recipe; else state.recipes.push(recipe);
}

async function saveGrocery() {
  await db.set('grocery', state.grocery);
  updateListCount();
}

function saveSettings() { return db.set('settings', state.settings); }

function updateListCount() {
  const n = state.grocery.filter(i => !i.checked).length;
  const el = document.getElementById('listCount');
  el.textContent = n;
  el.hidden = n === 0;
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }
}

async function shareText(text) {
  if (navigator.share) {
    try { await navigator.share({ text }); return 'shared'; }
    catch (err) { if (err && err.name === 'AbortError') return 'cancelled'; }
  }
  return (await copyText(text)) ? 'copied' : 'failed';
}

// ---------- screen wake lock (keep the screen on while cooking) ----------

let wakeLock = null;
let wantWake = false;
async function setWakeLock(on) {
  wantWake = on;
  try {
    if (on && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!on && wakeLock) {
      await wakeLock.release(); wakeLock = null;
    }
    return true;
  } catch { wantWake = false; return false; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && wantWake && !wakeLock) setWakeLock(true);
});

// ---------- iOS keyboard ----------
// In iOS 26, closing the keyboard can leave the page shifted: the tab bar and buttons look
// right but taps land in the wrong place. Nudging the scroll position makes WebKit
// re-sync the viewport. Runs once the keyboard has finished closing.
const TYPING = 'input:not([type=checkbox]):not([type=radio]):not([type=file]), textarea, select, [contenteditable]';
function settleViewport() {
  const vv = window.visualViewport;
  if (!vv || (vv.offsetTop < 1 && window.innerHeight - vv.height < 1)) return;
  if (vv.scale > 1.01) return; // pinch-zoomed on purpose
  const x = window.scrollX, y = window.scrollY;
  window.scrollTo(x, y + 1);
  window.scrollTo(x, y);
}
let settleTimer;
function settleSoon() {
  clearTimeout(settleTimer);
  settleTimer = setTimeout(() => {
    const a = document.activeElement;
    if (a && a.matches && a.matches(TYPING)) return; // moved on to another field
    settleViewport();
  }, 400);
}
document.addEventListener('focusout', e => { if (e.target.matches && e.target.matches(TYPING)) settleSoon(); });
window.visualViewport?.addEventListener('resize', settleSoon);

// ---------- pinned theme band ----------
// Once a screen's header scrolls away, a slim band of the theme's pattern and trim stays
// pinned at the top (no text, no buttons). It also tells iOS which color to paint behind
// the clock, so that strip always matches the header of the screen you're on.
const pinband = document.getElementById('pinband');
function updatePin() {
  const root = document.documentElement;
  const head = view.querySelector('.band');
  const home = !head || head.classList.contains('band-home');
  if (root.dataset.view !== (home ? 'home' : 'page')) {
    root.dataset.view = home ? 'home' : 'page';
    window.rbPaintBars();
  }
  root.classList.toggle('pinned', !!head && head.getBoundingClientRect().bottom <= pinband.offsetHeight + 1);
}
new MutationObserver(updatePin).observe(view, { childList: true });
window.addEventListener('scroll', updatePin, { passive: true });
window.addEventListener('resize', updatePin);
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => window.rbPaintBars());

// ---------- routing ----------

function route() {
  const [name, id] = location.hash.replace(/^#\/?/, '').split('/');
  return { name: name || 'home', id: id ? decodeURIComponent(id) : null };
}

function render() {
  try { renderScreen(); } catch (err) {
    // Never leave a half-drawn screen behind: show a way out instead.
    console.error(err);
    view.innerHTML = `
      ${band(`<div class="band-bar"><a class="back" href="#/">Recipes</a></div><h1 class="sign">Something went wrong</h1>`)}
      <section class="card sec">
        <p>This screen couldn't open. Your saved recipes are safe.</p>
        <a class="btn btn-primary" href="#/">Back to recipes</a>
      </section>`;
  }
}

function renderScreen() {
  if (wantWake) setWakeLock(false);
  // Leaving a screen closes anything layered over it.
  for (const id of ['sheet', 'photoViewer']) { const d = document.getElementById(id); if (d && d.open) d.close(); }
  const r = route();
  const tab = { home: 'home', recipe: 'home', settings: 'home', edit: 'new', new: 'new', list: 'list' }[r.name] || 'home';
  document.querySelectorAll('.tab').forEach(t => {
    if (t.dataset.tab === tab) t.setAttribute('aria-current', 'page');
    else t.removeAttribute('aria-current');
  });
  document.body.dataset.view = r.name;

  switch (r.name) {
    case 'home': renderHome(); break;
    case 'recipe': state.recipeTab = { id: r.id, tab: 'recipe' }; renderRecipe(r.id); break; // opening a recipe starts on the recipe itself
    case 'new': renderForm(null); break;
    case 'edit': renderForm(r.id); break;
    case 'list': renderList(); break;
    case 'settings': renderSettings(); break;
    default: location.replace('#/'); return;
  }
  window.scrollTo(0, 0);
  view.focus({ preventScroll: true });
}

function notFound() {
  view.innerHTML = `
    ${band(`<div class="band-bar"><a class="back" href="#/">Recipes</a></div><h1 class="sign">Not on the menu</h1>`)}
    <section class="card sec">
      <p>That recipe may have been deleted.</p>
      <a class="btn btn-primary" href="#/">Back to recipes</a>
    </section>`;
}

// Full-width aqua header band with the checkerboard trim below it.
function band(inner, cls = '') {

}

function filteredRecipes() {
  const q = state.filter.q.trim().toLowerCase();
  const list = state.recipes.filter(r => {
    const cat = state.filter.cat;
    if (cat === 'fav' && !r.favorite) return false;
    if (cat.startsWith('diet:') && !(r.diet || {})[cat.slice(5)]) return false;
    if (!['all', 'fav'].includes(cat) && !cat.startsWith('diet:') && r.category !== cat) return false;
    if (!q) return true;
    const hay = [r.title, r.category, r.source, r.sourceSite, r.notes, ...(r.ingredients || [])].join(' ').toLowerCase();
    return q.split(/\s+/).every(word => hay.includes(word));
  });
  const by = {
    newest: (a, b) => b.createdAt - a.createdAt,
    az: (a, b) => a.title.localeCompare(b.title),
    rating: (a, b) => (b.rating || 0) - (a.rating || 0) || a.title.localeCompare(b.title),
    made: (a, b) => (b.timesMade || 0) - (a.timesMade || 0) || a.title.localeCompare(b.title),
  }[state.filter.sort];
  return list.sort(by);
}

function tocRow(r) {
  const sub = [metaSentence(r).replace(/\.$/, ''), r.timesMade ? `made ${plural(r.timesMade, 'time')}` : ''].filter(Boolean).join(', ');
  return `
    <li>
      <a class="toc-row" href="#/recipe/${encodeURIComponent(r.id)}">

          <span class="toc-title">${esc(r.title)}${r.favorite ? ' <span class="fav-mark" aria-label="Favorite">♥</span>' : ''}</span>
          <span class="toc-leader" aria-hidden="true"></span>
          <span class="toc-meta">${r.rating ? starsText(r.rating) : '<span class="new-tag">new</span>'}</span>
        </span>
        ${sub || dietBadges(r).length ? `<span class="toc-sub">${esc(sub)}${dietBadges(r).map(b => ' ' + dietBadge(b, 'diet-tag')).join('')}</span>` : ''}
      </a>
      ${!CATEGORIES.includes(r.category) ? `
        <label class="quick-cat">
          <span class="sr-only">Section for ${esc(r.title)}</span>
          <select data-category-for="${esc(r.id)}">
            <option value="">Choose a section</option>
            ${CATEGORIES.map(c => `<option>${esc(c)}</option>`).join('')}
          </select>
        </label>` : ''}
    </li>`;
}

function renderContents() {
  const box = document.getElementById('contents');
  const count = document.getElementById('bookCount');
  if (!box) return;
  count.textContent = state.recipes.length ? `${plural(state.recipes.length, 'recipe')} on the menu` : 'Your menu is empty';

  if (!state.recipes.length) {
    box.innerHTML = `
      <section class="card sec empty">
        <h2 class="sec-title">Nothing on the menu yet</h2>
        <p>Photograph a recipe card or cookbook page, or take screenshots of a recipe app, and Recipe Box will copy out the ingredients and steps.</p>
        <a class="btn btn-primary" href="#/new">Add your first recipe</a>
      </section>`;
    return;
  }
  const list = filteredRecipes();
  if (!list.length) {
    box.innerHTML = `
      <section class="card sec empty">
        <p>No recipes match${state.filter.q ? ` “${esc(state.filter.q)}”` : ' this filter'}.</p>
        <button class="btn btn-secondary" data-action="clear-filters">Show all recipes</button>
      </section>`;
    return;
  }
  // Searching shows one flat list; otherwise the menu is grouped into sections.
  if (state.filter.q.trim()) {
    box.innerHTML = `<section class="card menu"><h2 class="menu-title">${plural(list.length, 'match', 'matches')}</h2><ol class="toc">${list.map(tocRow).join('')}</ol></section>`;
    return;
  }
  const groups = new Map();
  for (const r of list) {
    const key = CATEGORIES.includes(r.category) ? r.category : 'Uncategorized';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  }
  const order = [...CATEGORIES, 'Uncategorized'].filter(c => groups.has(c));
  box.innerHTML = `<div class="card menu">${order.map(c => `
    <section>
      <div class="menu-head">
        <h2 class="menu-title">${esc(c)}</h2>
        ${c === 'Uncategorized' && groups.get(c).some(r => guessCategory(r)) ? '<button class="btn btn-chip" data-action="auto-sort">Sort these for me</button>' : ''}
      </div>
      <ol class="toc">${groups.get(c).map(tocRow).join('')}</ol>
    </section>`).join('')}</div>`;
}

          </label>`).join('')}
        <button class="sheet-item" data-sheet-action="share">Share recipe</button>
        ${(r.images || []).length ? `<button class="sheet-item" data-sheet-action="scans">View scanned pages (${r.images.length})</button>` : ''}
        <button class="sheet-item danger" data-sheet-action="delete">Delete recipe</button>
      </div>
      <button class="btn btn-secondary btn-wide" data-close>Done</button>
    </div>`;
  sheet.showModal();
}

function ingredientRow(ing, i, factor, view = 0) {
  const { qty, alt, item, header, convertible } = displayIngredient(ing, factor, view);
  if (header) return `<li class="ing-head" role="presentation"><h3>${esc(item)}</h3></li>`;
  const amount = `<span class="ing-qty-main">${esc(qty)}</span>${alt ? `<span class="ing-alt">${esc(alt)}</span>` : ''}`;
  return `<li class="ing-row" data-index="${i}">
    ${convertible
      ? `<button class="ing-qty convertible" data-action="convert" data-index="${i}" aria-label="${esc(qty)}${alt ? `, or ${esc(alt)}` : ''}. Switch units">${amount}</button>`
      : `<span class="ing-qty">${amount}</span>`}
    <button class="ing" data-action="tick" data-index="${i}" aria-pressed="false"><span class="ing-item">${esc(item)}</span></button>
  </li>`;
}

function recipeToText(r, factor = 1) {
  const out = [r.title];
  const meta = metaSentence(r);
  if (meta) out.push(meta);
  if (r.source) out.push(`From ${r.source}`);
  if (r.ingredients.length) out.push('', 'Ingredients', ...r.ingredients.map(i => (isHeader(i) ? `${i.slice(HEADER_MARK.length)}:` : `- ${scaleIngredient(i, factor)}`)));
  if (r.steps.length) out.push('', 'Method', ...r.steps.map((s, i) => `${i + 1}. ${s}`));
  if (r.notes) out.push('', 'Notes', r.notes);
  return out.join('\n');
}

// ---------- add / edit form ----------

function rowLabel(kind, index, header) {
  return header ? 'Section heading' : kind === 'step' ? `Step ${index + 1}` : `Ingredient ${index + 1}`;
}

let doubtSeq = 0;
// "Not sure about “1hr”" — the note behind the mustard dot.
function doubtNote(words, cls) {
  const id = `doubt-${++doubtSeq}`;
  const list = words.map(w => `<b>${esc(w)}</b>`);
  const joined = list.length > 1 ? `${list.slice(0, -1).join(', ')} and ${list[list.length - 1]}` : list[0];
  return { id, html: `<p class="doubt ${cls}" id="${id}">The scan wasn't sure about ${joined}.</p>` };
}

function editRow(kind, value, index, flag = '', doubt = null) {
  const header = kind === 'ingredient' && isHeader(value);
  const text = header ? value.slice(HEADER_MARK.length) : value;
  const label = rowLabel(kind, index, header);
  const placeholder = header ? 'Section name, e.g. For the sauce' : kind === 'step' ? 'Describe this step' : 'e.g. 1 cup flour';
  const note = doubt && doubt.length ? doubtNote(doubt, 'row-doubt') : null;
  return `
    <li class="edit-row${header ? ' is-header' : ''}${flag ? ' needs-check' : ''}${note ? ' unsure' : ''}" data-kind="${kind}"${header ? ' data-header' : ''}>
      <button type="button" class="grip" data-grip aria-label="Move ${label}. Drag, or use the arrow keys.">${ICONS.grip}</button>
      ${kind === 'step' ? `<span class="row-num" aria-hidden="true">${index + 1}</span>` : ''}
      <textarea class="row-input" rows="${kind === 'step' ? 3 : 1}" aria-label="${label}"${note ? ` aria-describedby="${note.id}"` : ''} enterkeyhint="next" placeholder="${placeholder}">${esc(text)}</textarea>
      <button type="button" class="row-remove" data-action="row-remove" aria-label="Remove ${label}">${ICONS.remove}</button>
      ${flag ? `<p class="row-flag">${esc(flag)}</p>` : ''}
      ${note ? note.html : ''}
    </li>`;
}

function editList(kind, values, flags = {}, doubts = {}) {
  const items = values.length ? values : [''];
  return items.map((v, i) => editRow(kind, v, i, flags[i] || '', doubts[i])).join('');
}
