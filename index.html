  <script type="module">
// ================================================================
// Install manifest (generated here so everything lives in one file)
// ================================================================

// Skipped when the page has no web address (e.g. opened in a file preview).
(() => {
  if (!/^https?:$/.test(location.protocol)) return;
  let base;
  try { base = new URL('./', location.href).href; } catch { return; }
  const manifest = {
    name: 'Recipe Box', short_name: 'Recipe Box',
    description: 'Scan, keep and cook from your recipes.',
    start_url: base, scope: base, display: 'standalone', orientation: 'portrait',
    background_color: '#FFF8EC', theme_color: '#8FD3CC',
    icons: [
      { src: base + 'icons/icon-192.png', sizes: '192x192', type: 'image/png', purpose: 'any' },
      { src: base + 'icons/icon-512.png', sizes: '512x512', type: 'image/png', purpose: 'any' },
      { src: base + 'icons/icon-maskable-512.png', sizes: '512x512', type: 'image/png', purpose: 'maskable' },
    ],
  };
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
  document.head.appendChild(link);
})();

// ================================================================
// Storage (IndexedDB)
// ================================================================

// Small promise wrapper around IndexedDB.
// IndexedDB is used instead of localStorage because recipe photos are large.

const DB_NAME = 'recipe-box';
const DB_VERSION = 1;
let dbPromise;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains('recipes')) db.createObjectStore('recipes', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => { dbPromise = null; reject(req.error); };
  });
  return dbPromise;
}

async function run(storeName, mode, fn) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(storeName, mode);
    const store = tx.objectStore(storeName);
    let result;
    const req = fn(store);
    if (req) req.onsuccess = () => { result = req.result; };
    tx.oncomplete = () => resolve(result);
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('Storage transaction aborted'));
  });
}

const idb = {
  allRecipes: () => run('recipes', 'readonly', s => s.getAll()),
  getRecipe: id => run('recipes', 'readonly', s => s.get(id)),
  putRecipe: recipe => run('recipes', 'readwrite', s => s.put(recipe)),
  deleteRecipe: id => run('recipes', 'readwrite', s => s.delete(id)),
  clearRecipes: () => run('recipes', 'readwrite', s => s.clear()),
  putManyRecipes: recipes => run('recipes', 'readwrite', s => { recipes.forEach(r => s.put(r)); }),
  get: key => run('kv', 'readonly', s => s.get(key)),
  set: (key, value) => run('kv', 'readwrite', s => s.put(value, key)),
};

// Fallback when saved storage is blocked (file previews, some private modes):
// everything works for the session but nothing survives a reload.
const memRecipes = new Map(), memKV = new Map();
const mem = {
  allRecipes: async () => [...memRecipes.values()],
  getRecipe: async id => memRecipes.get(id),
  putRecipe: async r => { memRecipes.set(r.id, r); },
  deleteRecipe: async id => { memRecipes.delete(id); },
  clearRecipes: async () => { memRecipes.clear(); },
  putManyRecipes: async rs => { rs.forEach(r => memRecipes.set(r.id, r)); },
  get: async k => memKV.get(k),
  set: async (k, v) => { memKV.set(k, v); },
};

let backend = null;
async function pick() {
  if (backend) return backend;
  try {
    if (!('indexedDB' in window) || !window.indexedDB) throw new Error('no IndexedDB');
    await Promise.race([openDB(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 3000))]);
    backend = idb;
  } catch {
    backend = mem;
    db.memoryOnly = true;
  }
  return backend;
}

const db = { memoryOnly: false };
for (const name of Object.keys(idb)) db[name] = async (...args) => (await pick())[name](...args);

// Ask the browser not to evict our data when storage runs low.
async function requestPersistence() {
  try {
    if (navigator.storage && navigator.storage.persist && !(await navigator.storage.persisted())) {
      await navigator.storage.persist();
    }
  } catch { /* not supported; fine */ }
}

// ================================================================
// Recipe text parser, scaling, grocery aisles
// ================================================================

// Turns OCR text from a recipe photo into structured fields.
// Heuristic by design: it gets the structure mostly right, then the
// person tidies up the result in the form before saving.

const FRACTIONS = {
  '½': 1 / 2, '⅓': 1 / 3, '⅔': 2 / 3, '¼': 1 / 4, '¾': 3 / 4,
  '⅕': 1 / 5, '⅖': 2 / 5, '⅗': 3 / 5, '⅘': 4 / 5, '⅙': 1 / 6, '⅚': 5 / 6,
  '⅛': 1 / 8, '⅜': 3 / 8, '⅝': 5 / 8, '⅞': 7 / 8,
};
const FRAC = Object.keys(FRACTIONS).join('');

const UNIT_WORDS = [
  'cups?', 'c', 'tablespoons?', 'tbsps?', 'tbs', 'tbl', 'teaspoons?', 'tsps?',
  'ounces?', 'oz', 'pounds?', 'lbs?', 'grams?', 'g', 'kilograms?', 'kgs?', 'ml', 'milliliters?',
  'liters?', 'litres?', 'pints?', 'pts?', 'quarts?', 'qts?', 'gallons?', 'gal',
  'cans?', 'packages?', 'pkgs?', 'pkg', 'sticks?', 'cloves?', 'pinch(?:es)?', 'dash(?:es)?',
  'slices?', 'pieces?', 'bunch(?:es)?', 'heads?', 'sprigs?', 'stalks?', 'jars?', 'bottles?',
  'envelopes?', 'boxes?', 'bags?', 'handfuls?', 'large', 'medium', 'small', 'whole', 'eggs?',
];
const UNIT_RE = new RegExp(`\\b(?:${UNIT_WORDS.join('|')})\\.?(?=[\\s,)]|$)`, 'i');

const NUM = `(?:\\d+\\s+\\d+\\s*\\/\\s*\\d+|\\d+\\s*\\/\\s*\\d+|\\d+(?:[.,]\\d+)?\\s*[${FRAC}]?|[${FRAC}])`;
const QTY_RE = new RegExp(`^(${NUM})(\\s*(?:-|–|to)\\s*(${NUM}))?`);
const QTY_START = new RegExp(
  `^(?:\\d|[${FRAC}]|(?:a|an|one|two|three|four|five|six|eight|twelve|half|a few|few|several)\\s|pinch|dash|salt\\b|pepper\\b|juice of|zest of)`, 'i');

const HEADINGS = {
  ingredients: /^(?:ingredients?|you(?:'| wi)?ll need|what you(?:'ll)? need|shopping list)\b/i,
  steps: /^(?:directions?|instructions?|method|preparation|procedure|steps|how to make(?: it)?|to make|to prepare)\b/i,
  notes: /^(?:notes?|tips?|variations?|cook'?s notes?|to serve|storage)\b/i,
};

const STEP_VERBS = /^(?:preheat|heat|mix|combine|stir|add|bake|beat|whisk|pour|place|cook|simmer|boil|bring|remove|let|serve|cover|chill|refrigerate|fold|cream|sift|blend|spread|sprinkle|roll|cut|chop|slice|dice|mince|melt|grease|line|transfer|season|drain|toss|top|garnish|put|set|turn|reduce|saut[eé]|fry|roast|grill|broil|knead|divide|shape|brush|arrange|repeat|cool|allow|meanwhile|when|once|while|after|then|until|return|wash|peel|mash|puree|purée|process|pulse|measure|prepare|make|start|in a|in the|using|on a|spoon|scoop|press|dissolve|soak|marinate|rinse|pat|stuff|wrap|freeze|thaw|squeeze|crack|separate|layer|insert|check|enjoy|store|toast|microwave|blanch|steam|poach|caramelize|deglaze|strain|whip|dust|chop)\b/i;

const NUMBER_MARKER = /^(?:step\s*)?(\d{1,2})\s*[.):]\s+(?=\S)/i;
// "STEP 1" or "1." alone on a line, with the text on the following lines.
const STEP_ONLY = /^(?:(?:step|stage)\s*(\d{1,2})\s*[.:)]?|(\d{1,2})\s*[.)])$/i;

// ---------- cleaning ----------

function cleanLine(raw) {
  let s = raw
    .replace(/[\u2018\u2019]/g, "'")
    .replace(/[\u201C\u201D]/g, '"')
    .replace(/[|¦]/g, 'l')
    .replace(/\s+/g, ' ')
    .trim();
  // Drop bullet characters OCR picks up (including bullets misread as o, e, « or »).
  s = s.replace(/^[•·●○◦▪■□☐❑*>~_\-–—]+\s*/, '');
  s = s.replace(new RegExp(`^[oeO«»©®]\\s+(?=[\\d${FRAC}A-Z])`), '');
  // "1 / 2" -> "1/2"
  s = s.replace(/(\d)\s*\/\s*(\d)/g, '$1/$2');
  return s.trim();
}

function isNoise(s) {
  if (!s) return true;
  const alnum = (s.match(/[a-z0-9½¼¾⅓⅔⅛]/gi) || []).length;
  return alnum < 2 || alnum / s.length < 0.45;
}

function titleCase(s) {
  if (s !== s.toUpperCase()) return s;
  const small = new Set(['a', 'an', 'and', 'as', 'at', 'for', 'in', 'of', 'on', 'or', 'the', 'to', 'with']);
  return s.toLowerCase().split(' ').map((w, i) =>
    (i > 0 && small.has(w)) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

// ---------- classification ----------

function headingOf(s) {
  const plain = s.replace(/[:.\-–—]+$/, '').trim();
  for (const [kind, re] of Object.entries(HEADINGS)) {
    if (re.test(plain) && (plain.length < 32 || /:/.test(s))) {
      // Allow "Directions: Preheat the oven..." on one line.
      const after = s.includes(':') ? s.slice(s.indexOf(':') + 1).trim() : '';
      return { kind, rest: after.length > 3 ? after : '' };
    }
  }
  return null;
}

function looksLikeIngredient(s) {
  if (s.length > 80) return false;
  if (NUMBER_MARKER.test(s) && STEP_VERBS.test(s.replace(NUMBER_MARKER, ''))) return false;
  if (QTY_START.test(s)) return true;
  return UNIT_RE.test(s) && s.length < 50;
}

function looksLikeStep(s) {
  if (STEP_ONLY.test(s)) return true;
  if (NUMBER_MARKER.test(s)) {
    const body = s.replace(NUMBER_MARKER, '');
    return !QTY_START.test(body) || STEP_VERBS.test(body);
  }
  if (STEP_VERBS.test(s) && s.length > 18) return true;
  return s.length > 70 && /[.!]/.test(s);
}

const TIME = `((?:about\\s+)?[\\d½¼¾]+(?:\\s*(?:-|–|to)\\s*\\d+)?\\s*(?:min(?:ute)?s?|hours?|hrs?|h)\\.?(?:\\s*\\d+\\s*(?:min(?:ute)?s?))?)`;
const META = {
  servings: /\b(?:serves|servings?|yields?|makes)\b\s*:?\s*(?:about\s+)?([\d½¼¾⅓⅔]+(?:\s*(?:-|–|to)\s*\d+)?(?:\s+(?!prep|cook|bake|total|time|ready)[a-z]+)?)/i,
  prepTime: new RegExp(`\\bprep(?:aration)?(?:\\s*time\\s*:?|\\s*:|\\s+(?=\\d))\\s*${TIME}`, 'i'),
  cookTime: new RegExp(`\\b(?:cook(?:ing)?|bake|baking)(?:\\s*time\\s*:?|\\s*:)\\s*${TIME}`, 'i'),
  source: /\b(?:from the kitchen of|recipe from|from)\s*:\s*(.+)$/i,
};
const SERVINGS_LINE = /^((?:about\s+)?[\d½¼¾]+(?:\s*(?:-|–|to)\s*\d+)?)\s+(?:servings?|portions?|people)\b/i;
// App/website labels that aren't part of the recipe.
const UI_LINE = /^(?:(?:yield|scale|convert|servings|print|share|save|rate|\d?x|ix|ixv)\s*)+$/i;
// "Bake 30 min" alone on a short line is metadata; inside a sentence it's a step.
const LOOSE_COOK = new RegExp(`^(?:cook|bake)\\s+${TIME}$`, 'i');

// ---------- main entry ----------

/**
 * @param {string} rawText  full OCR text (pages separated by blank lines)
 * @param {Array<{text:string,height:number}>} [ocrLines] lines with text height, used to find the title
 */
function parseRecipeText(rawText, ocrLines = [], titleHint = '', extra = {}) {
  const out = { title: '', servings: '', prepTime: '', cookTime: '', source: extra.sourceHint || '', ingredients: [], steps: [], notes: '', issues: [] };

  // Keep blank lines as paragraph breaks (null entries).
  let lines = [];
  for (const raw of rawText.split(/\r?\n/)) {
    const s = cleanLine(raw);
    if (!s || isNoise(s)) { if (lines.length && lines[lines.length - 1] !== null) lines.push(null); continue; }
    lines.push(s);
  }

  // Pull out metadata lines (serves, times, source) wherever they appear.
  lines = lines.filter(s => {
    if (s === null) return true;
    if (UI_LINE.test(s)) return false;
    const by = s.match(/^[Bb][Yy]\s+([A-Z][\w.'’-]+(?:\s+[A-Z][\w.'’-]+){0,3})\s*$/);
    if (by) { if (!out.source) out.source = by[1]; return false; }
    if (/\bprep\b/i.test(s) && !out.cookTime) {
      const c = s.match(/\bcook\s*:?\s*(\d+\s*(?:-|–|to)?\s*\d*\s*(?:min(?:ute)?s?|hours?|hrs?)\.?)/i);
      if (c) out.cookTime = c[1].trim();
    }
    // "4 servings" (number first) is checked before "Servings 4" so "4 servings 1x" reads as 4.
    const sv = !out.servings && s.match(SERVINGS_LINE);
    if (sv && s.length < 30) { out.servings = sv[1]; return false; }
    let matched = false;
    for (const [key, re] of Object.entries(META)) {
      const m = s.match(re);
      if (m && !out[key]) { out[key] = m[1].trim().replace(/\.$/, ''); matched = true; }
    }
    const loose = !out.cookTime && s.match(LOOSE_COOK);
    if (loose) { out.cookTime = loose[1].trim(); return false; }
    // Only drop the line if it's mostly metadata, not a step that mentions baking time.
    return !(matched && s.length < 60 && !looksLikeStep(s));
  });

  // A title found elsewhere (e.g. an app's title bar): use it and drop repeats of it.
  if (titleHint) {
    out.title = titleHint;
    const t = titleHint.toLowerCase().replace(/[^a-z0-9]/g, '');
    lines = lines.filter(s => s === null || s.toLowerCase().replace(/[^a-z0-9]/g, '') !== t);
  }

  // Recipe card templates: "Recipe for: Apple Pie", a lone "Recipe" header.
  lines = lines.filter(s => s === null || !/^recipes?:?$/i.test(s));
  for (let i = 0; i < lines.length && !out.title; i++) {
    const m = lines[i] && lines[i].match(/^recipe(?:\s+for)?\s*:?\s+(.{3,})$/i);
    if (m) { out.title = m[1].trim(); lines.splice(i, 1); break; }
  }

  // Social captions often open with the name in capitals, then the description.
  if (!out.title) {
    const first = lines.findIndex(Boolean);
    if (first >= 0 && !headingOf(lines[first])) {
      const two = [lines[first], lines[first + 1]].filter(Boolean).join(' ');
      const m = two.match(/^([A-Z0-9][A-Z0-9 &'’,-]{5,}[A-Z0-9])(?=[^A-Za-z0-9]|\s+[a-z]|$)/);
      if (m && (m[1].match(/[A-Z]{2,}/g) || []).length >= 2) {
        out.title = m[1];
        const rest = two.slice(m[1].length).replace(/^[^A-Za-z(]+/, '');
        const usedSecond = m[1].length > lines[first].length;
        lines.splice(first, usedSecond ? 2 : 1, ...(rest ? [rest.charAt(0).toUpperCase() + rest.slice(1)] : []));
      }
    }
  }

  // Title: tallest text near the top if we have sizes; otherwise the first plausible line.
  if (!out.title) {
    const firstHeading = lines.findIndex(s => s && headingOf(s));
    const topZone = lines.slice(0, firstHeading > 0 ? Math.min(firstHeading, 6) : 6).filter(Boolean);
    const candidates = topZone.filter(s => /[a-z]{3}/i.test(s) && s.length <= 60 && !/^[a-z]/.test(s)
      && s.split(/\s+/).length <= 9 && !/[.!?,]$/.test(s) && !looksLikeIngredient(s) && !looksLikeStep(s));
    let pick = candidates[0] || '';
    if (ocrLines.length && candidates.length > 1) {
      let best = 0;
      for (const c of candidates) {
        const match = ocrLines.find(l => cleanLine(l.text) === c);
        if (match && match.height > best) { best = match.height; pick = c; }
      }
    }
    if (pick) {
      out.title = pick;
      lines.splice(lines.indexOf(pick), 1);
    }
  }
  out.title = titleCase(out.title.replace(/[:.]+$/, ''));
  if (out.title) {
    const t = out.title.toLowerCase().replace(/[^a-z0-9]/g, '');
    lines = lines.filter(s => { if (s === null) return true; const k = s.toLowerCase().replace(/[^a-z0-9]/g, ''); return !(k.length >= 4 && t.includes(k)); });
  }

  // Split into sections by headings.
  const sections = { intro: [], ingredients: [], steps: [], notes: [] };
  let current = 'intro';
  let sawHeading = { ingredients: false, steps: false };
  for (const s of lines) {
    if (s === null) { sections[current].push(null); continue; }
    const h = headingOf(s);
    if (h) {
      current = h.kind;
      if (h.kind in sawHeading) sawHeading[h.kind] = true;
      if (h.rest) sections[current].push(h.rest);
      continue;
    }
    sections[current].push(s);
  }

  let ingLines = [], stepLines = [], noteLines = [...sections.notes];

  if (sawHeading.ingredients && sawHeading.steps) {
    ingLines = sections.ingredients;
    stepLines = sections.steps;
    noteLines = [...sections.intro, ...noteLines];
  } else {
    // Missing one or both headings: walk the unlabeled text and find where steps begin.
    const pool = sawHeading.ingredients ? sections.ingredients
      : sawHeading.steps ? sections.intro
      : sections.intro;
    const firstStep = pool.findIndex(s => s && looksLikeStep(s));
    const head = firstStep === -1 ? pool : pool.slice(0, firstStep);
    const tail = firstStep === -1 ? [] : pool.slice(firstStep);

    if (sawHeading.ingredients) {
      noteLines = [...sections.intro, ...noteLines];
      ingLines = head;
      stepLines = tail;
    } else {
      for (const s of head) {
        if (s === null) { ingLines.push(null); continue; }
        (looksLikeIngredient(s) || ingLines.some(Boolean) ? ingLines : noteLines).push(s);
      }
      stepLines = tail;
    }
    if (sawHeading.steps) stepLines = [...stepLines, ...sections.steps];
  }

  out.ingredients = buildIngredients(ingLines);
  out.steps = buildSteps(stepLines);
  out.notes = joinParagraphs(noteLines).map(tidyNote).filter(Boolean).join('\n');
  out.issues = findIssues(out, extra);
  return out;
}

// ---------- section builders ----------

function splitTwoColumn(s) {
  // "2 cups flour 1/2 tsp salt" -> two ingredients (common with two-column cards).
  const re = new RegExp(`\\s(?=${NUM}\\s*(?:${UNIT_WORDS.join('|')})\\.?\\s)`, 'gi');
  const parts = [];
  let last = 0, m;
  while ((m = re.exec(s))) {
    const left = s.slice(last, m.index).trim();
    const leftWords = left.replace(QTY_RE, '').replace(UNIT_RE, '').trim();
    if (/[a-z]{3,}/i.test(leftWords) && !/[(,]$/.test(left) && !/\b(?:or|and|plus|about|to)$/i.test(left)) {
      parts.push(left);
      last = m.index + 1;
    }
  }
  parts.push(s.slice(last).trim());
  return parts.filter(Boolean);
}

const STARTS_NUM = new RegExp(`^[\\d${FRAC}]`);
// "For the sauce:", "For serving: peanuts, green onion", "Sauce:", "FOR THE DRESSING"
const SUBHEAD = /^(?:for (?:the )?([a-z][a-z ]{1,28}?)|([A-Za-z][a-z]+(?: [a-z]+){0,2}))\s*:\s*(.*)$/i;
const SUBHEAD_BARE = /^(?:for (?:the )?[a-z][a-z ]{1,28}|[A-Z]{3,}(?: [A-Z]{3,}){0,2})$/i;
const HEADER_MARK = '# ';
const isHeader = s => typeof s === 'string' && s.startsWith(HEADER_MARK);

function subhead(line) {
  if (QTY_START.test(line) && !/^for\b/i.test(line)) return null;
  const m = line.match(SUBHEAD);
  if (m && (m[1] || /^(?:sauce|dressing|marinade|topping|toppings|filling|glaze|crust|garnish|to serve|for serving|batter|frosting|icing|rub|base|salad|dough)$/i.test(m[2] || ''))) {
    const label = line.slice(0, line.indexOf(':')).trim().toLowerCase();
    return { name: label.charAt(0).toUpperCase() + label.slice(1), rest: m[3].trim() };
  }
  if (SUBHEAD_BARE.test(line) && line.length < 32 && (/^for /i.test(line) || line === line.toUpperCase())) {
    const name = line.toLowerCase().replace(/^\w/, c => c.toUpperCase());
    return { name, rest: '' };
  }
  return null;
}

function splitList(text) {
  // Commas outside parentheses separate items: "peanuts, sliced green onion, chili oil"
  const parts = []; let depth = 0, cur = '';
  for (const ch of text) {
    if (ch === '(') depth++;
    if (ch === ')') depth = Math.max(0, depth - 1);
    if (ch === ',' && depth === 0) { parts.push(cur); cur = ''; } else cur += ch;
  }
  parts.push(cur);
  return parts.map(p => p.replace(/^\s*(?:and|&)\s+/i, '').trim()).filter(Boolean);
}

const CONTINUES = /[,(+&]$|\b(?:or|and|plus|about|to|of|with|if|for|into|in)$/i;

function buildIngredients(lines) {
  const real = lines.filter(Boolean);
  const maxLen = Math.max(0, ...real.map(l => l.length));
  // Blank lines between most items (apps, cookbooks) tell us where each item ends.
  const paras = []; let cur = [];
  for (const s of lines) { if (s === null) { if (cur.length) paras.push(cur); cur = []; } else cur.push(s); }
  if (cur.length) paras.push(cur);
  const paragraphMode = paras.length >= 4 && paras.filter(p => p.length === 1).length >= paras.length * 0.4;

  const items = [];
  let inline = null; // an open "For serving: a, b," list still collecting lines
  const flushInline = () => { if (inline) { items.push(...splitList(inline)); inline = null; } };

  paras.forEach(para => {
    para.forEach((line, li) => {
      const head = subhead(line);
      if (head) {
        flushInline();
        items.push(HEADER_MARK + head.name.replace(/:$/, ''));
        if (head.rest) inline = head.rest;
        return;
      }
      if (inline !== null) {
        if (/^[a-z(]/.test(line) && !STARTS_NUM.test(line) && (CONTINUES.test(inline) || inline.length >= maxLen * 0.6)) {
          inline = joinWrapped(inline, line); return;
        }
        flushInline();
      }
      for (const part of splitTwoColumn(line)) {
        const prev = items.length && !isHeader(items[items.length - 1]) ? items[items.length - 1] : null;
        const lower = /^[a-z(]/.test(part) && !QTY_START.test(part);
        let join = false;
        if (prev) {
          if (paragraphMode && li > 0) join = (lower || CONTINUES.test(prev)) && !STARTS_NUM.test(part);
          else if (CONTINUES.test(prev) && !STARTS_NUM.test(part)) join = true;
          else join = lower && prev.length >= maxLen * 0.75; // a wrapped long line
        }
        if (join) items[items.length - 1] = joinWrapped(prev, part);
        else items.push(part);
      }
    });
  });
  flushInline();
  // Drop a header with nothing under it at the very end.
  while (items.length && isHeader(items[items.length - 1])) items.pop();
  return items.map(i => (isHeader(i) ? i : i.replace(/[;]$/, '').replace(/,$/, '').trim())).filter(i => i && i !== HEADER_MARK.trim());
}

function joinWrapped(a, b) {
  if (/[a-z]-$/i.test(a) && /^[a-z]/.test(b)) return a.slice(0, -1) + b;
  return `${a} ${b}`;
}

function joinParagraphs(lines) {
  const paras = [];
  let cur = '';
  for (const s of lines) {
    if (s === null) { if (cur) paras.push(cur); cur = ''; continue; }
    cur = cur ? joinWrapped(cur, s) : s;
  }
  if (cur) paras.push(cur);
  return paras;
}

let lastStepNumbers = [];
function buildSteps(lines) {
  const real = lines.filter(Boolean);
  lastStepNumbers = real.map(s => (s.match(STEP_ONLY) || s.match(NUMBER_MARKER) || [])).map(m => Number(m[1] || m[2])).filter(n => n > 0);
  const markerOnly = real.filter(s => STEP_ONLY.test(s)).length;
  const inline = real.filter(s => NUMBER_MARKER.test(s)).length;
  let steps = [];
  if (markerOnly >= 2 || inline >= 2) {
    let open = false;
    for (const s of real) {
      if (STEP_ONLY.test(s)) { steps.push(''); open = true; continue; }
      if (NUMBER_MARKER.test(s) && markerOnly < 2) { steps.push(s.replace(NUMBER_MARKER, '')); open = true; continue; }
      if (open && steps.length) steps[steps.length - 1] = steps[steps.length - 1] ? joinWrapped(steps[steps.length - 1], s) : s;
      else steps.push(s);
    }
  } else {
    lastStepNumbers = [];
    steps = splitUnnumbered(lines);
    // One long paragraph: split into sentence groups of a readable size.
    if (steps.length === 1 && steps[0].length > 220) steps = sentenceChunks(steps[0]);
  }
  return steps.map(s => s.trim()).filter(s => s.length > 1);
}

// Unnumbered steps: a new step starts after a blank line, or when the previous
// line ended a sentence and stopped short of the full text width.
function splitUnnumbered(lines) {
  const maxLen = Math.max(0, ...lines.filter(Boolean).map(l => l.length));
  const steps = [];
  let cur = '', prev = '';
  for (const s of lines) {
    // A paragraph break ends a step only once the sentence is finished.
    if (s === null) { if (cur && /[.!?)"”]$/.test(cur)) { steps.push(cur); cur = ''; prev = ''; } continue; }
    const breakHere = cur && /[.!)]$/.test(prev || cur) && /^[A-Z]/.test(s) &&
      (prev.length < maxLen * 0.8 || STEP_VERBS.test(s));
    if (breakHere) { steps.push(cur); cur = s; }
    else cur = cur ? joinWrapped(cur, s) : s;
    prev = s;
  }
  if (cur) steps.push(cur);
  return steps;
}

// Descriptions cut off by "Read more" or the screen edge: keep the complete sentences.
function tidyNote(p) {
  let t = p.replace(/\s*\S?\)?\s*read more\s*$/i, '').trim();
  if (t && !/[.!?)"”]$/.test(t)) {
    const end = Math.max(t.lastIndexOf('. '), t.lastIndexOf('! '), t.lastIndexOf('? '));
    if (end > 20) t = t.slice(0, end + 1);
    else if (/^[a-z]/.test(t)) t = ''; // a fragment from the middle of a cut-off sentence
  }
  return t;
}

// Things the person should check or fill in before saving.
function findIssues(r, extra) {
  const issues = [];
  if (!r.title) issues.push({ field: 'title', message: 'No recipe name was found. Give it a name.' });
  const realIngredients = r.ingredients.filter(i => !isHeader(i));
  if (!realIngredients.length) issues.push({ field: 'ingredients', message: 'No ingredients were found. Add them, or scan the part of the recipe that lists them.' });
  r.ingredients.forEach((ing, i) => {
    if (!isHeader(ing) && /(?:\b(?:or|and|plus|with|of)|[,(+])$/i.test(ing)) issues.push({ field: 'ingredients', index: i, message: `“${ing}” looks cut off.` });
  });
  if (!r.steps.length) issues.push({ field: 'steps', message: 'No steps were found. Add them, or scan the part of the recipe with the method.' });
  const nums = [...new Set(lastStepNumbers)].sort((a, b) => a - b);
  if (nums.length) {
    const missing = [];
    for (let n = 1; n < nums[nums.length - 1]; n++) if (!nums.includes(n)) missing.push(n);
    if (missing.length) issues.push({ field: 'steps', message: `Step${missing.length > 1 ? 's' : ''} ${missing.join(', ')} ${missing.length > 1 ? 'are' : 'is'} missing. Add ${missing.length > 1 ? 'them' : 'it'}, or scan that part of the recipe.` });
  }
  if (r.steps.length) {
    const last = r.steps[r.steps.length - 1];
    if (!/[.!?)"”]$/.test(last)) issues.push({ field: 'steps', index: r.steps.length - 1, message: `Step ${r.steps.length} looks cut off. Finish it, and add any steps after it.` });
  }
  if (extra.gaps) issues.push({ field: 'steps', message: 'Part of the recipe may be missing between two of your photos. Check where they meet.' });
  return issues;
}

function sentenceChunks(text) {
  const sentences = text.match(/[^.!?]+(?:[.!?]+(?=\s|$)|$)/g) || [text];
  const chunks = [];
  let cur = '';
  for (const sent of sentences.map(s => s.trim()).filter(Boolean)) {
    cur = cur ? `${cur} ${sent}` : sent;
    if (cur.length >= 70) { chunks.push(cur); cur = ''; }
  }
  if (cur) {
    if (chunks.length && cur.length < 40) chunks[chunks.length - 1] += ` ${cur}`;
    else chunks.push(cur);
  }
  return chunks;
}

// ---------- quantities & scaling ----------

function toNumber(s) {
  s = s.replace(/\s+/g, ' ').trim().replace(',', '.');
  let m;
  if ((m = s.match(/^(\d+) (\d+)\/(\d+)$/))) return +m[1] + m[2] / m[3];
  if ((m = s.match(/^(\d+)\/(\d+)$/))) return m[1] / m[2];
  if ((m = s.match(new RegExp(`^(\\d+(?:\\.\\d+)?)\\s*([${FRAC}])$`)))) return +m[1] + FRACTIONS[m[2]];
  if (FRACTIONS[s] != null) return FRACTIONS[s];
  return parseFloat(s);
}

const NICE = [[0, ''], [1 / 8, '⅛'], [1 / 4, '¼'], [1 / 3, '⅓'], [3 / 8, '⅜'], [1 / 2, '½'],
  [5 / 8, '⅝'], [2 / 3, '⅔'], [3 / 4, '¾'], [7 / 8, '⅞'], [1, '']];

function formatQuantity(n) {
  if (!isFinite(n) || n <= 0) return '';
  if (n >= 20) return String(Math.round(n));
  let whole = Math.floor(n);
  const frac = n - whole;
  let best = NICE[0], diff = Infinity;
  for (const pair of NICE) {
    const d = Math.abs(pair[0] - frac);
    if (d < diff) { diff = d; best = pair; }
  }
  if (diff > 0.04) return String(Math.round(n * 100) / 100);
  if (best[0] === 1) { whole += 1; return String(whole); }
  if (!best[1]) return String(whole);
  return whole ? `${whole}${best[1]}` : best[1];
}

function scaleIngredient(text, factor) {
  if (factor === 1 || isHeader(text)) return text;
  const m = text.match(QTY_RE);
  if (!m) return text;
  const a = toNumber(m[1]);
  if (!isFinite(a)) return text;
  let qty = formatQuantity(a * factor);
  if (m[3]) {
    const b = toNumber(m[3]);
    if (isFinite(b)) qty += `–${formatQuantity(b * factor)}`;
  }
  const rest = text.slice(m[0].length);
  return qty + (rest.startsWith(' ') || !rest ? '' : ' ') + rest;
}

// Split an ingredient for display: { qty: "¼ cup", item: "all-purpose flour" }.
const DISPLAY_UNITS = new RegExp(`^\\s*(?:${UNIT_WORDS.filter(u => !/^eggs/.test(u)).join('|')})\\.?(?=[\\s/]|$)`, 'i');
// Short forms keep the quantity column narrow: "3 tablespoons" shows as "3 tbsp".
const SHORT_UNITS = [[/^tablespoons?$|^tbsps?\.?$|^tbl$|^tbs$/i, 'tbsp'], [/^teaspoons?$|^tsps?\.?$/i, 'tsp'],
  [/^ounces?$/i, 'oz'], [/^pounds?$|^lbs?\.?$/i, 'lb'], [/^grams?$/i, 'g'], [/^kilograms?$/i, 'kg'],
  [/^milliliters?$/i, 'ml'], [/^liters?$|^litres?$/i, 'l'], [/^packages?$|^pkgs?\.?$/i, 'pkg'], [/^quarts?$/i, 'qt'], [/^pints?$/i, 'pt']];
function shortUnit(u) {
  for (const [re, short] of SHORT_UNITS) if (re.test(u)) return short;
  return u;
}
function displayIngredient(text, factor = 1) {
  if (isHeader(text)) return { qty: '', item: text.slice(HEADER_MARK.length), header: true };
  const m = text.match(QTY_RE);
  if (!m) return { qty: '', item: text };
  const a = toNumber(m[1]);
  if (!isFinite(a)) return { qty: '', item: text };
  let qty = formatQuantity(a * factor);
  if (m[3]) {
    const b = toNumber(m[3]);
    if (isFinite(b)) qty += `–${formatQuantity(b * factor)}`;
  }
  let rest = text.slice(m[0].length);
  const u = rest.match(DISPLAY_UNITS) || rest.match(/^\s*(?:inch(?:es)?|bricks?|knobs?)(?=\s|$)/i);
  if (u) { qty += ` ${shortUnit(u[0].trim())}`; rest = rest.slice(u[0].length); }
  else {
    // "3 garlic cloves, chopped" -> "3 cloves" + "garlic, chopped"
    const c = rest.match(/^\s*((?:[a-z-]+\s+){1,2}?)(cloves?|stalks?|sprigs?)\b(.*)$/i);
    if (c) { qty += ` ${c[2]}`; rest = `${c[1].trim()}${c[3]}`; }
  }
  // "4 cups/32 ounces chicken broth" -> "4 cups" + "chicken broth (32 oz)"
  const alt = rest.match(/^\s*\/\s*([\d.]+\s*[a-z]+)\s+(.*)$/i);
  if (alt) rest = `${alt[2]} (${alt[1].replace(/ounces?/i, 'oz').replace(/pounds?/i, 'lb').replace(/grams?/i, 'g')})`;
  return { qty, item: rest.trim() };
}

// ---------- grocery aisles ----------

const AISLES = ['Produce', 'Meat & seafood', 'Dairy & eggs', 'Bakery', 'Baking', 'Spices', 'Pantry', 'Frozen', 'Other'];

const AISLE_RULES = [
  ['Frozen', /\bfrozen\b|\bice cream\b/],
  ['Baking', /\b(?:flour|sugar|baking (?:powder|soda)|yeast|cocoa|chocolate chips?|chocolate|cornstarch|corn starch|vanilla|extract|shortening|sprinkles|molasses|confectioners|powdered sugar|gelatin|marshmallows?|food coloring|cake mix|pudding mix)\b/],
  ['Spices', /\b(?:salt|pepper flakes|peppercorns?|black pepper|white pepper|cayenne|cinnamon|nutmeg|paprika|cumin|oregano|thyme|dried (?:oregano|basil|thyme|parsley|rosemary|dill|herbs|sage|marjoram)|chili powder|curry|turmeric|ground (?:cinnamon|cumin|ginger|nutmeg|cloves|pepper|mustard|allspice|coriander|cardamom|turmeric)|garlic powder|onion powder|bay lea(?:f|ves)|allspice|seasoning|spices?|italian seasoning|red pepper)\b/],
  ['Produce', /\b(?:bell|green|red|yellow|orange|jalape[nñ]o|poblano|serrano|chile|chili|sweet) peppers?\b/],
  ['Spices', /\bpepper\b/],
  ['Pantry', /\b(?:broth|stock|bouillon|noodles|pasta|spaghetti|macaroni|rice|beans|lentils|peanut butter|sauce|ketchup|mustard|mayo(?:nnaise)?|vinegar|oil|soy|honey|syrup|oats|oatmeal|cereal|crackers|nuts|almonds|pecans|walnuts|raisins|cans?|canned|tomato paste|salsa|jam|jelly|olives|pickles|breadcrumbs|bread crumbs|soup|coconut milk|evaporated|condensed|wine|tortilla chips|chips)\b/],
  ['Dairy & eggs', /\b(?:milk|butter|buttermilk|cheese|cheddar|parmesan|mozzarella|cream|yogurt|yoghurt|eggs?|sour cream|half-and-half|half and half|margarine|ricotta|cottage)\b/],
  ['Meat & seafood', /\b(?:chicken|beef|pork|bacon|sausage|turkey|ham|lamb|fish|salmon|shrimp|tuna|cod|tilapia|steak|ground|meatballs?|chorizo|prosciutto|pepperoni|crab|scallops?|veal|venison)\b/],
  ['Produce', /\b(?:onions?|garlic|potato(?:es)?|tomato(?:es)?|lettuce|carrots?|celery|apples?|bananas?|lemons?|limes?|oranges?|berries|strawberries|blueberries|raspberries|parsley|cilantro|basil|mint|dill|chives|rosemary|spinach|kale|mushrooms?|zucchini|squash|cucumbers?|avocados?|ginger|scallions?|shallots?|leeks?|cabbage|broccoli|cauliflower|corn|peas|green beans|asparagus|beets?|radish(?:es)?|pears?|peaches|grapes|pineapple|mango|melon|cherries|herbs?|fresh|sweet potato(?:es)?|yams?|eggplant|arugula|greens|sprouts|fruit|vegetables?)\b/],
  ['Bakery', /\b(?:bread|buns?|rolls?|tortillas?|pita|bagels?|baguette|croissants?|pie crust|naan|english muffins?)\b/],
];

function aisleFor(text) {
  if (isHeader(text)) return 'Other';
  const t = text.toLowerCase().replace(QTY_RE, '');
  for (const [aisle, re] of AISLE_RULES) if (re.test(t)) return aisle;
  if (/\b(?:tsp|teaspoons?)\b/.test(t)) return 'Spices';
  return 'Other';
}

// Name without the leading quantity, used for sorting.
function ingredientName(text) {
  return text.replace(QTY_RE, '').replace(UNIT_RE, '').replace(/^[\s.,of]+/i, '').trim().toLowerCase();
}

// ---------- recipe sections (categories) ----------

const CATEGORY_RULES = [
  ['Breakfast', /\b(?:pancakes?|waffles?|oatmeal|overnight oats|granola|french toast|omelet(?:te)?|frittata|breakfast|scrambled eggs|crepes?|hash browns?|quiche|shakshuka|smoothie bowl)\b/i],
  ['Desserts', /\b(?:cakes?|cupcakes?|cookies?|brownies?|blondies?|bars|pies?|tarts?|puddings?|ice cream|cobbler|crisp|crumble|cheesecake|fudge|frosting|dessert|tiramisu|mousse|truffles?|sundae)\b/i],
  ['Breads', /\b(?:bread|loaf|focaccia|rolls|biscuits|sourdough|buns|bagels?|baguette|brioche|scones?|muffins?|pizza dough|flatbread|naan)\b/i],
  ['Drinks', /\b(?:smoothie|cocktail|lemonade|latte|punch|margarita|sangria|spritz|mocktail|milkshake|iced tea|hot chocolate)\b/i],
  ['Soups & salads', /\b(?:soup|stew|chowder|bisque|gazpacho|salad|slaw|pho|ramen soup|chili)\b/i],
  ['Appetizers', /\b(?:dip|salsa|guacamole|bruschetta|crostini|appetizers?|hummus|deviled eggs|sliders|nachos|wings|meatballs)\b/i],
  ['Sides', /\b(?:side|roasted (?:vegetables|potatoes|carrots|broccoli)|mashed potatoes|pilaf|green beans|coleslaw|cornbread|fries|risotto)\b/i],
  ['Mains', /\b(?:chicken|beef|pork|lamb|turkey|salmon|shrimp|fish|tofu|steak|pasta|noodles|ramen|spaghetti|lasagna|tacos?|burritos?|curry|stir[- ]fry|casserole|enchiladas|burgers?|risotto|gnocchi|dinner|skillet|one pot|sheet pan)\b/i],
];

/** Best-guess section from the title (strong signal), then ingredients and steps. */
function guessCategory(r) {
  const title = r.title || '';
  for (const [cat, re] of CATEGORY_RULES) if (re.test(title)) return cat;
  const body = [...(r.ingredients || []).filter(i => !isHeader(i)), ...(r.steps || []).slice(0, 2)].join(' ');
  const scores = CATEGORY_RULES.map(([cat, re]) => [cat, (body.match(new RegExp(re.source, 'gi')) || []).length]);
  const mains = scores.find(([c]) => c === 'Mains')[1];
  const best = scores.filter(([c]) => c !== 'Mains').sort((a, b) => b[1] - a[1])[0];
  if (best && best[1] >= 3 && best[1] > mains) return best[0];
  return mains ? 'Mains' : '';
}

// ================================================================
// Scan clean-up: fraction repair, screenshot clutter, overlapping pages
// ================================================================

// Turns raw OCR results from one or more photos/screenshots into clean recipe text.
// Pure functions (no DOM), so they can be tested outside the browser.

// ---------- 1. Fraction repair ----------
// OCR engines misread single-glyph fractions (½ -> "Y%", ¼ -> "Y4", 2¼ -> "2%").
// We find those tokens, split the glyph into numerator / slash / denominator
// by connected components, and read the two small digits on their own.

const GLYPH = {
  '1/2': '½', '1/3': '⅓', '2/3': '⅔', '1/4': '¼', '3/4': '¾', '1/5': '⅕', '2/5': '⅖',
  '3/5': '⅗', '4/5': '⅘', '1/6': '⅙', '5/6': '⅚', '1/8': '⅛', '3/8': '⅜', '5/8': '⅝', '7/8': '⅞',
};

function isSuspectToken(t) {
  if (!t || t.length > 6 || /[A-Za-z]{3}/.test(t)) return false;
  return /^[([]?\d*(?:[%¥Y¢£€§]|V[a-z2-4]|\/\d)[%¥Y¢£€§\w']*[)\],.;]?$/.test(t);
}

function components(ink, w, h) {
  const seen = new Uint8Array(w * h);
  const comps = [];
  const stack = [];
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const start = y * w + x;
      if (!ink[start] || seen[start]) continue;
      seen[start] = 1; stack.push(start);
      const c = { x0: x, x1: x, y0: y, y1: y, n: 0, pts: [] };
      while (stack.length) {
        const p = stack.pop();
        const py = (p / w) | 0, px = p - py * w;
        c.n++; c.pts.push(px, py);
        if (px < c.x0) c.x0 = px; if (px > c.x1) c.x1 = px;
        if (py < c.y0) c.y0 = py; if (py > c.y1) c.y1 = py;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          const nx = px + dx, ny = py + dy;
          if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
          const q = ny * w + nx;
          if (ink[q] && !seen[q]) { seen[q] = 1; stack.push(q); }
        }
      }
      if (c.n > 4) comps.push(c);
    }
  }
  return comps;
}

function isSlash(c, H) {
  const ch = c.y1 - c.y0 + 1, cw = c.x1 - c.x0 + 1;
  if (ch < 0.6 * H || cw < 0.25 * ch || cw > 0.9 * ch) return false;
  let topSum = 0, topN = 0, botSum = 0, botN = 0;
  for (let i = 0; i < c.pts.length; i += 2) {
    const x = c.pts[i], y = c.pts[i + 1];
    if (y < c.y0 + ch * 0.2) { topSum += x; topN++; }
    else if (y > c.y1 - ch * 0.2) { botSum += x; botN++; }
  }
  return topN && botN && (topSum / topN - botSum / botN) > 0.35 * cw;
}

/**
 * Look for a stacked-fraction glyph inside bbox of a grayscale image.
 * Returns the numerator and denominator as { box, pts } in image coordinates, or null.
 */
function findFractionGlyph(gray, W, H, bbox) {
  const x0 = Math.max(0, bbox.x0 - 2), y0 = Math.max(0, bbox.y0 - 2);
  const x1 = Math.min(W - 1, bbox.x1 + 2), y1 = Math.min(H - 1, bbox.y1 + 2);
  const w = x1 - x0 + 1, h = y1 - y0 + 1;
  if (w < 6 || h < 6 || w * h > 40000) return null;
  const ink = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) ink[y * w + x] = gray[(y + y0) * W + (x + x0)] < 140 ? 1 : 0;
  const comps = components(ink, w, h);
  if (comps.length < 3) return null;
  const top = Math.min(...comps.map(c => c.y0)), bottom = Math.max(...comps.map(c => c.y1));
  const Hc = bottom - top + 1;
  const slashes = comps.filter(c => isSlash(c, Hc));
  if (slashes.length !== 1) return null;
  const s = slashes[0];
  const mid = (s.y0 + s.y1) / 2, sx = (s.x0 + s.x1) / 2;
  const others = comps.filter(c => c !== s);
  const tall = others.filter(c => (c.y1 - c.y0 + 1) >= 0.7 * Hc && c.x1 < s.x0);
  const small = others.filter(c => !tall.includes(c));
  const num = small.filter(c => (c.y0 + c.y1) / 2 < mid && (c.x0 + c.x1) / 2 < sx + 2);
  const den = small.filter(c => (c.y0 + c.y1) / 2 > mid && (c.x0 + c.x1) / 2 > sx - 2);
  if (!num.length || !den.length) return null;
  // Each part carries only its own ink pixels, so a neighbouring slash can't leak in.
  const part = cs => {
    const pts = [];
    for (const c of cs) for (let i = 0; i < c.pts.length; i += 2) pts.push(x0 + c.pts[i], y0 + c.pts[i + 1]);
    return {
      x0: x0 + Math.min(...cs.map(c => c.x0)), y0: y0 + Math.min(...cs.map(c => c.y0)),
      x1: x0 + Math.max(...cs.map(c => c.x1)) + 1, y1: y0 + Math.max(...cs.map(c => c.y1)) + 1, pts,
    };
  };
  return { num: part(num), den: part(den), tallCount: tall.length };
}

/**
 * Repair fraction tokens in OCR words, in place.
 * readDigit(part) -> Promise<string> reads one digit drawn from part.pts (x, y pairs).
 */
async function repairFractions(words, gray, W, H, readDigit) {
  for (const word of words) {
    if (!isSuspectToken(word.text)) continue;
    const g = findFractionGlyph(gray, W, H, word.bbox);
    if (!g) continue;
    const n = await readDigit(g.num), d = await readDigit(g.den);
    if (!/^[1-9]$/.test(n) || !/^[1-9]$/.test(d) || Number(n) >= Number(d)) continue;
    const t = word.text;
    const open = /^[([]/.test(t) ? t[0] : '';
    const close = (t.match(/[)\],.;]$/) || [''])[0];
    const lead = t.slice(open.length).match(/^\d+/);
    const tallNeeded = open ? 2 : 1; // an opening paren is also a tall shape
    const whole = lead && g.tallCount >= tallNeeded ? lead[0] : '';
    const frac = GLYPH[`${n}/${d}`] || `${whole ? ' ' : ''}${n}/${d}`;
    word.text = `${open}${whole}${frac}${close}`;
  }
}

// ---------- 2. OCR result -> page of lines ----------

/** Walk tesseract.js blocks (or a flat paragraphs list) into lines with layout info. */
function pageFromOCR(data, width, height) {
  const paragraphs = data.blocks ? data.blocks.flatMap(b => b.paragraphs || []) : (data.paragraphs || []);
  const lines = [];
  for (const p of paragraphs) {
    let first = true;
    for (const l of p.lines || []) {
      let words = (l.words || []).filter(w => w.text && w.text.trim());
      // Drop short junk stuck onto a line from a separate column (like/comment counts, icons).
      words = words.filter((w, i) => {
        const gapBefore = i > 0 ? w.bbox.x0 - words[i - 1].bbox.x1 : 0;
        const junk = !/[A-Za-z]{3}/.test(w.text) && w.text.length <= 6;
        return !(junk && (gapBefore > width * 0.06 || w.bbox.x0 > width * 0.86));
      });
      const text = words.map(w => w.text).join(' ').replace(/\s+/g, ' ').trim();
      if (!text) continue;
      const conf = words.reduce((a, w) => a + (w.confidence ?? 100), 0) / words.length;
      lines.push({ text, y0: l.bbox.y0, y1: l.bbox.y1, height: l.bbox.y1 - l.bbox.y0, conf, brk: first });
      first = false;
    }
  }
  // Drop garbage: very low confidence, or squashed lines (e.g. the edge of a photo).
  const heights = lines.map(l => l.height).sort((a, b) => a - b);
  const median = heights[heights.length >> 1] || 0;
  const kept = lines.filter(l => l.conf >= 35 && !(l.height < median * 0.6 && l.conf < 70)
    && !(l.conf < 75 && !/[A-Za-z]{4}/.test(l.text))); // shaky read with no real words: "mo are ee. a"
  kept.forEach((l, i) => { if (i && !l.brk && !lines.includes(kept[i - 1])) l.brk = true; });
  return { width, height, lines: kept };
}

// ---------- 3. Assemble pages ----------

const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');

function similar(a, b) {
  const x = norm(a), y = norm(b);
  if (!x || !y) return false;
  if (x === y) return true;
  if (Math.min(x.length, y.length) < 12) return false;
  if (Math.abs(x.length - y.length) > Math.max(x.length, y.length) * 0.2) return false;
  return 1 - levenshtein(x, y) / Math.max(x.length, y.length) >= 0.85;
}

// For pinned elements read slightly differently on each screenshot ("TX" vs "™").
function looselySame(x, y) {
  if (Math.min(x.length, y.length) < 6) return false;
  return 1 - levenshtein(x, y) / Math.max(x.length, y.length) >= 0.75;
}

function levenshtein(a, b) {
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[b.length];
}

const STATUS_BAR = /\b\d{1,2}:\d{2}\b|\b(?:5G|LTE|4G|3G)\b/i;
const TAB_WORDS = /^(?:(?:home|search|recent|saved|profile|account|recipe box|recipes|inspiration|explore|library|settings|more|shop|for you|cart|menu|favorites|collections|grocery list)\s*)+$/i;
const CHROME_LINE = new RegExp([
  '^advertisement$', '^sponsored', '^add a note$', '^your (?:private )?notes$', "^you don.?t have any notes",
  '^cooked(?!\\s+[a-z]{3,})', '^jump to recipe', '^print(?: recipe)?$', '^save(?: recipe| to recipe box)?$', '^saved\\b',
  '^share(?: recipe)?$', '^rate (?:this|the) recipe', '^leave a (?:review|comment)', '^(?:log|sign) in',
  '^subscribe', '^read (?:more|comments)', '^\\d+ (?:comments|ratings|reviews)$', '^(?:yield|scale|convert)(?:\\s+(?:yield|scale|convert))*$',
  '^add (?:a )?comment', 'find related content', '^search$', '^(?:less|more|see more|show more|\\.\\.\\. ?more)\\W*\\w?$',
  '^add to grocery list', 'shop (?:on instacart|ingredients)', '^rating\\b', '^comments\\b', '^time\\s*\\d',
  '^overview\\b.*\\bcook mode', 'food stylist', 'for the new york times\\.?$', '^photo(?:graph)? by\\b',
  '^enjoy!*$', '^(?:follow|like|subscribe)\\b.*\\b(?:recipes?|more)\\b',
].join('|'), 'i');

function lettersOnly(s) { return s.replace(/^[^A-Za-z]+/, ''); }

// Lines that are mostly hashtags, or have no words at all (like counts, stray marks).
function isNoiseLine(t) {
  const words = t.split(/\s+/).filter(Boolean);
  if (words.length && words.filter(w => w.startsWith('#')).length / words.length >= 0.5) return true;
  if (/^(?:(?:step|stage)\s*)?\d{1,2}\s*[.):]?$/i.test(t)) return false; // a step number on its own line
  if (!/[A-Za-z]{2}/.test(t)) return true;
  // A row of icons read as letters: "A Pl Q Oy W"
  return words.length >= 3 && !/\d/.test(t) && words.every(w => w.replace(/\W/g, '').length <= 2);
}
// "Austin, TX · Austin" location tags on social posts.
const LOCATION = /^\W*[A-Z][a-z]+(?: [A-Z][a-z]+)*, (?:[A-Z]{2}\b|\S{1,3}\s*[-–·•])/;
// "Olivia Adriance · 2024-7-18": a poster's name followed by a date.
const AUTHOR_DATE = /^\W*([A-Z][a-z'’-]+(?:\s+[A-Z][a-z'’-]+){1,2})\s*[-–·•.,‘'’ ]*\d[\d\s\-/.°'’]{3,}\S{0,2}\s*$/;
const PERSON_NAME = /^\W*([A-Z][a-z'’-]+(?:\s+[A-Z][a-z'’-]+){1,2})\W*$/;

/** "< Marry Me Chicken Gi) (4 A" -> "Marry Me Chicken" */
function cleanTitleLine(s) {
  const words = s.split(/\s+/);
  const out = [];
  for (const w of words) {
    if (/^[A-Za-z][A-Za-z'’&-]*$/.test(w) || (out.length && /^(?:&|and|with|of|the|a)$/i.test(w))) out.push(w);
    else if (out.length) break;
  }
  while (out.length > 1 && /^[A-Z]{1,2}$/.test(out[out.length - 1])) out.pop(); // trailing icon letters ("GJ")
  // A real title bar reads like a title: starts with a capital, no stray single lowercase letters.
  if (!out.length || !/^[A-Z0-9]/.test(out[0]) || out.some(w => /^[a-z]$/.test(w))) return '';
  if (CHROME_LINE.test(out.join(' '))) return '';
  const t = out.join(' ');
  return t.length >= 3 ? t : '';
}

function stepNumbers(lines) {
  return lines.map(l => (l.text.match(/^step\s*(\d{1,2})\b/i) || [])[1]).filter(Boolean).map(Number);
}

/**
 * Where does the start of page B overlap the end of page A?
 * Tolerates a line read on one page but missed on the other.
 */
function align(A, B) {
  let best = null;
  for (let j = 0; j < Math.min(6, B.length); j++) {
    for (let i = A.length - 1; i >= Math.max(0, A.length - 80); i--) {
      if (!similar(A[i].text, B[j].text)) continue;
      let ia = i + 1, jb = j + 1, matched = 1, skips = 0;
      while (ia < A.length && jb < B.length) {
        if (similar(A[ia].text, B[jb].text)) { ia++; jb++; matched++; continue; }
        if (skips >= 3) break;
        if (ia + 1 < A.length && similar(A[ia + 1].text, B[jb].text)) { ia++; skips++; continue; }
        if (jb + 1 < B.length && similar(A[ia].text, B[jb + 1].text)) { jb++; skips++; continue; }
        break;
      }
      const reachesEnd = ia >= A.length - 1; // the last line of A may be cut off
      const strong = matched >= 2 || norm(A[i].text).length >= 25;
      if (reachesEnd && strong && (!best || matched > best.score)) best = { i, j, score: matched };
    }
    if (best) break;
  }
  return best;
}

/**
 * pages: [{ width, height, lines:[{text,y0,y1,brk}] }] in the order the person chose.
 * Returns { lines: [{text, brk}], titleHint, sourceHint, gaps }.
 */
function assemblePages(pages) {
  const screenshot = p => p.height / p.width > 1.9;
  const topZone = p => l => l.y1 < p.height * 0.12;
  const bottomZone = p => l => l.y0 > p.height * 0.88;

  // Text repeated at the top or bottom of several screenshots is app chrome.
  const repeatedTop = new Map(), repeatedBottom = new Map();
  for (const p of pages) {
    for (const l of p.lines.filter(topZone(p))) repeatedTop.set(norm(l.text), (repeatedTop.get(norm(l.text)) || 0) + 1);
    for (const l of p.lines.filter(bottomZone(p))) repeatedBottom.set(norm(l.text), (repeatedBottom.get(norm(l.text)) || 0) + 1);
  }

  // Pinned elements sit at the same spot on every screenshot (author line, video
  // caption stickers, like counts); scrolled content moves between screenshots.
  const placed = pages.map(p => p.lines.map(l => ({ key: norm(l.text), y: l.y0 / p.height })));
  const pinned = (pi, l) => {
    const key = norm(l.text), y = l.y0 / pages[pi].height;
    return key.length > 0 && placed.some((pl, qi) => qi !== pi && pl.some(o => Math.abs(o.y - y) < 0.015 && (o.key === key || looselySame(o.key, key))));
  };

  let titleHint = '', sourceHint = '';
  const cleaned = pages.map((p, index) => {
    const lines = [];
    let pendingBrk = false;
    for (const l of p.lines) {
      const key = norm(l.text);
      const inTop = topZone(p)(l), inBottom = bottomZone(p)(l);
      let drop = false;
      const author = l.text.match(AUTHOR_DATE);
      if (author) { if (!sourceHint) sourceHint = author[1]; drop = true; }
      else if (inTop && l.y1 < p.height * 0.06 && STATUS_BAR.test(l.text)) drop = true;
      else if (isNoiseLine(l.text) || LOCATION.test(l.text)) drop = true;
      else if (inTop && pages.length > 1 && repeatedTop.get(key) >= 2) {
        drop = true;
        if (!titleHint) titleHint = cleanTitleLine(lettersOnly(l.text));
      }
      else if (inBottom && pages.length > 1 && repeatedBottom.get(key) >= 2) drop = true;
      else if (pages.length > 1 && pinned(index, l)) {
        drop = true;
        const name = l.text.match(PERSON_NAME);
        if (name && !sourceHint && l.text.split(/\s+/).length <= 3) sourceHint = name[1];
      }
      else if (inBottom && TAB_WORDS.test(lettersOnly(l.text))) drop = true;
      else if (CHROME_LINE.test(lettersOnly(l.text).trim()) || CHROME_LINE.test(l.text.replace(/^(?:\S*[^A-Za-z\s]\S*\s+|[A-Za-z]{1,2}\s+)+/, ''))) drop = true;
      else if (screenshot(p) && inTop && pages.length === 1 && !titleHint && l.y1 < p.height * 0.11) {
        const t = cleanTitleLine(lettersOnly(l.text));
        if (t) { titleHint = t; drop = true; }
      }
      if (drop) { pendingBrk = pendingBrk || l.brk; continue; }
      lines.push({ text: l.text, brk: l.brk || pendingBrk });
      pendingBrk = false;
    }
    return { index, lines };
  });

  // Chain overlapping pages (screenshots scrolled with some overlap).
  const n = cleaned.length;
  const edges = [];
  for (let a = 0; a < n; a++) for (let b = 0; b < n; b++) {
    if (a === b) continue;
    const al = align(cleaned[a].lines, cleaned[b].lines);
    if (al) edges.push({ a, b, ...al });
  }
  edges.sort((x, y) => y.score - x.score);
  const next = new Array(n).fill(null), prev = new Array(n).fill(null), link = {};
  for (const e of edges) {
    if (next[e.a] !== null || prev[e.b] !== null) continue;
    let c = e.b; let cycle = false;           // avoid a -> ... -> a
    while (c !== null) { if (c === e.a) { cycle = true; break; } c = next[c]; }
    if (cycle) continue;
    next[e.a] = e.b; prev[e.b] = e.a; link[`${e.a}>${e.b}`] = e;
  }

  const chains = [];
  for (let s = 0; s < n; s++) {
    if (prev[s] !== null) continue;
    const order = [];
    for (let c = s; c !== null; c = next[c]) order.push(c);
    let merged = cleaned[order[0]].lines.slice();
    for (let k = 1; k < order.length; k++) {
      const e = link[`${order[k - 1]}>${order[k]}`];
      const B = cleaned[order[k]].lines;
      const offset = merged.length - cleaned[order[k - 1]].lines.length; // A's lines sit at the end of merged
      const cut = offset + e.i;
      const first = { ...B[e.j], brk: merged[cut] ? merged[cut].brk : B[e.j].brk };
      merged = merged.slice(0, cut).concat([first], B.slice(e.j + 1));
    }
    // Rank: an intro page (title, byline, times) comes first, then ingredients, then steps.
    const hasIngredients = merged.some(l => /^ingredients?\b/i.test(l.text));
    const steps = stepNumbers(merged);
    const hasSteps = steps.length > 0 || merged.some(l => /^(?:directions?|instructions?|method|preparation)\b/i.test(l.text));
    const hasIntro = merged.some(l => /^\(?\s*prep\b|^by [A-Z]|\bservings?\b|^serves\b|^yield/i.test(l.text));
    const rank = hasIngredients ? 1 : hasSteps ? 2 : hasIntro ? 0 : 1.5;
    chains.push({ merged, key: [rank, steps.length ? Math.min(...steps) : 999, order[0]] });
  }
  chains.sort((x, y) => x.key[0] - y.key[0] || x.key[1] - y.key[1] || x.key[2] - y.key[2]);

  // Where separate chains meet mid-sentence, something between them is probably missing.
  let gaps = 0;
  for (let c = 1; c < chains.length; c++) {
    const prev = chains[c - 1].merged, next = chains[c].merged;
    if (!prev.length || !next.length) continue;
    const end = prev[prev.length - 1].text, start = next[0].text;
    if (!/[.!?:)"”]$/.test(end) && /^[a-z]/.test(start)) gaps++;
  }

  // Safety net: drop exact repeats of long lines across separate chains.
  const seen = new Set();
  const lines = [];
  for (const ch of chains) {
    ch.merged.forEach((l, i) => {
      const key = norm(l.text);
      if (key.length >= 30 && seen.has(key)) return;
      seen.add(key);
      lines.push({ text: l.text, brk: i === 0 ? true : l.brk });
    });
  }
  if (lines.length) lines[0].brk = false;
  return { lines, titleHint, sourceHint, gaps };
}

function linesToText(lines) {
  return lines.map(l => (l.brk ? '\n' : '') + l.text).join('\n').trim();
}

// ================================================================
// On-device text recognition
// ================================================================

// On-device text recognition with Tesseract.js (loaded from a CDN on first use).
// The language data (~4 MB) downloads once and is then cached by the browser.


const TESSERACT_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
const MAX_SIDE = 2400; // text reads most accurately around this size; also keeps memory low on phones

let scriptPromise = null;
let workerPromise = null;
let progressHandler = null;
let quiet = false; // true while reading fraction digits, so progress doesn't jump around

function loadScript() {
  if (window.Tesseract) return Promise.resolve();
  if (scriptPromise) return scriptPromise;
  scriptPromise = new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = TESSERACT_URL;
    el.async = true;
    el.onload = resolve;
    el.onerror = () => {
      scriptPromise = null;
      el.remove();
      reject(new Error('The text reader could not load. Connect to the internet and try again (it works offline after the first scan).'));
    };
    document.head.appendChild(el);
  });
  return scriptPromise;
}

async function getWorker() {
  await loadScript();
  if (!workerPromise) {
    workerPromise = (async () => {
      const worker = await window.Tesseract.createWorker('eng', 1, {
        logger: m => !quiet && progressHandler && progressHandler(m),
      });
      await worker.setParameters({ tessedit_pageseg_mode: '3' }); // automatic layout: keeps paragraphs apart
      return worker;
    })().catch(err => { workerPromise = null; throw err; });
  }
  return workerPromise;
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error(`${file.name || 'That file'} isn't an image this browser can open. Try a JPEG or PNG.`)); };
    img.src = url;
  });
}

// Grayscale + contrast stretch. Returns the canvas plus its gray pixels for fraction repair.
async function prepareForOCR(file) {
  const img = await loadImage(file);
  const longSide = Math.max(img.naturalWidth, img.naturalHeight);
  let scale = 1;
  if (longSide > MAX_SIDE) scale = MAX_SIDE / longSide;
  else if (longSide < 1400) scale = Math.min(2, 1400 / longSide);
  const w = Math.round(img.naturalWidth * scale);
  const h = Math.round(img.naturalHeight * scale);

  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, w, h);

  const data = ctx.getImageData(0, 0, w, h);
  const px = data.data;
  const gray = new Uint8Array(w * h);
  const hist = new Uint32Array(256);
  for (let i = 0, j = 0; i < px.length; i += 4, j++) {
    const g = (px[i] * 0.299 + px[i + 1] * 0.587 + px[i + 2] * 0.114) | 0;
    gray[j] = g; hist[g]++;
  }
  const total = w * h;

  // Mostly-dark page (e.g. white caption text over a video): keep only the bright
  // text and turn it into black-on-white, which the reader handles far better.
  let acc0 = 0, median = 0;
  for (; median < 255; median++) { acc0 += hist[median]; if (acc0 >= total / 2) break; }
  if (median < 100) {
    for (let j = 0, i = 0; j < gray.length; j++, i += 4) {
      const v = gray[j] > 185 ? 0 : 255;
      gray[j] = v;
      px[i] = px[i + 1] = px[i + 2] = v;
    }
    ctx.putImageData(data, 0, 0);
    return { canvas, gray, width: w, height: h };
  }

  // Ignore the darkest/lightest 1% so stray shadows don't flatten the stretch.
  let lo = 0, hi = 255, acc = 0;
  for (; lo < 255; lo++) { acc += hist[lo]; if (acc > total * 0.01) break; }
  acc = 0;
  for (; hi > 0; hi--) { acc += hist[hi]; if (acc > total * 0.01) break; }
  const range = Math.max(1, hi - lo);
  for (let j = 0, i = 0; j < gray.length; j++, i += 4) {
    const v = Math.max(0, Math.min(255, ((gray[j] - lo) * 255) / range)) | 0;
    gray[j] = v;
    px[i] = px[i + 1] = px[i + 2] = v;
  }
  ctx.putImageData(data, 0, 0);
  return { canvas, gray, width: w, height: h };
}

// Draw one fraction digit (only its own pixels) at a fixed height with generous margins,
// the layout single-character recognition handles best.
function digitCanvas(part, gray, W, digitHeight) {
  const w = part.x1 - part.x0, h = part.y1 - part.y0;
  const small = document.createElement('canvas');
  small.width = w; small.height = h;
  const sctx = small.getContext('2d');
  const img = sctx.createImageData(w, h);
  img.data.fill(255);
  for (let i = 0; i < part.pts.length; i += 2) {
    const x = part.pts[i], y = part.pts[i + 1], v = gray[y * W + x], o = ((y - part.y0) * w + (x - part.x0)) * 4;
    img.data[o] = img.data[o + 1] = img.data[o + 2] = v;
  }
  sctx.putImageData(img, 0, 0);
  const s = digitHeight / h, pad = Math.round(digitHeight * 0.35);
  const c = document.createElement('canvas');
  c.width = Math.round(w * s) + 2 * pad; c.height = digitHeight + 2 * pad;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(small, pad, pad, Math.round(w * s), digitHeight);
  return c;
}

/**
 * Read one or more photos or screenshots of a recipe, in any order.
 * onProgress receives { label, fraction } with fraction from 0 to 1.
 * Returns { text, lines, titleHint } ready for parseRecipeText.
 */
async function readRecipePhotos(files, onProgress = () => {}) {
  const count = files.length;
  let page = 0;
  const label = () => (count > 1 ? `Reading photo ${page + 1} of ${count}` : 'Reading the recipe');
  progressHandler = m => {
    if (m.status === 'recognizing text') onProgress({ label: label(), fraction: (page + (m.progress || 0) * 0.9) / count });
    else if (/load|initializ/.test(m.status)) onProgress({ label: 'Getting the text reader ready', fraction: 0 });
  };

  onProgress({ label: 'Getting the text reader ready', fraction: 0 });
  const worker = await getWorker();

  const pages = [];
  try {
    for (page = 0; page < count; page++) {
      onProgress({ label: label(), fraction: page / count });
      const prepared = await prepareForOCR(files[page]);
      const { data } = await worker.recognize(prepared.canvas, {}, { text: true, blocks: true });

      // Repair misread fractions (½, ¼, ¾…) by reading their digits one at a time.
      const words = (data.blocks || []).flatMap(b => b.paragraphs.flatMap(p => p.lines.flatMap(l => l.words)));
      let digitMode = false;
      quiet = true;
      await repairFractions(words, prepared.gray, prepared.width, prepared.height, async part => {
        if (!digitMode) {
          await worker.setParameters({ tessedit_pageseg_mode: '10', tessedit_char_whitelist: '0123456789' });
          digitMode = true;
        }
        for (const size of [48, 72]) {
          const r = await worker.recognize(digitCanvas(part, prepared.gray, prepared.width, size));
          const digit = (r.data.text || '').trim().slice(0, 1);
          if (/^[1-9]$/.test(digit)) return digit;
        }
        return '';
      });
      if (digitMode) await worker.setParameters({ tessedit_pageseg_mode: '3', tessedit_char_whitelist: '' });
      quiet = false;

      pages.push(pageFromOCR(data, prepared.width, prepared.height));
    }
  } finally {
    progressHandler = null;
    quiet = false;
  }

  onProgress({ label: 'Putting the pages together', fraction: 1 });
  const { lines, titleHint, sourceHint, gaps } = assemblePages(pages);
  return {
    text: linesToText(lines),
    lines: pages.flatMap(p => p.lines.map(l => ({ text: l.text, height: l.height }))),
    titleHint, sourceHint, gaps,
  };
}

// Shrink a photo for storage alongside the recipe.
async function compressPhoto(file, maxSide = 1400, quality = 0.8) {
  const img = await loadImage(file);
  const scale = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(img.naturalWidth * scale);
  canvas.height = Math.round(img.naturalHeight * scale);
  canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', quality);
}

const fmtDate = ts => new Date(ts).toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' });
const plural = (n, one, many = `${one}s`) => `${n} ${n === 1 ? one : many}`;
const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

let toastTimer;
function toast(message) {
  toastEl.textContent = message;
  toastEl.classList.add('show');

  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2800);
}

function starRow(rating) {
  return [1, 2, 3, 4, 5].map(n => {
    const fill = rating >= n ? 'full' : rating >= n - 0.5 ? 'half' : 'empty';
    return `<span class="st ${fill}" aria-hidden="true">★</span>`;
  }).join('');
}
const ratingLabel = r => `${String(r).replace('.5', '½')} star${r === 1 ? '' : 's'}`;

function starsText(rating) {
  if (!rating) return '';
  return `<span class="stars-static" role="img" aria-label="Rated ${ratingLabel(rating)} out of 5">${starRow(rating)}</span>`;
}

function metaSentence(r) {
  const parts = [];
  if (r.servings) parts.push(/^\d/.test(r.servings) ? `Serves ${r.servings}` : r.servings);
  if (r.prepTime) parts.push(`Prep ${r.prepTime}`);
  if (r.cookTime) parts.push(`Cook ${r.cookTime}`);
  return parts.join('. ') + (parts.length ? '.' : '');
}

async function saveRecipe(recipe) {

}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  }
}

async function shareText(text) {
  if (navigator.share) {
    try { await navigator.share({ text }); return 'shared'; }
    catch (err) { if (err && err.name === 'AbortError') return 'cancelled'; }
  }
  return (await copyText(text)) ? 'copied' : 'failed';
}

// ---------- screen wake lock (keep the screen on while cooking) ----------

let wakeLock = null;
let wantWake = false;
async function setWakeLock(on) {
  wantWake = on;
  try {
    if (on && !wakeLock) {
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!on && wakeLock) {
      await wakeLock.release(); wakeLock = null;
    }
    return true;
  } catch { wantWake = false; return false; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && wantWake && !wakeLock) setWakeLock(true);
});

// ---------- routing ----------

function route() {
  const [name, id] = location.hash.replace(/^#\/?/, '').split('/');
  return { name: name || 'home', id: id ? decodeURIComponent(id) : null };
}

function render() {
  if (wantWake) setWakeLock(false);
  const r = route();
  const tab = { home: 'home', recipe: 'home', settings: 'home', edit: 'new', new: 'new', list: 'list' }[r.name] || 'home';
  document.querySelectorAll('.tab').forEach(t => {
    if (t.dataset.tab === tab) t.setAttribute('aria-current', 'page');
    else t.removeAttribute('aria-current');
  });
  document.body.dataset.view = r.name;

  switch (r.name) {
    case 'home': renderHome(); break;
    case 'recipe': renderRecipe(r.id); break;
    case 'new': renderForm(null); break;
    case 'edit': renderForm(r.id); break;
    case 'list': renderList(); break;
    case 'settings': renderSettings(); break;
    default: location.replace('#/'); return;
  }
  window.scrollTo(0, 0);
  view.focus({ preventScroll: true });
}

function filteredRecipes() {
  const q = state.filter.q.trim().toLowerCase();
  const list = state.recipes.filter(r => {
    if (state.filter.cat === 'fav' && !r.favorite) return false;
    if (!['all', 'fav'].includes(state.filter.cat) && r.category !== state.filter.cat) return false;
    if (!q) return true;
    const hay = [r.title, r.category, r.source, r.notes, ...(r.ingredients || [])].join(' ').toLowerCase();
    return q.split(/\s+/).every(word => hay.includes(word));
  });
  const by = {
    newest: (a, b) => b.createdAt - a.createdAt,
    az: (a, b) => a.title.localeCompare(b.title),
    rating: (a, b) => (b.rating || 0) - (a.rating || 0) || a.title.localeCompare(b.title),
    made: (a, b) => (b.timesMade || 0) - (a.timesMade || 0) || a.title.localeCompare(b.title),
  }[state.filter.sort];
  return list.sort(by);
}

function ingredientRow(ing, i, factor) {
  const { qty, item, header } = displayIngredient(ing, factor);
  if (header) return `<li class="ing-head" role="presentation"><h3>${esc(item)}</h3></li>`;
  return `<li><button class="ing" data-action="tick" data-index="${i}" aria-pressed="false"><span class="ing-qty">${esc(qty)}</span><span class="ing-item">${esc(item)}</span></button></li>`;
}

function recipeToText(r, factor = 1) {
  const out = [r.title];
  const meta = metaSentence(r);
  if (meta) out.push(meta);
  if (r.source) out.push(`From ${r.source}`);
  if (r.ingredients.length) out.push('', 'Ingredients', ...r.ingredients.map(i => (isHeader(i) ? `${i.slice(HEADER_MARK.length)}:` : `- ${scaleIngredient(i, factor)}`)));
  if (r.steps.length) out.push('', 'Method', ...r.steps.map((s, i) => `${i + 1}. ${s}`));
  if (r.notes) out.push('', 'Notes', r.notes);
  return out.join('\n');
}

      ${kind === 'step' ? `<span class="row-num" aria-hidden="true">${index + 1}</span>` : ''}

function autosize(el) {
  el.style.height = 'auto';
  el.style.height = `${el.scrollHeight + 2}px`;
}

function renumber(list) {
  const kind = list.dataset.kind;
  let n = 0;
  [...list.children].forEach(row => {
    const header = row.hasAttribute('data-header');
    const label = rowLabel(kind, n, header);
    if (!header) n++;
    const num = row.querySelector('.row-num');
    if (num) num.textContent = n;
    row.querySelector('.grip').setAttribute('aria-label', `Move ${label}. Drag, or use the arrow keys.`);
    row.querySelector('.row-input').setAttribute('aria-label', label);
    row.querySelector('.row-remove').setAttribute('aria-label', `Remove ${label}`);
  });
}

function addRow(list, value = '', after = null, focus = true, header = false) {
  const tmp = document.createElement('ol');
  tmp.innerHTML = editRow(list.dataset.kind, header ? HEADER_MARK + value : value, 0);
  const row = tmp.firstElementChild;
  list.insertBefore(row, after ? after.nextElementSibling : null);
  renumber(list);
  const input = row.querySelector('.row-input');
  autosize(input);
  if (focus) input.focus();
  return row;
}

function setListValues(list, values, flags = {}) {
  list.innerHTML = editList(list.dataset.kind, values, flags);
  list.querySelectorAll('.row-input').forEach(autosize);
}

function listValues(id) {
  return [...document.querySelectorAll(`#${id} .edit-row`)].map(row => {
    const v = row.querySelector('.row-input').value.replace(/\s+/g, ' ').trim();
    return v && row.hasAttribute('data-header') ? HEADER_MARK + v.replace(/:$/, '') : v;
  }).filter(Boolean);
}

// Drag to reorder (edit screen only). Pointer events work for touch and mouse.
function startDrag(e, grip) {
  const row = grip.closest('.edit-row');
  const list = row.parentElement;
  e.preventDefault();
  grip.setPointerCapture(e.pointerId);
  const grabOffset = e.clientY - row.getBoundingClientRect().top;
  let lastY = e.clientY;
  row.classList.add('dragging');
  list.classList.add('is-dragging');

  const place = () => {
    const y = lastY;
    let before = null;
    for (const sib of list.children) {
      if (sib === row) continue;
      const box = sib.getBoundingClientRect();
      if (y < box.top + box.height / 2) { before = sib; break; }
    }
    if (before !== row.nextElementSibling && before !== row) list.insertBefore(row, before);
    row.style.transform = '';
    const natural = row.getBoundingClientRect().top;
    row.style.transform = `translateY(${y - grabOffset - natural}px)`;
  };

  let raf = 0;
  const edgeScroll = () => {
    const edge = 90;
    const bottomLimit = window.innerHeight - 80; // keep clear of the tab bar
    let dy = 0;
    if (lastY < edge) dy = -Math.ceil((edge - lastY) / 6);
    else if (lastY > bottomLimit - edge) dy = Math.ceil((lastY - (bottomLimit - edge)) / 6);
    if (dy) { window.scrollBy(0, dy); place(); }
    raf = requestAnimationFrame(edgeScroll);
  };
  raf = requestAnimationFrame(edgeScroll);

  const move = ev => { lastY = ev.clientY; place(); };
  const end = () => {
    cancelAnimationFrame(raf);
    grip.removeEventListener('pointermove', move);
    grip.removeEventListener('pointerup', end);
    grip.removeEventListener('pointercancel', end);
    row.classList.remove('dragging');
    list.classList.remove('is-dragging');
    row.style.transform = '';
    renumber(list);
  };
  grip.addEventListener('pointermove', move);
  grip.addEventListener('pointerup', end);
  grip.addEventListener('pointercancel', end);
}

function moveWithKeys(e, grip) {
  if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
  e.preventDefault();
  const row = grip.closest('.edit-row');
  const list = row.parentElement;
  if (e.key === 'ArrowUp' && row.previousElementSibling) list.insertBefore(row, row.previousElementSibling);
  else if (e.key === 'ArrowDown' && row.nextElementSibling) list.insertBefore(row.nextElementSibling, row);
  else return;
  renumber(list);
  grip.focus();
  const pos = [...list.children].indexOf(row) + 1;
  document.getElementById('moveStatus').textContent = `Moved to position ${pos} of ${list.children.length}`;
}
