            <span class="tp-card"><span class="tp-num">${(english() ? {} : { speakeasy: 'I', izakaya: '一' })[id] || '1'}</span><span class="tp-lines"><i></i><i></i></span></span>
            <span class="tp-card"><span class="tp-num">${(english() ? {} : { speakeasy: 'II', izakaya: '二' })[id] || '2'}</span><span class="tp-lines"><i></i><i></i></span></span>
            <span class="tp-foot"><span class="tp-stars">★★★★</span><span class="tp-btn"></span></span>
          </span>
        </span>
      </span>
      <span class="gx-body">
        <span class="gx-where">${esc(p.country)}</span>
        <span class="gx-city">${esc(p.city)}</span>
        <span class="gx-theme">${esc(t.name)}</span>
        <span class="gx-note">${esc(p.note)}</span>
        <button class="btn btn-primary gx-use" data-use="${id}" aria-pressed="${on}"${clone ? ' tabindex="-1"' : ''}>${on ? useLabelOn() : `Cook in ${esc(p.city)}`}</button>
      </span>
    </article>`;
}
const useLabelOn = () => `<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg> Your kitchen`;

function openGlobe() {
  if (globeUI.open) return;
  const from = document.getElementById('globeWindow');
  const fromRect = from?.getBoundingClientRect();
  const home = state.settings.theme;
  const startIdx = Math.max(0, PLACE_ORDER.indexOf(home));
  // each card is lettered in its own theme's fonts: fetch those near the start, the rest as you swipe
  window.rbLoadThemeFonts(PLACE_ORDER.slice(Math.max(0, startIdx - 2), startIdx + 3));

  const instant = reducedMotion() || !fromRect;
  const el = document.createElement('div');
  el.className = 'gx';
  // start clipped to the window's shape, before it is ever drawn, so it can only grow
  if (!instant) { el.style.clipPath = insetFor(fromRect); el.classList.add('gx-enter'); }
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-modal', 'true');
  el.setAttribute('aria-labelledby', 'gxTitle');
  el.innerHTML = `
    <canvas class="gx-canvas" aria-hidden="true"></canvas>
    <header class="gx-head">
      <button class="gx-close" aria-label="Close the globe"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
      <div class="gx-titles"><h2 id="gxTitle">Tastes of the World</h2><p>Swipe the cards or spin the globe</p></div>
      <span aria-hidden="true"></span>
    </header>
    <div class="gx-rail" role="group" aria-label="Themes">${globeCard(PLACE_ORDER[PLACE_ORDER.length - 1], true)}${PLACE_ORDER.map(id => globeCard(id)).join('')}${globeCard(PLACE_ORDER[0], true)}</div>`;
  document.body.appendChild(el);

  const canvas = el.querySelector('.gx-canvas');
  const rail = el.querySelector('.gx-rail');
  const cards = [...rail.querySelectorAll('.gx-card')];
  const v = new GlobeView(canvas);
  Object.assign(globeUI, { open: true, closing: false, el, v, rail, cards, from, idx: -1, landed: -1,
    mode: 'rail', flight: null, drag: null, lastTouch: 0, programmatic: 0, trans: { t: 0, dir: 1, t0: performance.now() } });

  // start where the little window was, so the globe seems to grow out of it
  const mini = themeWindow && themeWindow.canvas.isConnected ? themeWindow : null;
  v.homeId = home; v.focusId = home;
  v.glowFor = { [home]: 1 };
  v.setPalette(home, true);
  if (mini) { v.cam.lat = mini.cam.lat; v.cam.lon = mini.cam.lon; } else { v.cam.lat = place(home).lat - LIFT; v.cam.lon = place(home).lon; }

  layoutGlobe();
  rail.scrollLeft = (startIdx + 1) * globeUI.stride;
  globeUI.scrollX = rail.scrollLeft;
  globeUI.fromLayout = mini && fromRect ? (() => {
    const cr = mini.canvas.getBoundingClientRect();
    return { cx: cr.left + mini.layout.cx, cy: cr.top + mini.layout.cy, R: mini.layout.R };
  })() : null;
  globeUI.fromRect = fromRect;
  if (!instant) {
    el.getBoundingClientRect();
    requestAnimationFrame(() => { el.style.clipPath = 'inset(0px round 0px)'; el.classList.remove('gx-enter'); });
    // once it has grown to full screen, drop the clip so the phone isn't masking every frame
    setTimeout(() => { if (globeUI.el === el && !globeUI.closing) el.style.clipPath = ''; }, 820);
  } else {
    globeUI.trans.t = 1;
  }
  if (from) from.classList.add('gw-away');

  view.inert = true;
  document.querySelector('.tabs')?.setAttribute('inert', '');
  document.documentElement.classList.add('gx-lock');

  wireGlobe();
  v.frame = globeFrame;
  globeLoop.add(v);
  setTimeout(() => el.querySelector('.gx-close')?.focus({ preventScroll: true }), 50);
}

function insetFor(r) {
  return `inset(${r.top}px ${innerWidth - r.right}px ${innerHeight - r.bottom}px ${r.left}px round 16px)`;
}

function layoutGlobe() {
  const g = globeUI, { el, rail, v } = g;
  if (!el) return;
  const w = el.clientWidth, h = el.clientHeight;
  const cardW = Math.min(w - 48, 352);
  const gap = 12;
  el.style.setProperty('--gx-card-w', cardW + 'px');
  el.style.setProperty('--gx-pad', (w - cardW) / 2 + 'px');
  el.style.setProperty('--gx-gap', gap + 'px');
  g.stride = cardW + gap;
  v.resize();
  const headEl = el.querySelector('.gx-head');
  const head = headEl.offsetTop + headEl.offsetHeight;
  // offsets ignore the rail's slide-in transform
  const railTop = rail.offsetTop ? rail.offsetTop + parseFloat(getComputedStyle(rail).paddingTop) : (h - 200);
  g.cardTop = railTop;
  g.scrollX = rail.scrollLeft;
  const room = railTop - head;
  const R = Math.max(80, Math.min(w * .47, room * .43));
  g.layout = { cx: w / 2, cy: head + room * .54, R };
  v.bounds = { top: head + 4, bottom: railTop - 14 };
}

function wireGlobe() {
  const g = globeUI, { el, rail, v, cards } = g;
  el.querySelector('.gx-close').addEventListener('click', () => closeGlobe());
  g.onKey = e => {
    if (e.key === 'Escape') { e.preventDefault(); closeGlobe(); return; }
    if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && !e.target.closest('input, textarea')) {
      e.preventDefault();
      const N = PLACE_ORDER.length;
      goToPlace(PLACE_ORDER[(g.idx + (e.key === 'ArrowRight' ? 1 : -1) + N) % N]);
    }
    if (e.key === 'Tab') { // keep focus inside the globe
      const f = [...el.querySelectorAll('button')].filter(b => !b.disabled && !b.closest('[data-clone]'));
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
      else if (!el.contains(document.activeElement)) { e.preventDefault(); first.focus(); }
    }
  };
  document.addEventListener('keydown', g.onKey); // on the document, since spinning the globe leaves focus on the page
  rail.addEventListener('scroll', () => {
    g.scrollX = rail.scrollLeft;
    if (performance.now() > g.programmatic) { g.flight = null; g.mode = 'rail'; }
    clearTimeout(g.wrapTimer);
    g.wrapTimer = setTimeout(wrapRail, 140);
  }, { passive: true });
  rail.addEventListener('touchstart', () => { g.railTouch = true; clearTimeout(g.wrapTimer); }, { passive: true });
  rail.addEventListener('touchend', () => { g.railTouch = false; clearTimeout(g.wrapTimer); g.wrapTimer = setTimeout(wrapRail, 140); }, { passive: true });
  rail.addEventListener('click', e => {
    const use = e.target.closest('[data-use]');
    if (use) { usePlace(use.dataset.use); return; }
    const card = e.target.closest('.gx-card');
    if (card && card.dataset.place !== PLACE_ORDER[g.idx]) goToPlace(card.dataset.place);
  });
  rail.addEventListener('focusin', e => {
    const card = e.target.closest('.gx-card');
    if (card && card.dataset.place !== PLACE_ORDER[g.idx] && e.target.matches(':focus-visible')) goToPlace(card.dataset.place);
  });

  // spinning the globe by hand
  const canvas = v.canvas;
  canvas.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    canvas.setPointerCapture(e.pointerId);
    g.drag = { id: e.pointerId, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now(), moved: false, vlon: 0, vlat: 0 };
  });
  canvas.addEventListener('pointermove', e => {
    const d = g.drag;
    if (!d || d.id !== e.pointerId) return;
    const dx = e.clientX - d.x, dy = e.clientY - d.y;
    if (!d.moved && Math.hypot(e.clientX - d.sx, e.clientY - d.sy) < 6) return;
    if (!d.moved) { d.moved = true; g.flight = null; g.mode = 'free'; }
    const now = performance.now(), dtm = Math.max(1, now - d.t);
    const R = v.layout.R * v.cam.zoom;
    const dlon = -dx / R / RAD, dlat = dy / R / RAD;
    v.cam.lon += dlon; v.cam.lat = clamp(v.cam.lat + dlat, -70, 75);
    d.vlon = d.vlon * .6 + (dlon / dtm * 1000) * .4;
    d.vlat = d.vlat * .6 + (dlat / dtm * 1000) * .4;
    d.x = e.clientX; d.y = e.clientY; d.t = now;
    g.lastTouch = now;
  });
  const end = e => {
    const d = g.drag;
    if (!d || d.id !== e.pointerId) return;
    g.drag = null;
    if (!d.moved) {
      const r = canvas.getBoundingClientRect();
      const hit = v.hitTest(e.clientX - r.left, e.clientY - r.top);
      if (hit) goToPlace(hit);
      return;
    }
    const idle = performance.now() - d.t > 80;
    v.cam.vlon = idle ? 0 : clamp(d.vlon, -400, 400);
    v.cam.vlat = idle ? 0 : clamp(d.vlat, -200, 200);
    g.lastTouch = performance.now();
  };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);

  g.onResize = () => { layoutGlobe(); if (g.idx >= 0) rail.scrollLeft = (g.idx + 1) * g.stride; g.scrollX = rail.scrollLeft; };
  window.addEventListener('resize', g.onResize);
}

// Fly straight to a place (a tapped pin, label or card), and bring its card to the middle.
function goToPlace(id) {
  const g = globeUI, v = g.v;
  const i = PLACE_ORDER.indexOf(id);
  if (i < 0 || !g.open) return;
  const fromF = llVec(v.cam.lat + LIFT, v.cam.lon);
  const to = placeVec(id);
  const ang = vangle(fromF, to);
  const still = reducedMotion();
  g.flight = still || ang < .02 ? null : { from: fromF, to, t0: performance.now(), dur: 650 + 1100 * Math.min(1, ang / 2.2), ang, id };
  g.mode = 'rail';
  g.programmatic = performance.now() + (g.flight ? g.flight.dur : 0) + 700;
  setFocus(i);
  const N = PLACE_ORDER.length, here = g.scrollX / g.stride;
  const slots = [i + 1, ...(i === 0 ? [N + 1] : []), ...(i === N - 1 ? [0] : [])];
  const slot = slots.reduce((a, b) => (Math.abs(b - here) < Math.abs(a - here) ? b : a));
  g.rail.scrollTo({ left: slot * g.stride, behavior: still ? 'auto' : 'smooth' });
  if (!g.flight) { v.cam.lat = place(id).lat - LIFT; v.cam.lon = wrapLon(place(id).lon, v.cam.lon); }
}

function setFocus(i) {
  const g = globeUI, v = g.v;
  if (i === g.idx) return;
  g.idx = i;
  const id = PLACE_ORDER[i];
  window.rbLoadThemeFonts(PLACE_ORDER.slice(Math.max(0, i - 2), i + 3));
  v.focusId = id;
  v.setPalette(id);
  if (!(id in v.glowFor)) v.glowFor[id] = 0;
  g.cards.forEach(c => c.classList.toggle('is-on', c.dataset.place === id));
}

async function usePlace(id) {
  const g = globeUI, v = g.v;
  if (!THEMES[id]) return;
  if (PLACE_ORDER[g.idx] !== id) goToPlace(id);
  if (id === state.settings.theme) return;
  if (!reducedMotion()) v.ripple(id, 'screen');
  await setTheme(id, { quiet: true });
  v.homeId = id;
  g.cards.forEach(c => {
    const b = c.querySelector('[data-use]'), on = c.dataset.place === id;
    b.setAttribute('aria-pressed', on);
    b.innerHTML = on ? useLabelOn() : `Cook in ${esc(place(c.dataset.place).city)}`;
    if (on) { c.classList.remove('just-chosen'); void c.offsetWidth; c.classList.add('just-chosen'); }
  });
  announce(`${THEMES[id].name} theme on`);
}

// Screen readers hear what changed even though the toast is hidden behind the globe.
function announce(text) {
  let live = document.getElementById('gxLive');
  if (!live && globeUI.el) {
    live = document.createElement('p');
    live.id = 'gxLive'; live.className = 'sr-only'; live.setAttribute('role', 'status');
    globeUI.el.appendChild(live);
  }
  if (live) live.textContent = text;
}

function globeFrame(now, dt) {
  const g = globeUI, v = this;
  if (!v.resize()) return;
  const still = reducedMotion();

  // open and close: grow out of (and back into) the window in Settings
  const T = g.trans;
  const tdur = g.closing ? 620 : 760;
  T.t = still ? (g.closing ? 0 : 1) : clamp(g.closing ? 1 - (now - T.t0) / tdur : (now - T.t0) / tdur, 0, 1);
  const e = easeInOut(T.t);
  const to = g.layout;
  const from = g.fromLayout || { cx: to.cx, cy: to.cy + 40, R: to.R * .6 };
  v.layout = { cx: from.cx + (to.cx - from.cx) * e, cy: from.cy + (to.cy - from.cy) * e, R: from.R + (to.R - from.R) * e };
  v.labelFade = smoothstep(.5, 1, T.t);

  // which card is in the middle of the rail
  // slots 1..N are the cards; slot 0 and N+1 are copies of the last and first
  const N = PLACE_ORDER.length;
  const f = clamp(g.scrollX / g.stride, 0, N + 1);
  const s0 = Math.min(N, Math.floor(f)), frac = f - s0;
  const slotPlace = sl => ((sl - 1) % N + N) % N;
  const i0 = slotPlace(s0), i1 = slotPlace(s0 + 1);
  if (!g.flight) setFocus(slotPlace(Math.round(f)));

  let zoomTo = 1;
  if (g.flight) {
    const fl = g.flight, t = clamp((now - fl.t0) / fl.dur, 0, 1), te = easeInOut(t);
    const F = slerp(fl.from, fl.to, te);
    const [la, lo] = vecLL(F);
    v.cam.lat = la - LIFT; v.cam.lon = wrapLon(lo, v.cam.lon);
    v.cam.vlat = v.cam.vlon = 0;
    zoomTo = 1 - .3 * Math.sin(Math.PI * te) * Math.min(1, fl.ang / 1.6);
    v.cam.zoom = zoomTo;
    v.arc = { a: fl.from, b: fl.to, t: te, alpha: 1, head: true };
    if (t >= 1) { g.flight = null; g.arcFade = { a: fl.from, b: fl.to, t0: now }; }
  } else if (g.mode === 'free') {
    // a flick keeps the globe turning for a moment
    const decay = Math.exp(-dt * 2.6);
    v.cam.lon += v.cam.vlon * dt; v.cam.lat = clamp(v.cam.lat + v.cam.vlat * dt, -70, 75);
    v.cam.vlon *= decay; v.cam.vlat *= decay;
    v.cam.zoom += (1 - v.cam.zoom) * (1 - Math.exp(-dt * 4));
    if (!g.drag && now - g.lastTouch > 3600) g.mode = 'rail'; // then drift home to the chosen city
  } else {
    // follow the rail: between two cards, the globe sits partway along the flight between their cities
    const a = placeVec(PLACE_ORDER[i0]), b = placeVec(PLACE_ORDER[i1]);
    const F = slerp(a, b, frac);
    const [la, lo] = vecLL(F);
    const ang = vangle(a, b);
    zoomTo = 1 - .2 * Math.sin(Math.PI * frac) * Math.min(1, ang / 1.4);
    const k = g.drag ? 0 : 1 - Math.exp(-dt * (T.t < 1 ? 5 : 9));
    v.cam.lat += (la - LIFT - v.cam.lat) * k;
    v.cam.lon += (wrapLon(lo, v.cam.lon) - v.cam.lon) * k;
    v.cam.zoom += (zoomTo - v.cam.zoom) * k;
    if (frac > .002 && frac < .998) {
      v.arc = { a, b, t: frac, alpha: Math.pow(Math.sin(Math.PI * frac), .5), head: true };
      g.arcFade = null;
    } else if (g.arcFade) {
      const t = (now - g.arcFade.t0) / 900;
      v.arc = t < 1 ? { a: g.arcFade.a, b: g.arcFade.b, t: 1, alpha: 1 - t, head: false } : null;
      if (t >= 1) g.arcFade = null;
    } else v.arc = null;
    // a ripple when you land somewhere new
    const settled = Math.abs(f - Math.round(f)) < .004 && Math.abs(la - LIFT - v.cam.lat) < 1.5;
    if (settled && g.landed !== g.idx && T.t >= 1) { g.landed = g.idx; if (!still) v.ripple(PLACE_ORDER[g.idx]); }
  }
  if (g.flight === null && v.arc && v.arc.head && g.mode !== 'rail') v.arc = null;

  // light up the chosen city's region
  for (const id of Object.keys(v.glowFor)) {
    const target = id === v.focusId && g.mode !== 'free' ? 1 : id === v.focusId ? .6 : 0;
    v.glowFor[id] += (target - v.glowFor[id]) * (1 - Math.exp(-dt * 4));
    if (v.glowFor[id] < .005 && id !== v.focusId) delete v.glowFor[id];
  }

  // settled on a city with nothing moving: half rate is plenty for the gentle pulse and twinkle
  const resting = !g.drag && !g.flight && g.mode === 'rail' && T.t >= 1 && !g.closing && !v.arc && !v.ripples.length
    && Math.abs(f - Math.round(f)) < .002 && Math.abs(v.cam.vlon) < .01;
  if (!resting || now - v.lastDraw > 30) v.draw(now, dt);

  if (g.closing && T.t <= 0) finishCloseGlobe();
}

// Resting on a copy at either end: hop to the real card, so the rail goes round and round.
function wrapRail() {
  const g = globeUI;
  if (!g.open || !g.rail || g.railTouch || g.drag) return;
  const N = PLACE_ORDER.length, f = g.rail.scrollLeft / g.stride, slot = Math.round(f);
  if (Math.abs(f - slot) > .02) { g.wrapTimer = setTimeout(wrapRail, 120); return; } // still gliding into place
  if (slot !== 0 && slot !== N + 1) return;
  const to = slot === 0 ? N : 1;
  g.rail.style.scrollSnapType = 'none';
  g.rail.scrollLeft = to * g.stride;
  g.scrollX = g.rail.scrollLeft;
  g.rail.getBoundingClientRect();
  g.rail.style.scrollSnapType = '';
}

function closeGlobe(instant = false) {
  const g = globeUI;
  if (!g.open || g.closing) { if (instant && g.open) finishCloseGlobe(); return; }
  g.closing = true;
  const from = document.getElementById('globeWindow');
  const r = from?.getBoundingClientRect();
  const visible = r && r.bottom > 0 && r.top < innerHeight;
  if (instant || reducedMotion() || !visible) { finishCloseGlobe(); return; }
  // shrink back into the window, which now shows the theme you chose
  if (themeWindow) {
    const id = state.settings.theme, p = place(id);
    themeWindow.homeId = themeWindow.focusId = id;
    themeWindow.setPalette(id, true);
    themeWindow.glowFor = { [id]: 1 };
    themeWindow.cam.lat = p.lat - LIFT; themeWindow.cam.lon = p.lon - 4;
    themeWindow.resize();
    const R = Math.min(themeWindow.h * .66, themeWindow.w * .42);
    g.fromLayout = { cx: r.left + themeWindow.w - R * .82, cy: r.top + themeWindow.h * .55, R };
  }
  g.flight = null; g.mode = 'rail';
  g.trans.t0 = performance.now();
  g.el.classList.add('gx-leave');
  g.el.style.transition = 'none';
  g.el.style.clipPath = 'inset(0px round 0px)';
  g.el.getBoundingClientRect();
  g.el.style.transition = '';
  g.el.style.clipPath = insetFor(r);
  const el = g.el;
  setTimeout(() => { if (globeUI.el === el) finishCloseGlobe(); }, 900); // in case the globe stopped drawing
}

function finishCloseGlobe() {
  const g = globeUI;
  if (!g.open) return;
  window.removeEventListener('resize', g.onResize);
  document.removeEventListener('keydown', g.onKey);
  g.el.remove();
  g.open = false; g.closing = false;
  view.inert = false;
  document.querySelector('.tabs')?.removeAttribute('inert');
  document.documentElement.classList.remove('gx-lock');
  const from = document.getElementById('globeWindow');
  if (from) { from.classList.remove('gw-away'); from.focus({ preventScroll: true }); }
  updateThemeWindow();
  if (themeWindow) themeWindow.dirty = true;
  Object.assign(globeUI, { el: null, v: null, rail: null, cards: null });
}

async function setTheme(id, { quiet = false } = {}) {
  if (!THEMES[id] || id === state.settings.theme) return;
  fadeColors();
  state.settings.theme = window.rbApplyTheme(id);
  const now = document.getElementById('themeNow');
  if (now) now.textContent = THEMES[id].name;
  document.getElementById('themeDots')?.setAttribute('data-theme', id);
  updateTaste();
  if (!globeUI.open) updateThemeWindow(); // with the globe open, the window catches up as it closes
  await saveSettings();
  if (!quiet) toast(`${THEMES[id].name} theme on`);
}

function fadeColors() {
  if (reducedMotion()) return;
  const root = document.documentElement;
  root.classList.add('theme-fade');
  clearTimeout(fadeColors.timer);
  fadeColors.timer = setTimeout(() => root.classList.remove('theme-fade'), 450);
}

async function setMode(mode) {
  if (mode === state.settings.mode) return;
  fadeColors();
  state.settings.mode = window.rbApplyMode(mode);
  await saveSettings();
  toast({ light: 'Light mode on', dark: 'Dark mode on', auto: 'Following your phone’s light and dark' }[state.settings.mode]);
}

// What the shortcut runs inside Safari: copy the page's recipe data blocks.
const WEB_SHORTCUT_JS = `var ld = Array.prototype.map.call(document.querySelectorAll('script[type="application/ld+json"]'), function (s) { return s.textContent; });
var site = (document.querySelector('meta[property="og:site_name"]') || {}).content || '';
completion(JSON.stringify({ recipeBox: 1, url: location.href, site: site, ld: ld }));`;
// Shares from the NYT Cooking app carry the recipe link plus a photo; keep just the recipe link.
const NYT_LINK_PATTERN = String.raw`https://cooking\.nytimes\.com/recipes/[^\s?#"'<>]+`;
// What it matches in a downloaded page (shares from the NYT Cooking app arrive as a link).
const WEB_SHORTCUT_PATTERN = '(?s)<script[^>]*application/ld\\+json[^>]*>.*?<\/script>'; // "<\/" keeps this page's own script tag intact

// Reading the clipboard has to start inside the tap itself, so this runs straight from the click.
function readClipboardNow() {
  try {
    if (navigator.clipboard && navigator.clipboard.readText) return navigator.clipboard.readText();
  } catch (err) { return Promise.reject(err); }
  return Promise.reject(new Error('Clipboard unavailable'));
}

async function pasteRecipe(reading) {
  let text;
  try { text = await reading; } catch { return openPasteBox(); } // no clipboard access: paste by hand
  return importWebRecipe(text);
}

function openPasteBox(problem = '') {
  const dlg = document.getElementById('sheet');
  dlg.innerHTML = `
    <div class="sheet-body">
      <h2 class="sheet-title">${problem ? 'No recipe found' : 'Paste a web recipe'}</h2>
      ${problem ? `<p>${esc(problem)}</p>` : ''}
      <p class="hint">Share a recipe to <b>Copy Recipe</b>, then touch and hold the box below and tap Paste.</p>
      <textarea class="paste-box" id="pasteBox" aria-label="Paste the recipe here" placeholder="Paste here"></textarea>
      <button class="btn btn-secondary btn-wide" data-close>Close</button>
    </div>`;
  if (!dlg.open) dlg.showModal();
}

async function importWebRecipe(text) {
  const found = recipeFromWebText(text);
  if (!found) {
    const t = String(text || '').trim();
    const problem = !t ? 'The clipboard is empty.'
      : /^https?:\/\/\S+$/.test(t) ? 'That’s a link, not the recipe. Share the recipe to Copy Recipe instead of copying the link; the shortcut copies the recipe itself.'
      : /<html|<script/i.test(t) ? 'That page doesn’t include recipe data. Open the recipe in Safari and share it from there.'
      : 'The clipboard doesn’t hold a recipe. Share a recipe to Copy Recipe first.';
    openPasteBox(problem);
    return;
  }
  const dlg = document.getElementById('sheet');
  if (dlg.open) dlg.close();

  const existing = found.sourceUrl && state.recipes.find(r => sameRecipeUrl(r.sourceUrl, found.sourceUrl));
  if (existing && !confirm(`“${existing.title}” is already in your Recipe Box. Replace it with this copy? Your rating, notes and photos stay.`)) {
    location.hash = `#/recipe/${encodeURIComponent(existing.id)}`;
    return;
  }
  toast(`Adding ${found.title}…`);
  const { image, ...fields } = found;
  const photo = existing && (existing.photos || []).length ? null : await keepWebPhoto(image);
  const recipe = {
    ...(existing || { id: uid(), createdAt: Date.now(), rating: 0, favorite: false, timesMade: 0, notes: '', images: [] }),
    ...fields,
    category: (existing && existing.category) || guessCategory(fields) || '',
    diet: (existing && existing.diet) || suggestDiet(fields),
    photos: photo ? [photo] : ((existing && existing.photos) || []),
  };
  try {
    await saveRecipe(recipe);
  } catch (e) {
    console.error(e);
    toast(/quota/i.test(e && e.name) ? 'This device is out of storage.' : 'Saving failed. Try again.');
    return;
  }
  toast(existing ? `Updated from ${found.sourceSite || 'the web'}` : `Added from ${found.sourceSite || 'the web'}`);
  if (location.hash === `#/recipe/${encodeURIComponent(recipe.id)}`) render();
  else location.hash = `#/recipe/${encodeURIComponent(recipe.id)}`;
}

// Keep the recipe's photo on this device when the site allows it; otherwise link to it.
async function keepWebPhoto(url) {
  if (!url) return '';
  try {
    const res = await within(fetch(url, { mode: 'cors' }), 8000);
    if (!res.ok) throw new Error(String(res.status));
    return await within(compressPhoto(await res.blob(), 1400, 0.8), 8000);
  } catch { return url; }
}

async function makeBackup() {
  const data = { app: 'recipe-box', version: 1, exportedAt: new Date().toISOString(), recipes: state.recipes, grocery: state.grocery };
  const name = `recipe-box-backup-${new Date().toISOString().slice(0, 10)}.json`;
  const file = new File([JSON.stringify(data)], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Recipe Box backup' }); return; }
    catch (err) { if (err.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(file);
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  toast('Backup saved');
}

async function restoreBackup(file) {
  try {
    const data = JSON.parse(await file.text());
    if (!data || !Array.isArray(data.recipes)) throw new Error('bad');
    const recipes = data.recipes.filter(r => r && r.id && r.title).map(r => ({
      ingredients: [], steps: [], images: [], rating: 0, timesMade: 0, createdAt: Date.now(), ...r,
    }));
    if (!confirm(`Restore ${plural(recipes.length, 'recipe')}? Recipes already saved are kept; matching ones are replaced by the backup copy.`)) return;
    await db.putManyRecipes(recipes);
    state.recipes = await db.allRecipes();
    if (Array.isArray(data.grocery) && data.grocery.length && !state.grocery.length) {
      state.grocery = data.grocery; await saveGrocery();
    }
    toast(`Restored ${plural(recipes.length, 'recipe')}`);
    renderSettings();
  } catch {
    toast("That file isn't a Recipe Box backup.");
  }
}

    box.innerHTML = ratingButtons(v);

  }

  if (hint) hint.textContent = v ? `${ratingLabel(v)}. Tap a star again for a half star.` : 'Rating cleared. Tap a star to rate.';
}

function redrawIngredients(r, focusIndex = null) {
  const list = document.querySelector('.ing-list'); if (!list) return;
  const crossed = new Set([...list.querySelectorAll('.ing[aria-pressed="true"]')].map(b => b.dataset.index));
  const factor = state.scale[r.id] || 1, units = state.units[r.id] || {};
  list.innerHTML = r.ingredients.map((ing, i) => ingredientRow(ing, i, factor, units[i] || 0)).join('');
  crossed.forEach(i => { const b = list.querySelector(`.ing[data-index="${i}"]`); if (b) { b.setAttribute('aria-pressed', 'true'); b.closest('.ing-row').classList.add('crossed'); } });
  if (focusIndex != null) list.querySelector(`.ing-qty[data-index="${focusIndex}"]`)?.focus({ preventScroll: true });
}

async function shareRecipe(r) {
  const result = await shareText(recipeToText(r, state.scale[r.id] || 1));
  if (result === 'copied') toast('Recipe copied');
}

async function deleteRecipe(r) {
  if (!confirm(`Delete “${r.title}”? This can't be undone.`)) return;
  await db.deleteRecipe(r.id);
  state.recipes = state.recipes.filter(x => x.id !== r.id);
  toast('Recipe deleted');
  location.hash = '#/';
}

// Photo viewer: scanned pages ("images") or photos of the dish ("photos", removable).
function openViewer(r, kind, index) {
  const dlg = document.getElementById('photoViewer');
  const list = r[kind] || [];
  if (!list.length) return;
  const i = Math.min(Math.max(index, 0), list.length - 1);
  dlg.dataset.kind = kind; dlg.dataset.index = i;
  document.getElementById('photoViewerImg').src = list[i];
  document.getElementById('photoViewerImg').alt = kind === 'photos' ? `Photo ${i + 1} of ${r.title}` : `Scanned page ${i + 1}`;
  document.getElementById('photoRemove').hidden = kind !== 'photos';
  document.getElementById('photoPrev').hidden = document.getElementById('photoNext').hidden = list.length < 2;
  if (!dlg.open) dlg.showModal();
}

async function addDishPhotos(r, files) {
  const images = [...files].filter(f => f.type.startsWith('image/') || /\.(heic|heif|jpe?g|png|webp)$/i.test(f.name));
  if (!images.length) return;
  toast(`Adding ${plural(images.length, 'photo')}…`);
  const added = await Promise.all(images.map(f => compressPhoto(f, 1600, 0.82)));
  r.photos = [...(r.photos || []), ...added];
  await saveRecipe(r);
  toast(`Added ${plural(added.length, 'photo')}`);
  state.recipeTab = { id: r.id, tab: 'photos' }; // show the photos that were just added
  renderRecipe(r.id);
}

// Recipe / Photos / Notes: switch panels in place, so crossed-off
// ingredients, finished steps and a half-typed note all survive the switch.
function showRecipeTab(key, focus = false) {
  if (!RECIPE_TABS.some(([k]) => k === key)) return;
  state.recipeTab.tab = key;
  view.querySelectorAll('.rtab').forEach(t => {
    const on = t.dataset.rtab === key;
    t.setAttribute('aria-selected', on);
    t.tabIndex = on ? 0 : -1;
    if (on && focus) t.focus();
  });
  view.querySelectorAll('.rpanel').forEach(p => { p.hidden = p.id !== `rpanel-${key}`; });
  if (key === 'notes') fitNotes(); // a hidden box can't measure itself, so size it now
}

async function setCategory(id, category) {
  const r = state.recipes.find(x => x.id === id); if (!r) return;
  r.category = category;
  await saveRecipe(r);
  toast(category ? `Moved to ${category}` : 'Removed from its section');
}

function currentRecipe() {
  const r = route();
  return r.name === 'recipe' ? state.recipes.find(x => x.id === r.id) : null;
}

  'clear-filters': () => { state.filter.q = ''; state.filter.cat = 'all'; renderHome(); },

  'rate': el => {
    const r = currentRecipe(); if (!r) return;
    const n = Number(el.dataset.star), cur = r.rating || 0;
    // n -> n-½ -> cleared -> n
    const next = cur === n ? n - 0.5 : cur === n - 0.5 ? 0 : n;
    setRating(next);
  },
  'fav': async el => {
    const r = currentRecipe(); if (!r) return;
    r.favorite = !r.favorite;
    await saveRecipe(r);
    el.setAttribute('aria-pressed', r.favorite);
    toast(r.favorite ? 'Added to favorites' : 'Removed from favorites');
  },
  'scale': el => {
    const r = currentRecipe(); if (!r) return;
    const f = Number(el.dataset.factor);
    state.scale[r.id] = f;
    document.querySelectorAll('.scaler button').forEach(b => b.setAttribute('aria-pressed', Number(b.dataset.factor) === f));
    const start = document.querySelector('.cook-start');
    if (start) {
      start.querySelector('.cook-start-x')?.remove();
      if (f !== 1) start.insertAdjacentHTML('beforeend', ` <span class="cook-start-x">· ${SCALES.find(([x]) => x === f)?.[1] || f + '×'}</span>`);
    }
    redrawIngredients(r);
  },
  'convert': el => {
    const r = currentRecipe(); if (!r) return;
    const i = Number(el.dataset.index);
    const views = unitViews(r.ingredients[i]);
    const units = state.units[r.id] || (state.units[r.id] = {});
    units[i] = ((units[i] || 0) + 1) % views;
    redrawIngredients(r, i);
  },
  'tick': el => {
    const on = el.getAttribute('aria-pressed') !== 'true';
    el.setAttribute('aria-pressed', on);
    el.closest('.ing-row')?.classList.toggle('crossed', on);
    const left = document.querySelectorAll('.ing[aria-pressed="false"]').length;
    const btn = document.getElementById('addToList');
    btn.disabled = left === 0;
    btn.textContent = left ? `Add ${plural(left, 'item')} to grocery list` : 'You have everything';
  },
  'step': el => el.classList.toggle('done'),
  'add-to-list': async () => {
    const r = currentRecipe(); if (!r) return;
    const factor = state.scale[r.id] || 1;
    const picked = [...document.querySelectorAll('.ing[aria-pressed="false"]')].map(b => scaleIngredient(r.ingredients[Number(b.dataset.index)], factor));
    const existing = new Set(state.grocery.filter(i => !i.checked && i.recipeId === r.id).map(i => i.text.toLowerCase()));
    const fresh = picked.filter(t => !existing.has(t.toLowerCase()));
    state.grocery.push(...fresh.map(text => ({ id: uid(), text, checked: false, recipeId: r.id, recipeTitle: r.title, addedAt: Date.now() })));
    await saveGrocery();
    toast(fresh.length ? `Added ${plural(fresh.length, 'item')} to your grocery list` : 'Those are already on your list');
  },
  'made': async () => {
    const r = currentRecipe(); if (!r) return;
    r.timesMade = (r.timesMade || 0) + 1;
    r.lastMade = Date.now();
    await saveRecipe(r);
    document.querySelector('.made-count').textContent = `Made ${plural(r.timesMade, 'time')}, most recently ${fmtDate(r.lastMade)}.`;
    toast('Noted');
  },
  'wake': async el => {
    const on = el.getAttribute('aria-pressed') !== 'true';
    const ok = await setWakeLock(on);
    if (!ok) { toast("This device won't keep the screen on from here."); return; }
    el.setAttribute('aria-pressed', on);
    toast(on ? 'Screen will stay on while this recipe is open' : 'Screen will sleep as usual');
  },
  'recipe-menu': () => { const r = currentRecipe(); if (r) openRecipeMenu(r); },
  'recipe-tab': el => showRecipeTab(el.dataset.rtab),
  'view-scans': () => { const r = currentRecipe(); if (r) openViewer(r, 'images', 0); },
  'view-photo': el => {
    const r = currentRecipe(); if (!r) return;
    const kind = el.dataset.kind || 'images';
    openViewer(r, kind, Number(el.dataset.index));
  },
  'auto-sort': async () => {
    const loose = state.recipes.filter(r => !CATEGORIES.includes(r.category));
    let moved = 0;
    for (const r of loose) { const c = guessCategory(r); if (c) { r.category = c; await saveRecipe(r); moved++; } }
    toast(moved ? `Sorted ${plural(moved, 'recipe')}. Change any of them from the recipe's ⋯ menu.` : 'Couldn’t tell where these go; pick a section for each.');
    renderHome();
  },
  'fix-issue': el => {
    const box = document.getElementById('issues');
    const x = box && box._issues && box._issues[Number(el.dataset.issue)];
    if (x) focusIssue(x);
  },
  'row-add-header': el => addRow(document.getElementById(el.dataset.list), '', null, true, true),

  'remove-photo': el => {
    const [p] = state.draft.photos.splice(Number(el.dataset.index), 1);
    if (p && p.file) URL.revokeObjectURL(p.src);
    renderPhotoTray();
  },
  'scan': () => runScan(),
  'copy-snippet': async el => {
    const src = document.getElementById(el.dataset.target);
    if (src) toast((await copyText(src.textContent)) ? 'Copied' : 'Copying failed on this device');
  },
  'copy-report': async () => {
    if (!state.lastScanReport) return;
    toast((await copyText(state.lastScanReport)) ? 'Scan report copied' : 'Copying failed on this device');
  },
  'row-add': el => addRow(document.getElementById(el.dataset.list)),
  'row-remove': el => {
    const row = el.closest('.edit-row');
    const list = row.parentElement;
    const target = row.nextElementSibling || row.previousElementSibling;
    row.remove();
    if (!list.children.length) addRow(list, '', null, false);
    renumber(list);
    (target || list.lastElementChild).querySelector('.row-input').focus();
  },

  'group': async el => { state.settings.groupBy = el.dataset.by; await saveSettings(); renderList(); },
  'gdel': async el => { state.grocery = state.grocery.filter(i => i.id !== el.dataset.id); await saveGrocery(); renderList(); },
  'export-list': async () => {
    const result = await shareText(groceryText());
    if (result === 'copied') toast('List copied. Paste it into a new note.');
    if (result === 'failed') toast('Sharing is not available here. Use Copy instead.');
  },
  'copy-list': async () => toast((await copyText(groceryText())) ? 'List copied. Paste it into a new note.' : 'Copying failed on this device.'),
  'clear-checked': async () => { state.grocery = state.grocery.filter(i => !i.checked); await saveGrocery(); renderList(); },
  'clear-list': async () => {
    if (!confirm('Clear the whole grocery list?')) return;
    state.grocery = []; await saveGrocery(); renderList();
  },

  'backup': () => makeBackup(),
  'delete-all': async () => {
    if (!confirm(`Delete all ${plural(state.recipes.length, 'recipe')} and clear the grocery list? This can't be undone.`)) return;
    await db.clearRecipes();
    state.recipes = []; state.grocery = [];

};

view.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || !view.contains(el)) return;
  if (el.dataset.action === 'paste-recipe') { e.preventDefault(); pasteRecipe(readClipboardNow()); return; }
  const fn = actions[el.dataset.action];
  if (!fn) return;
  e.preventDefault();
  // An error in one button shouldn't leave the screen unresponsive.
  Promise.resolve().then(() => fn(el, e)).catch(err => { console.error(err); toast('That didn’t work. Try again.'); });
});

view.addEventListener('pointerdown', e => {
  const grip = e.target.closest('[data-grip]');
  if (grip && (e.button === 0 || e.pointerType !== 'mouse')) startDrag(e, grip);
});

view.addEventListener('keydown', e => {
  // Arrow keys, Home and End move between the recipe's tabs.
  const rtab = e.target.closest('.rtab');
  if (rtab && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
    e.preventDefault();
    const keys = RECIPE_TABS.map(([k]) => k);
    const i = keys.indexOf(rtab.dataset.rtab);
    const next = e.key === 'Home' ? 0 : e.key === 'End' ? keys.length - 1
      : (i + (e.key === 'ArrowRight' ? 1 : -1) + keys.length) % keys.length;
    showRecipeTab(keys[next], true);
    return;
  }
  const grip = e.target.closest('[data-grip]');
  if (grip) return moveWithKeys(e, grip);
  const input = e.target.closest('.edit-row .row-input');
  if (!input) return;
  const row = input.closest('.edit-row');
  // Return starts a new row; Backspace in an empty row removes it.
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    addRow(row.parentElement, '', row);
  } else if (e.key === 'Backspace' && !input.value && row.parentElement.children.length > 1) {
    e.preventDefault();
    const prev = row.previousElementSibling || row.nextElementSibling;
    const list = row.parentElement;
    row.remove(); renumber(list);
    const t = prev.querySelector('.row-input');
    t.focus(); t.setSelectionRange(t.value.length, t.value.length);
  }
});

view.addEventListener('paste', e => {
  const input = e.target.closest('.edit-row .row-input');
  if (!input) return;
  const text = (e.clipboardData || window.clipboardData).getData('text');
  const parts = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  if (parts.length < 2) return;
  e.preventDefault();
  const row = input.closest('.edit-row');
  input.value = (input.value + ' ' + parts[0]).trim();
  autosize(input);
  let after = row;
  for (const p of parts.slice(1)) after = addRow(row.parentElement, p, after, false);
  after.querySelector('.row-input').focus();
});

view.addEventListener('input', e => {
  if (e.target.id === 'search') { state.filter.q = e.target.value; renderContents(); }
  if (e.target.classList.contains('notes-input')) autosize(e.target);
  if (e.target.classList.contains('row-input')) {
    autosize(e.target);
    const row = e.target.closest('.needs-check');
    if (row) { row.classList.remove('needs-check'); row.querySelector('.row-flag')?.remove(); }
    const unsure = e.target.closest('.edit-row.unsure');
    if (unsure) {
      unsure.classList.remove('unsure');
      unsure.querySelector('.row-doubt')?.remove();

  if (field) clearFieldDoubt(field);
});

view.addEventListener('change', async e => {
  const t = e.target;
  if (t.name === 'appearance') { await setMode(t.value); return; }
  if (t.dataset.setting === 'cityTag' || t.dataset.setting === 'cityNames') { state.settings[t.dataset.setting] = t.checked; await saveSettings(); return; }
  if (t.dataset.setting === 'worldLang') {
    state.settings.english = !t.checked;
    applyLanguage(state.settings.english);
    await saveSettings();
    const y = window.scrollY;
    render();
    requestAnimationFrame(() => window.scrollTo(0, y));
    toast(state.settings.english ? 'Everything in English' : 'World languages on');
    return;
  }
  if (t.dataset.categoryFor) { await setCategory(t.dataset.categoryFor, t.value); renderContents(); return; }
  if (t.hasAttribute('data-photo-input')) { const r = currentRecipe(); if (r) await addDishPhotos(r, t.files); t.value = ''; return; }
  if (t.id === 'sort') { state.filter.sort = t.value; renderContents(); }
  else if (t.id === 'photoInput') {
    const files = [...t.files].filter(f => f.type.startsWith('image/') || /\.(heic|heif|jpe?g|png|webp)$/i.test(f.name));
    state.draft.photos.push(...files.map(file => ({ file, src: URL.createObjectURL(file) })));
    // Number-aware name order (IMG_7945, IMG_7946…) is the fallback when pages don't overlap.
    state.draft.photos.sort((a, b) => (a.file && b.file) ? a.file.name.localeCompare(b.file.name, undefined, { numeric: true }) : 0);
    t.value = '';
    renderPhotoTray();
  }
  else if (t.id === 'restoreInput' && t.files[0]) { await restoreBackup(t.files[0]); t.value = ''; }
  else if (t.dataset.gid) {
    const item = state.grocery.find(i => i.id === t.dataset.gid);
    if (!item) return;
    item.checked = t.checked;
    t.closest('.g-item').classList.toggle('done', t.checked);
    await saveGrocery();
    document.querySelector('[data-action="clear-checked"]').disabled = !state.grocery.some(i => i.checked);
    const open = state.grocery.some(i => !i.checked);
    document.querySelector('[data-action="export-list"]').disabled = !open;
    document.querySelector('[data-action="copy-list"]').disabled = !open;
    const meta = document.getElementById('listMeta');
    if (meta) meta.textContent = `${plural(state.grocery.filter(i => !i.checked).length, 'item')} to buy`;
  }
});

// Cook mode
// ================================================================
// Cook mode (#/cook/<id>) shows one step at a time in big type with big Back / Next
// buttons, swipe, and arrow keys. Times in a step ("bake 25 minutes") are highlighted;
// tapping one starts that timer on the iPhone.

Object.assign(ICONS, {
  pot: '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 10h16v6.5a3.5 3.5 0 0 1-3.5 3.5h-9A3.5 3.5 0 0 1 4 16.5zM2 10h20M9 6.5c0-1 .8-1.5.8-2.5M14.2 6.5c0-1 .8-1.5.8-2.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>',

  pause: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 5v14M16 5v14" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>',
  play: '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></svg>',
  bell: '<svg viewBox="0 0 24 24" width="76" height="76" aria-hidden="true"><path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.6 2H4.4zM10 21h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
});

const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

// ---------- reading times out of a step ----------

const DUR_WORDS = { a: 1, an: 1, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10,
  eleven: 11, twelve: 12, fifteen: 15, twenty: 20, thirty: 30, forty: 40, 'forty-five': 45, fifty: 50, sixty: 60 };
const DUR_FRAC = { '½': .5, '¼': .25, '¾': .75, '⅓': 1 / 3, '⅔': 2 / 3 };
const DUR_NUM = String.raw`(?:\d+\s+\d\/\d|\d+\s*[½¼¾⅓⅔]|\d+(?:\.\d+)?|\d\/\d|[½¼¾⅓⅔]|forty-five|${Object.keys(DUR_WORDS).filter(w => w !== 'forty-five').join('|')})`;
const DUR_RE = new RegExp(String.raw`(^|[^\w.\/])(${DUR_NUM})(?:\s*(?:-|–|—|to|or)\s*(${DUR_NUM}))?[\s-]*(hours?|hrs?|minutes?|mins?|seconds?|secs?)(?![a-z])`, 'gi');
const HALF_HOUR_RE = /\bhalf(?:\s+an)?\s+hour\b/gi;
const TEMP_RE = /\b\d{2,3}\s*(?:°\s*[FC]?\b|º\s*[FC]?\b|degrees(?:\s*(?:F|C|Fahrenheit|Celsius)\b)?)/gi;

function durNumber(s) {
  s = s.trim().toLowerCase();
  if (s in DUR_WORDS) return DUR_WORDS[s];
  let m = s.match(/^(\d+)\s+(\d)\/(\d)$/);
  if (m) return +m[1] + m[2] / m[3];
  m = s.match(/^(\d+)\s*([½¼¾⅓⅔])$/);
  if (m) return +m[1] + DUR_FRAC[m[2]];
  m = s.match(/^(\d)\/(\d)$/);
  if (m) return m[1] / m[2];
  if (s in DUR_FRAC) return DUR_FRAC[s];
  return parseFloat(s);
}
const durUnit = u => (/^h/i.test(u) ? 3600 : /^m/i.test(u) ? 60 : 1);

// "Bake 25 to 30 minutes" -> [{ start, end, sec: 1500, hi: 1800 }]
function findDurations(text) {
  const out = [];
  for (const m of text.matchAll(DUR_RE)) {
    const unit = durUnit(m[4]);
    const lo = durNumber(m[2]), hi = m[3] ? durNumber(m[3]) : null;
    if (!(lo > 0)) continue;
    const start = m.index + m[1].length;
    out.push({ start, end: m.index + m[0].length, sec: Math.round(lo * unit), hi: hi > lo ? Math.round(hi * unit) : null });
  }
  for (const m of text.matchAll(HALF_HOUR_RE)) out.push({ start: m.index, end: m.index + m[0].length, sec: 1800, hi: null });
  out.sort((a, b) => a.start - b.start);
  // "1 hour and 15 minutes" is one time, not two
  const merged = [];
  for (const d of out) {
    const prev = merged[merged.length - 1];
    if (prev && !prev.hi && !d.hi && d.sec < prev.sec && /^\s*(?:,|and)?\s*$/i.test(text.slice(prev.end, d.start))) {
      prev.end = d.end; prev.sec += d.sec; continue;
    }
    if (prev && d.start < prev.end) continue;
    merged.push(d);
  }
  return merged.filter(d => d.sec >= 5 && d.sec <= 24 * 3600);
}

function fmtSpan(sec) {
  if (sec < 60) return `${sec} sec`;
  const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  return [h && `${h} hr`, m && `${m} min`].filter(Boolean).join(' ');
}
function fmtRange(d) {
  if (!d.hi) return fmtSpan(d.sec);
  const unit = d.hi < 60 ? 1 : d.hi < 3600 || d.hi % 3600 ? 60 : 3600;
  const word = { 1: 'sec', 60: 'min', 3600: 'hr' }[unit];
  return `${+(d.sec / unit).toFixed(2)}–${+(d.hi / unit).toFixed(2)} ${word}`;
}
function fmtClock(ms) {
  const s = Math.max(0, Math.ceil(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}` : `${m}:${String(sec).padStart(2, '0')}`;
}

// The step's text with its times turned into timer buttons and oven temperatures in bold.
function markStep(text, stepNo) {
  const marks = findDurations(text).map(d => ({ ...d, kind: 'dur' }));
  for (const m of text.matchAll(TEMP_RE)) marks.push({ start: m.index, end: m.index + m[0].length, kind: 'temp' });
  marks.sort((a, b) => a.start - b.start);
  let html = '', at = 0;
  for (const k of marks) {
    if (k.start < at) continue;
    html += esc(text.slice(at, k.start));
    const words = esc(text.slice(k.start, k.end));
    html += k.kind === 'dur'
      ? `<button class="ck-dur" data-action="ck-timer" data-sec="${k.sec}" data-label="Step ${stepNo} · ${esc(fmtSpan(k.sec))}" aria-label="${words}. Start a ${esc(fmtSpan(k.sec))} timer">${words}</button>`
      : `<strong class="ck-temp">${words}</strong>`;
    at = k.end;
  }
  return html + esc(text.slice(at));
}

// ---------- which ingredients a step uses ----------
// A best guess: the main word of each ingredient ("flour" in "2 cups all-purpose flour,
// sifted") is looked for in the step.

const ING_SKIP = new Set(('cup cups tablespoon tablespoons tbsp teaspoon teaspoons tsp ounce ounces pound pounds lbs gram grams pinch dash '
  + 'large small medium fresh freshly ground chopped minced diced sliced finely roughly thinly coarsely packed divided plus more taste '
  + 'serving optional about whole extra virgin unsalted salted kosher room temperature softened melted cold warm hot dried can cans jar '
  + 'package the and into cut peeled for garnish needed such each other').split(' '));

function ingredientKeys(text) {
  const { item } = displayIngredient(text);
  const head = item.toLowerCase().replace(/\([^)]*\)/g, ' ').split(/[,;:]| - /)[0];
  return head.split(/\s+(?:and|or|&)\s+|\//).map(part => {
    const words = (part.match(/[a-z][a-z'-]+/g) || []).filter(w => w.length > 2 && !ING_SKIP.has(w));
    return words[words.length - 1];
  }).filter(Boolean);
}

function stepUses(r, step) {
  const t = step.toLowerCase();
  const uses = [];
  r.ingredients.forEach((ing, i) => {
    if (isHeader(ing)) return;
    const hit = ingredientKeys(ing).some(k => {
      const stem = k.replace(/(?:es|s)$/, '');
      return stem.length > 2 && new RegExp(`\\b${escRe(stem)}(?:s|es)?\\b`).test(t);
    });
    if (hit) uses.push(i);
  });
  return uses;
}

// ---------- iPhone timers ----------
// A web app can't run the iPhone's timer itself, and iOS has no web link into the Clock app
// (clock-timer:// is refused as an invalid address). So every timer runs the user's
// "Recipe Timer" shortcut with the length in seconds when you tap a highlighted time in a step.
const TIMER_SHORTCUT = 'Recipe Timer';
function startClockTimer(sec) {
  sec = Math.round(sec);
  if (!(sec > 0)) return;
  location.href = `shortcuts://run-shortcut?name=${encodeURIComponent(TIMER_SHORTCUT)}&input=text&text=${sec}`;
}
try { localStorage.removeItem('recipe-box-timers'); } catch { /* left over from the old in-app timers */ }

// No zooming anywhere: iOS can ignore the viewport setting, so pinch gestures are stopped too.
['gesturestart', 'gesturechange'].forEach(type => document.addEventListener(type, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

// ---------- cook mode screen ----------

const cook = { pos: {}, checks: {}, custom: 5 };
const COOK_SIZES = 5;
const cookSize = () => Math.min(COOK_SIZES - 1, Math.max(0, state.settings.cookSize ?? 2));
const cookChecks = id => cook.checks[id] || (cook.checks[id] = new Set());
const hasIngredients = r => r.ingredients.some(i => !isHeader(i));
function cookRecipe() {
  const r = route();
  return r.name === 'cook' ? state.recipes.find(x => x.id === r.id) : null;
}

function renderCook(id) {
  const r = state.recipes.find(x => x.id === id);
  if (!r) return notFound();
  const first = hasIngredients(r) ? -1 : 0;
  if (cook.pos[id] == null || cook.pos[id] >= r.steps.length || cook.pos[id] < first) cook.pos[id] = first;
  const size = cookSize();
  view.innerHTML = `
    <div class="cook" id="cook" data-size="${size}" role="region" aria-label="Cook mode: ${esc(r.title)}">
      <header class="ck-top">
        <a class="ck-exit" href="#/recipe/${encodeURIComponent(r.id)}">${ICONS.close}Done</a>
        <div class="ck-tools">
          <button class="ck-tool" data-action="ck-size" data-d="-1" aria-label="Smaller text" ${size === 0 ? 'disabled' : ''}>A−</button>
          <button class="ck-tool big" data-action="ck-size" data-d="1" aria-label="Larger text" ${size === COOK_SIZES - 1 ? 'disabled' : ''}>A+</button>
          ${hasIngredients(r) ? `<button class="ck-tool ck-ing-btn" data-action="ck-ing" aria-haspopup="dialog">${ICONS.basket}<span>Ingredients</span></button>` : ''}
        </div>
      </header>
      <div class="ck-progress" id="ckProgress" role="group" aria-label="Steps"></div>
      <div class="ck-stage" id="ckStage" aria-live="polite"></div>
      <nav class="ck-nav" id="ckNav" aria-label="Step"></nav>
      <div class="ck-panel" id="ckPanel" role="dialog" aria-modal="true" aria-labelledby="ckPanelTitle" hidden></div>
    </div>`;
  if ('wakeLock' in navigator) setWakeLock(true); // keep the screen awake while cooking
  drawCook(r);
}

// An amount in cook mode: tap it to switch units, as on the recipe page.
function cookQty(d, i, cls = 'ck-qty') {
  if (!d.qty) return '';
  const alt = d.alt ? ` <span class="ck-alt">(${esc(d.alt)})</span>` : '';
  return d.convertible
    ? `<button class="${cls} convertible" data-action="ck-unit" data-index="${i}" aria-label="${esc(d.qty)}. Switch units">${esc(d.qty)}</button>${alt}`
    : `<span class="${cls}">${esc(d.qty)}</span>${alt}`;
}

function cookIngredientRows(r) {
  const factor = state.scale[r.id] || 1, units = state.units[r.id] || {}, checks = cookChecks(r.id);
  return r.ingredients.map((ing, i) => {
    const d = displayIngredient(ing, factor, units[i] || 0);
    if (d.header) return `<li class="ck-ing-head" role="presentation"><h3>${esc(d.item)}</h3></li>`;
    const on = checks.has(i);
    return `<li class="ck-ing${on ? ' on' : ''}" data-action="ck-check" data-index="${i}">
      <button class="ck-box" data-action="ck-check" data-index="${i}" aria-pressed="${on}" aria-label="${esc([d.qty, d.item].filter(Boolean).join(' '))}"></button>
      <span class="ck-line">${cookQty(d, i)} <span class="ck-item">${esc(d.item)}</span></span></li>`;
  }).join('');
}

// Redraw the lists after the units change, keeping the place and the focus.
function refreshCookLists(r, focusIndex = null) {
  const stage = document.getElementById('ckStage'), y = stage.scrollTop;
  drawCook(r);
  stage.scrollTop = y;
  const panel = document.getElementById('ckPanel');
  if (!panel.hidden && panel.dataset.kind === 'ingredients') {
    const body = panel.querySelector('.ck-panel-body'), py = body.scrollTop;
    body.innerHTML = `<ul class="ck-ings">${cookIngredientRows(r)}</ul>`;
    body.scrollTop = py;
  }
  if (focusIndex != null) {
    const scope = panel.hidden ? stage : panel;
    scope.querySelector(`[data-action="ck-unit"][data-index="${focusIndex}"]`)?.focus({ preventScroll: true });
  }
}

function gatherCount(r) {
  const total = r.ingredients.filter(i => !isHeader(i)).length;
  const n = cookChecks(r.id).size;
  return n >= total ? 'Everything’s out. Ready when you are.' : `${n} of ${total} set out. Tap each one as you get it ready.`;
}

function drawCook(r, dir = 0) {
  const n = r.steps.length, pos = cook.pos[r.id], first = hasIngredients(r) ? -1 : 0;
  const factor = state.scale[r.id] || 1, units = state.units[r.id] || {};
  const stage = document.getElementById('ckStage');
  const segs = [];
  for (let p = first; p < n; p++) {
    const name = p === -1 ? 'Get ready' : `Step ${p + 1}`;
    segs.push(`<button class="ck-seg${p < pos ? ' done' : ''}${p === pos ? ' current' : ''}" data-action="ck-jump" data-pos="${p}" aria-label="${name}"${p === pos ? ' aria-current="step"' : ''}></button>`);
  }
  document.getElementById('ckProgress').innerHTML = segs.join('');

  let body;
  if (!n) {
    body = `<p class="ck-kicker">Nothing to cook yet</p>
      <p class="ck-text">This recipe has no steps.</p>
      <a class="btn btn-secondary" href="#/edit/${encodeURIComponent(r.id)}">Add steps</a>`;
  } else if (pos === -1) {
    const batch = factor !== 1 ? `${SCALES.find(([f]) => f === factor)?.[1] || factor + '×'} batch` : '';
    body = `<p class="ck-kicker">Get ready${batch ? ` <span>· ${batch}</span>` : ''}</p>
      <h1 class="ck-title">${esc(r.title)}</h1>
      ${metaSentence(r) ? `<p class="ck-meta">${esc(metaSentence(r))}</p>` : ''}
      <ul class="ck-ings">${cookIngredientRows(r)}</ul>
      <p class="ck-count" id="ckCount">${gatherCount(r)}</p>`;
  } else if (pos >= n) {
    body = `<p class="ck-kicker">All done</p>
      <h1 class="ck-title">Enjoy your ${esc(r.title)}</h1>
      <p class="ck-meta">${r.timesMade ? `Made ${plural(r.timesMade, 'time')} before.` : 'First time making this one.'}</p>
      <div class="ck-done-actions">
        <button class="btn btn-primary" data-action="ck-made" id="ckMade">I made this</button>
        <a class="btn btn-secondary" href="#/recipe/${encodeURIComponent(r.id)}">Back to the recipe</a>
      </div>`;
  } else {
    const step = r.steps[pos];
    const uses = stepUses(r, step);
    body = `<p class="ck-kicker">Step ${pos + 1} <span>of ${n}</span></p>
      <p class="ck-text">${markStep(step, pos + 1)}</p>
      ${uses.length ? `<section class="ck-uses" aria-labelledby="ckUsesHead">
        <h2 class="ck-label" id="ckUsesHead">In this step</h2>
        <ul>${uses.map(i => { const d = displayIngredient(r.ingredients[i], factor, units[i] || 0);
          return `<li>${cookQty(d, i, 'q')} <span>${esc(d.item)}</span></li>`; }).join('')}</ul>
      </section>` : ''}`;
  }
  stage.innerHTML = `<div class="${dir > 0 ? 'ck-in-next' : dir < 0 ? 'ck-in-prev' : ''}">${body}</div>`;
  if (dir) stage.scrollTop = 0;

  const atStart = pos <= first;
  const nextLabel = pos === -1 ? 'Start cooking' : pos === n - 1 ? 'Finish' : 'Next step';
  const nav = document.getElementById('ckNav');
  nav.classList.toggle('solo', atStart);
  nav.innerHTML = `
    ${atStart ? '' : '<button class="ck-prev" data-action="ck-prev" aria-label="Previous step">‹ Back</button>'}
    ${!n || pos >= n
      ? `<a class="ck-next" href="#/recipe/${encodeURIComponent(r.id)}">Done</a>`
      : `<button class="ck-next" data-action="ck-next">${nextLabel} ›</button>`}`;
}

function cookGo(r, delta, to = null) {
  const first = hasIngredients(r) ? -1 : 0;
  const from = cook.pos[r.id];
  const next = Math.max(first, Math.min(r.steps.length, to ?? from + delta));
  if (next === from) return;
  cook.pos[r.id] = next;
  drawCook(r, Math.sign(next - from));
}

function openCookPanel(kind) {
  const r = cookRecipe(); if (!r) return;
  const panel = document.getElementById('ckPanel');
  const head = title => `<div class="ck-panel-head"><h2 id="ckPanelTitle">${title}</h2>
    <button class="ck-exit" data-action="ck-panel-close">${ICONS.close}Close</button></div>`;
  {
    panel.innerHTML = `${head('Ingredients')}
      <div class="ck-panel-body"><ul class="ck-ings">${cookIngredientRows(r)}</ul></div>`;
  }
  panel.dataset.kind = kind;
  panel.hidden = false;
  panel.querySelector('.ck-panel-head .ck-exit').focus({ preventScroll: true });
}
function closeCookPanel() {
  const panel = document.getElementById('ckPanel');
  if (!panel || panel.hidden) return false;
  panel.hidden = true; panel.innerHTML = '';
  document.querySelector('[data-action="ck-ing"]')?.focus({ preventScroll: true });
  return true;
}

Object.assign(actions, {
  'ck-next': () => { const r = cookRecipe(); if (r) cookGo(r, 1); },
  'ck-prev': () => { const r = cookRecipe(); if (r) cookGo(r, -1); },
  'ck-jump': el => { const r = cookRecipe(); if (r) cookGo(r, 0, Number(el.dataset.pos)); },
  'ck-size': async el => {
    const size = Math.min(COOK_SIZES - 1, Math.max(0, cookSize() + Number(el.dataset.d)));
    state.settings.cookSize = size;
    const box = document.getElementById('cook');
    box.dataset.size = size;
    box.querySelector('[data-d="-1"]').disabled = size === 0;
    box.querySelector('[data-d="1"]').disabled = size === COOK_SIZES - 1;
    await saveSettings();
  },
  'ck-ing': () => openCookPanel('ingredients'),
  'ck-panel-close': () => closeCookPanel(),
  'ck-check': el => {
    const r = cookRecipe(); if (!r) return;
    const i = Number(el.dataset.index), set = cookChecks(r.id);
    if (set.has(i)) set.delete(i); else set.add(i);
    view.querySelectorAll(`.ck-ing[data-index="${i}"]`).forEach(li => {
      li.classList.toggle('on', set.has(i));
      li.querySelector('.ck-box')?.setAttribute('aria-pressed', set.has(i));
    });
    const count = document.getElementById('ckCount');
    if (count) count.textContent = gatherCount(r);
  },
  'ck-unit': el => {
    const r = cookRecipe(); if (!r) return;
    const i = Number(el.dataset.index);
    const units = state.units[r.id] || (state.units[r.id] = {});
    units[i] = ((units[i] || 0) + 1) % unitViews(r.ingredients[i]);
    refreshCookLists(r, i);
  },
  'test-clock-timer': () => startClockTimer(10),
  'ck-timer': el => startClockTimer(Number(el.dataset.sec)),
  'ck-made': async el => {
    const r = cookRecipe(); if (!r) return;
    r.timesMade = (r.timesMade || 0) + 1;
    r.lastMade = Date.now();
    await saveRecipe(r);
    el.disabled = true;
    el.textContent = 'Marked as made';
    delete cook.pos[r.id]; // next time starts from the top
    cook.checks[r.id]?.clear();
    toast('Noted. Enjoy!');
  },
});

// Swipe left or right on the step to move between steps.
let swipe = null;
view.addEventListener('pointerdown', e => {
  if (!e.target.closest('#ckStage') || !e.isPrimary) return;
  swipe = { x: e.clientX, y: e.clientY, t: Date.now() };
});
view.addEventListener('pointerup', e => {
  if (!swipe) return;
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y, quick = Date.now() - swipe.t < 700;
  swipe = null;
  if (!quick || Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  const r = cookRecipe(); if (!r) return;
  cookGo(r, dx < 0 ? 1 : -1);
});
view.addEventListener('pointercancel', () => { swipe = null; });

// Arrow keys step through; Escape closes a panel, then leaves cook mode.
document.addEventListener('keydown', e => {
  if (document.body.dataset.view !== 'cook' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.matches?.(TYPING)) return;
  const r = cookRecipe(); if (!r) return;
  if (e.key === 'Escape') { e.preventDefault(); if (!closeCookPanel()) location.hash = `#/recipe/${encodeURIComponent(r.id)}`; return; }
  if (!document.getElementById('ckPanel').hidden) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); cookGo(r, 1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); cookGo(r, -1); }
});


// ---------- start ----------

async function boot() {
  try {
    const [recipes, grocery, settings] = await Promise.all([db.allRecipes(), db.get('grocery'), db.get('settings')]);
    state.recipes = recipes || [];
    state.grocery = grocery || [];
    state.settings = { ...state.settings, ...(settings || {}) };
    state.settings.mode = window.rbApplyMode(state.settings.mode);
    state.settings.theme = window.rbApplyTheme(state.settings.theme);
    applyLanguage(state.settings.english);
  } catch (err) {
    console.error(err);
    window.__recipeBoxStarted = true;
    view.innerHTML = `<section class="card sec"><h1 class="sec-title">Recipe Box can't open its storage</h1>
      <p>Private Browsing blocks saved data. Open Recipe Box in a regular Safari tab or from your Home Screen.</p></section>`;
    return;
  }
  updateListCount();
  window.addEventListener('hashchange', render);
  render();
  window.__recipeBoxStarted = true;
  if (db.memoryOnly) toast('Preview mode: recipes added here won’t be saved');
  else requestPersistence();
}

// Offline support needs a real web address; file previews don't have one.
try {
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    navigator.serviceWorker.register('./sw.js').catch(err => console.warn('Offline support unavailable', err));
  }
} catch (err) { console.warn('Offline support unavailable', err); }

boot();
  </script>
</body>
</html>
